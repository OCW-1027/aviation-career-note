<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>求人掲載のご案内（企業向け）</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Gowun+Dodum&family=Noto+Sans:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#2F8FE0;--sky2:#E7F1FC;--ink:#1d2a3a;--sub:#5b6b7d;--line:#e3ebf3;--bg:#fff;--card:#f7fbff;--hl:#FFE08A;--warn:#E5534B}
@media (prefers-color-scheme:dark){:root{--ink:#e8eef5;--sub:#a9b6c4;--line:#2a3a4c;--bg:#0f1720;--card:#16212d;--sky2:#17324d}}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP','Noto Sans KR',sans-serif;line-height:1.75}
body.ko{font-family:'Noto Sans KR','Noto Sans JP',sans-serif}
html[lang="en"] body{font-family:"Noto Sans","Noto Sans JP",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:24px 18px 60px}
header{background:linear-gradient(160deg,#6db8f2,#2F8FE0);color:#fff;border-radius:22px;padding:30px 24px;position:relative}
header h1{font-family:'Zen Maru Gothic','Gowun Dodum',sans-serif;font-size:clamp(22px,4vw,34px);margin:6px 0}
header p{margin:0;max-width:62ch;opacity:.95}
.langs{position:absolute;top:16px;right:16px;display:inline-flex;border-radius:999px;overflow:hidden;background:#fff}
.langs button{border:0;background:transparent;color:#1d5fa0;font:700 13px inherit;font-family:inherit;padding:6px 12px;min-width:44px;min-height:34px;cursor:pointer}
.langs button+button{border-left:1px solid #d6e6f6}
.langs button.on{background:#FFE08A;color:#3A2A00}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:18px -18px 0;padding:10px 18px;display:flex;gap:8px;overflow-x:auto}
nav a{flex:0 0 auto;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px}
h2{font-family:'Zen Maru Gothic','Gowun Dodum',sans-serif;font-size:22px;margin:40px 0 12px;padding-bottom:6px;border-bottom:3px solid var(--sky)}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.why div{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px 16px}
.why b{display:block;margin-bottom:4px;color:#1d5fa0}
.steps{counter-reset:s;display:grid;gap:8px}
.steps div{counter-increment:s;border:1px solid var(--line);border-radius:14px;padding:10px 14px 10px 52px;position:relative}
.steps div::before{content:counter(s);position:absolute;left:14px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--sky);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
table.plan{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.plan th,.plan td{border-top:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.plan thead th{background:var(--sky2);text-align:center}
.plan tbody th{background:var(--card);text-align:center;width:22%}
.plan td{text-align:center}
.price{font-weight:700;font-size:18px;color:var(--sub)}
.note{font-size:13px;color:var(--sub);margin:8px 2px}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;border:1px solid var(--line);border-radius:18px;padding:18px}
form .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
input,select,textarea{font:inherit;font-weight:400;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:80px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--hl);outline-offset:1px}
.req::after{content:" *";color:var(--warn)}
.agree{flex-direction:row;align-items:flex-start;font-weight:400}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns button{border:0;background:var(--sky);color:#fff;border-radius:12px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
.btns button.sec{background:var(--bg);color:var(--sky);border:1px solid var(--sky)}
.err{color:var(--warn);font-size:14px;min-height:1.2em}
.preview{display:none;margin-top:16px;border:2px solid var(--sky);border-radius:18px;overflow:hidden}
.preview.show{display:block}
.pv-top{background:var(--sky2);padding:14px 18px}
.pv-top .co{font-size:13px;color:var(--sub)}
.pv-top h3{margin:2px 0 6px;font-size:20px}
.tags span{display:inline-block;font-size:12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);padding:1px 10px;margin:2px 4px 2px 0}
.pv-body{display:grid;grid-template-columns:140px 1fr}
.pv-body b{background:var(--card);padding:8px 12px;border-top:1px solid var(--line);text-align:center;font-size:14px}
.pv-body span{padding:8px 14px;border-top:1px solid var(--line);white-space:pre-line}
.tmpl{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tmpl .r{display:grid;grid-template-columns:170px 1fr;border-top:1px solid var(--line)}
.tmpl .r:first-child{border-top:0}
.tmpl .r b{background:var(--sky2);padding:9px 12px;text-align:center;display:flex;align-items:center;justify-content:center}
.tmpl .r span{padding:9px 14px}
.rules{border:1px solid #f3c7c4;background:#fdf1f0;border-radius:14px;padding:12px 16px;color:#5c1f1b}
.rules li{margin:4px 0}
footer{margin-top:40px;color:var(--sub);font-size:13px;text-align:center}
@media (max-width:680px){form{grid-template-columns:1fr}.pv-body,.tmpl .r{grid-template-columns:1fr}.plan{font-size:14px}}
/* サイト共通の上部メニュー・フッター（site.js）— このページの header/nav/.langs/footer の規則を打ち消す */
.topbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1080px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.topbar .brand{font-family:'Zen Maru Gothic','Gowun Dodum',sans-serif;font-weight:900;font-size:19px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px;white-space:nowrap}
.topbar .brand svg{flex:0 0 auto}
.topbar nav.menu{position:static;margin:0;padding:0;border:0;background:none;display:flex;gap:4px;overflow-x:auto;flex:1}
.topbar nav.menu a{flex:0 0 auto;border:0;background:none;text-decoration:none;color:var(--ink);padding:6px 10px;border-radius:10px;font-size:14px;white-space:nowrap}
.topbar nav.menu a.on,.topbar nav.menu a:hover{background:var(--sky2);color:#1d5fa0}
.topbar .langs{position:static;display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg);flex:none}
.topbar .langs button{appearance:none;cursor:pointer;border:0;background:transparent;color:var(--sub);font:600 13px inherit;font-family:inherit;padding:6px 12px;min-width:44px;min-height:34px}
.topbar .langs button+button{border-left:1px solid var(--line)}
.topbar .langs button.on{background:var(--sky);color:#fff}
.site-foot{border-top:1px solid var(--line);margin-top:50px}
.site-foot .in{max-width:1080px;margin:0 auto;padding:20px 18px 40px;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--sub)}
.site-foot a{color:var(--sub)}
#lang{display:none}
#nav{top:57px}
@media (max-width:640px){.topbar .brand span{display:none}}
@media (max-width:420px){.topbar .langs button{padding:6px 8px;font-size:12px;min-width:0}}
</style>
</head>
<body data-page="biz">
<div class="topbar" id="siteTop"></div>
<div class="wrap">
<header><span class="langs" id="lang" role="group" aria-label="Language"></span><div id="kick"></div><h1 id="ttl"></h1><p id="lead"></p></header>
<nav id="nav"></nav>
<main>
<section id="why"><h2 data-t="h_why"></h2><div class="why" id="whyBox"></div></section>
<section id="flow"><h2 data-t="h_flow"></h2><div class="steps" id="stepBox"></div></section>
<section id="plan"><h2 data-t="h_plan"></h2><div style="overflow-x:auto"><table class="plan" id="planTbl"></table></div><p class="note" data-t="plan_note"></p></section>
<section id="tmpl"><h2 data-t="h_tmpl"></h2><p class="note" data-t="tmpl_note"></p><div class="tmpl" id="tmplBox"></div></section>
<section id="rules"><h2 data-t="h_rules"></h2><ul class="rules" id="ruleBox"></ul></section>
<section id="apply"><h2 data-t="h_apply"></h2>
<form id="f" novalidate></form>
<div class="preview" id="pv"></div>
</section>
</main>
<footer id="foot"></footer>
</div>
<div class="site-foot" id="siteFoot"></div>

function $(i){return document.getElementById(i)}
var FIELDS=[['company','text',1],['dept','text',1],['email','email',1],['tel','tel',0],['job','select',1],['emp','select',1],['place','text',1,1],['title','text',1,1],['wage','text',1,1],['hours','text',1,1],['lang','text',0,1],['start','text',0],['plan','select',1],['pubLang','select',1],['desc','textarea',1,1],['memo','textarea',0,1]];
function val(k){var e=$('f_'+k);return e?e.value.trim():''}
function langBar(){var g=$('lang');g.innerHTML=LANGS.map(function(l){return '<button type="button" data-l="'+l+'" lang="'+l+'" class="'+(l===lang?'on':'')+'" aria-pressed="'+(l===lang)+'">'+LBL[l]+'</button>'}).join('');
 Array.prototype.forEach.call(g.querySelectorAll('button'),function(b){b.onclick=function(){lang=b.getAttribute('data-l');try{localStorage.setItem('art-lang',lang)}catch(e){}render()}})}
function render(l){if(l&&LANGS.indexOf(l)>=0)lang=l;var t=T[lang],saved={};FIELDS.forEach(function(x){saved[x[0]]=val(x[0])});var ag=$('f_agree')&&$('f_agree').checked;
 document.body.className=lang;document.documentElement.lang=lang;['kick','ttl','lead','foot'].forEach(function(i){$(i).textContent=t[i]});langBar();
 Array.prototype.forEach.call(document.querySelectorAll('[data-t]'),function(e){e.textContent=t[e.getAttribute('data-t')]});
 $('nav').innerHTML=t.nav.map(function(n){return '<a href="#'+n[0]+'">'+n[1]+'</a>'}).join('');
 $('whyBox').innerHTML=t.why.map(function(w){return '<div><b>'+esc(w[0])+'</b>'+esc(w[1])+'</div>'}).join('');
 $('stepBox').innerHTML=t.steps.map(function(s){return '<div><b>'+esc(s[0])+'</b>　'+esc(s[1])+'</div>'}).join('');
 $('planTbl').innerHTML='<thead><tr>'+t.plan_head.map(function(h){return '<th>'+esc(h)+'</th>'}).join('')+'</tr></thead><tbody>'+t.plan_rows.map(function(r,i){return '<tr><th>'+esc(r[0])+'</th>'+r.slice(1).map(function(c){return '<td'+(i===t.plan_rows.length-1?' class="price"':'')+'>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody>';
 $('tmplBox').innerHTML=t.tmpl.map(function(r){return '<div class="r"><b>'+esc(r[0])+'</b><span>'+esc(r[1])+'</span></div>'}).join('');
 $('ruleBox').innerHTML=t.rules.map(function(r){return '<li>'+esc(r)+'</li>'}).join('');
 var F=t.f,h='';
 FIELDS.forEach(function(x){var k=x[0],type=x[1],req=x[2],full=x[3],lab='<span class="'+(req?'req':'')+'">'+esc(F[k])+'</span>',ph=F[k+'H']||'',ctl;
  if(type==='select'){var opts=F[k+'s'];ctl='<select id="f_'+k+'">'+opts.map(function(o,i){return '<option value="'+i+'">'+esc(o)+'</option>'}).join('')+'</select>'}
  else if(type==='textarea'){ctl='<textarea id="f_'+k+'" placeholder="'+esc(ph)+'"></textarea>'}
  else ctl='<input id="f_'+k+'" type="'+type+'" placeholder="'+esc(ph)+'">';
  h+='<label class="'+(full?'full':'')+'">'+lab+ctl+'</label>'});
 h+='<label class="agree full"><input type="checkbox" id="f_agree"> <span class="req">'+esc(F.agree)+'</span></label><div class="err full" id="err" role="alert"></div><div class="btns full"><button type="button" id="bPv">'+F.preview+'</button><button type="button" class="sec" id="bCp">'+F.copy+'</button><button type="button" class="sec" id="bMl">'+F.mail+'</button></div>';
 $('f').innerHTML=h;FIELDS.forEach(function(x){var e=$('f_'+x[0]);if(saved[x[0]])e.value=saved[x[0]]});if(ag)$('f_agree').checked=true;
 $('bPv').onclick=function(){if(check())showPv()};

function opt(k){var e=$('f_'+k);return e.options[e.selectedIndex].text}
function check(){var ok=FIELDS.every(function(x){return !x[2]||val(x[0])})&&$('f_agree').checked;$('err').textContent=ok?'':T[lang].f.errMsg;return ok}
function summary(){var F=T[lang].f;return FIELDS.map(function(x){var k=x[0];return '【'+F[k]+'】'+(x[1]==='select'?opt(k):val(k))}).join('\n')}
function showPv(){var F=T[lang].f,P=F.pv,rows=[['job',opt('job')],['place',val('place')],['emp',opt('emp')],['wage',val('wage')],['hours',val('hours')],['lang',val('lang')],['start',val('start')],['desc',val('desc')]].filter(function(r){return r[1]});
 $('pv').innerHTML='<div class="pv-top"><div class="co">'+esc(F.pvTitle)+'｜'+esc(val('company'))+'</div><h3>'+esc(val('title'))+'</h3><div class="tags"><span>'+esc(opt('job'))+'</span><span>'+esc(opt('emp'))+'</span><span>'+esc(opt('pubLang'))+'</span></div></div><div class="pv-body">'+rows.map(function(r){return '<b>'+esc(P[r[0]])+'</b><span>'+esc(r[1])+'</span>'}).join('')+'</div>';
 $('pv').classList.add('show');}
