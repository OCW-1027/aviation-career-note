 $('o_why').innerHTML=why(R);

function why(R){var y=t('yen'),has=R.jpy>0,g0=D.pax.groups[0]||{},th=R.pj>=0?fy(num(D.pax.table[R.pj].th)):'—',lo=R.cj>=0?fy(num(D.cg.table[R.cj].lo)):'—',W=[];
 var fl='<div class="flow"><div><span>'+t('avU')+'</span><b>'+(R.usd?'$'+f2(R.usd):'—')+'</b></div><i>×</i><div><span>'+t('avF')+'</span><b>'+(R.fx?f2(R.fx):'—')+'</b></div><i>＝</i><div class="k"><span>'+t('kJ')+'</span><b>'+(has?fy(R.jpy)+' '+y:'—')+'</b></div><i>→</i><div><span>'+t('pc')+'：'+esc(g0.name||'')+'</span><b>'+(has?(R.pa[0]>0?fy(R.pa[0])+' '+y:t('abo')):'—')+'</b></div><div><span>'+t('cc')+'：'+esc(D.cg.route||'')+'</span><b>'+(R.usd>0?(R.ca>0?fy(R.ca)+' '+t('ykg'):t('abo')):'—')+'</b></div></div>';
 if(!has)return fl;
 if(D.ref.mode!=='avg'){
  W.push(['平均燃油価格 ＝ 日別のケロシン価格の合計 ÷ 日数 ＝ <code>$'+f2(R.usd)+'</code>（'+R.nU+'日分）','평균 유가 = 일별 케로신 가격 합계 ÷ 일수 = <code>$'+f2(R.usd)+'</code>('+R.nU+'일분)','Average fuel price = sum of the daily kerosene prices ÷ number of days = <code>$'+f2(R.usd)+'</code> ('+R.nU+' days)']);
  W.push(['平均為替 ＝ 日別の為替の合計 ÷ 日数 ＝ <code>'+f2(R.fx)+' 円</code>（'+R.nF+'日分）。価格のない日・為替のない日は、それぞれの平均から除いています。','평균 환율 = 일별 환율 합계 ÷ 일수 = <code>'+f2(R.fx)+'엔</code>('+R.nF+'일분). 가격이 없는 날과 환율이 없는 날은 각각의 평균에서 뺐습니다.','Average rate = sum of the daily rates ÷ number of days = <code>'+f2(R.fx)+' yen</code> ('+R.nF+' days). Days with no price or no rate are left out of their own average.'])}
 W.push(['円換算 ＝ 平均燃油価格 × 平均為替 ＝ <code>'+f2(R.usd)+' × '+f2(R.fx)+' ＝ '+fy(R.jpy)+' 円</code>（1バレルあたり）','엔화 환산 = 평균 유가 × 평균 환율 = <code>'+f2(R.usd)+' × '+f2(R.fx)+' = '+fy(R.jpy)+'엔</code>(배럴당)','In yen = average fuel price × average rate = <code>'+f2(R.usd)+' × '+f2(R.fx)+' = '+fy(R.jpy)+' yen</code> per barrel']);
 W.push(R.pover?[t('over'),t('over'),t('over')]:['旅客：'+fy(R.jpy)+' 円は、適用表の「'+th+' 円を下回る」の行にあたります（色のついた行）。その行の金額が新しい額です。ちょうど境目の額のときは「下回って」いないので、1つ上の行になります。','여객: '+fy(R.jpy)+'엔은 적용표의 「'+th+'엔 미만」 행에 해당합니다(색이 칠해진 행). 그 행의 금액이 새 금액입니다. 정확히 경계 금액일 때는 「미만」이 아니므로 한 단계 위 행이 됩니다.','Passenger: '+fy(R.jpy)+' yen falls in the row “below '+th+' yen” (the highlighted row), which gives the new amount. A figure exactly on a boundary is not below it, so the next row up applies.']);
 W.push(R.cj<0?['貨物：平均燃油価格 $'+f2(R.usd)+' は適用表のいちばん低い区分（'+fy(R.cmin)+'ドル）に届かないので、廃止になります。','화물: 평균 유가 $'+f2(R.usd)+'는 적용표의 가장 낮은 구간('+fy(R.cmin)+'달러)에 못 미치므로 폐지가 됩니다.','Cargo: the average price of $'+f2(R.usd)+' is under the lowest bracket ('+fy(R.cmin)+' dollars), so the surcharge is abolished.']:['貨物：平均燃油価格 $'+f2(R.usd)+' は「'+lo+' 以上'+(R.chi!=null?' '+fy(R.chi)+' 未満':'')+'」の行にあたり、1kgあたり '+fy(R.ca)+' 円です。貨物は円に換算せず、ドルのままの価格で区分を決めます。','화물: 평균 유가 $'+f2(R.usd)+'는 「'+lo+' 이상'+(R.chi!=null?' '+fy(R.chi)+' 미만':'')+'」 행에 해당하며, kg당 '+fy(R.ca)+'엔입니다. 화물은 엔화로 환산하지 않고 달러 가격 그대로 구간을 정합니다.','Cargo: the average price of $'+f2(R.usd)+' falls in the row “'+lo+' or more'+(R.chi!=null?', under '+fy(R.chi):'')+'”, giving '+fy(R.ca)+' yen per kg. Cargo brackets use the dollar price directly, without converting to yen.']);
 W.push(['追加の燃油コスト ＝（平均燃油価格 − 基準の価格）× 年間の燃料消費量 ＝ <code>('+f2(R.usd)+' − '+f2(num(D.base))+') × '+fy(R.bbl)+' バレル ＝ $'+fy(R.costU)+'</code>、円では <code>× '+f2(R.fx)+' ＝ '+fy(R.costJ/1000)+' 千円</code>。基準の価格より上がった分だけが「追加」です。','추가 연료비 = (평균 유가 − 기준 가격) × 연간 연료 소비량 = <code>('+f2(R.usd)+' − '+f2(num(D.base))+') × '+fy(R.bbl)+'배럴 = $'+fy(R.costU)+'</code>, 엔화로는 <code>× '+f2(R.fx)+' = '+fy(R.costJ/1000)+'천 엔</code>. 기준 가격보다 오른 만큼만 「추가」입니다.','Extra fuel cost = (average price − baseline) × annual fuel consumption = <code>('+f2(R.usd)+' − '+f2(num(D.base))+') × '+fy(R.bbl)+' bbl = $'+fy(R.costU)+'</code>, or in yen <code>× '+f2(R.fx)+' = '+fy(R.costJ/1000)+' thousand yen</code>. Only the rise above the baseline counts as extra.']);
 W.push(['収入 ＝ 旅客数 × 金額 ＋ 貨物の重量（kg）× 1kgあたりの額 ＝ <code>'+fy(R.incP/1000)+' ＋ '+fy(R.incC/1000)+' ＝ '+fy(R.incJ/1000)+' 千円</code>。回収率 ＝ 収入 ÷ 追加の燃油コスト ＝ <code>'+pct(R)+'</code>。燃油サーチャージは燃油の値上がり分を補うためのものなので、収入が追加コストを超えない（100%以下）ことを確かめます。','수입 = 여객 수 × 금액 + 화물 중량(kg) × kg당 금액 = <code>'+fy(R.incP/1000)+' + '+fy(R.incC/1000)+' = '+fy(R.incJ/1000)+'천 엔</code>. 회수율 = 수입 ÷ 추가 연료비 = <code>'+pct(R)+'</code>. 유류할증료는 유가가 오른 만큼을 보전하기 위한 것이므로, 수입이 추가 비용을 넘지 않는지(100% 이하) 확인합니다.','Income = passengers × amount + cargo weight (kg) × amount per kg = <code>'+fy(R.incP/1000)+' + '+fy(R.incC/1000)+' = '+fy(R.incJ/1000)+' thousand yen</code>. Recovery ratio = income ÷ extra fuel cost = <code>'+pct(R)+'</code>. A fuel surcharge exists to cover the rise in fuel cost, so check that income does not exceed the extra cost (100% or less).']);
 return fl+'<ol class="why">'+W.map(function(w){return '<li>'+w[LI]+'</li>'}).join('')+'</ol>'}
