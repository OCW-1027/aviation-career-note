<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>会話練習 ― 日本語・韓国語・英語</title>
<meta name="description" content="空港・機内の仕事、旅行、毎日の暮らし、職場の会話を、日本語・韓国語・英語で聞いて、役になって話して練習します。">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--acc:#1769e0;--ink:#182431;--sub:#65717e;--line:#dfe4e8;--bg:#fff;--card:#fff;--soft:#eef3f7;--blue1:#eaf2fe;--ok:#147d64;--okbg:#e4f4ee;--ng:#c2410c;--ngbg:#fdeee6;--gold:#b89048}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans JP","Noto Sans KR",system-ui,sans-serif;line-height:1.65;-webkit-text-size-adjust:100%}
body.ko{font-family:Inter,"Noto Sans KR","Noto Sans JP",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 90px}
header{background:linear-gradient(145deg,#0a1b2e,#12314f);color:#fff;border-radius:22px;padding:26px 22px;position:relative}
header h1{font-size:clamp(22px,4vw,34px);margin:4px 0 8px;line-height:1.25}
header p{margin:0;opacity:.95;max-width:68ch}
.langs{position:absolute;top:14px;right:14px;display:inline-flex;border-radius:999px;overflow:hidden;background:#fff}.langs button{border:0;background:transparent;color:#1d5fa0;font:700 13px inherit;font-family:inherit;padding:6px 12px;min-width:44px;min-height:34px;cursor:pointer}.langs button+button{border-left:1px solid #d6e6f6}.langs button.on{background:#FFE08A;color:#3A2A00}
button{font-family:inherit}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.h2{font-size:17px;font-weight:800;margin:0 0 10px;letter-spacing:-.01em}
/* 設定 */
.set{display:grid;grid-template-columns:1fr;gap:12px}
.set .lab{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:0;min-height:44px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;padding:6px 8px}
.seg button.on{border-color:var(--acc);background:var(--acc);color:#fff}
.tg{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px}
.tg label{display:inline-flex;align-items:center;gap:8px;min-height:40px;cursor:pointer}
.tg input{width:20px;height:20px;accent-color:var(--acc);margin:0}
.warn{font-size:13px;color:#7a4a00;background:#fff6e0;border-radius:10px;padding:8px 12px;margin:10px 0 0}
@media (min-width:760px){.set{grid-template-columns:1fr 1fr}.set .tg{grid-column:1/-1}}
/* 今日の会話と記録 */
.top{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
.today{background:linear-gradient(135deg,#eaf2fe,#f4f8ff);border:1px solid #cfe0fb;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.today small{font-size:12.5px;font-weight:800;color:var(--acc);letter-spacing:.02em}
.today b{font-size:19px;line-height:1.35}
.today span{font-size:14px;color:var(--sub)}
.today .go{align-self:flex-start;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.stats b{display:block;font-size:24px;line-height:1.2;color:var(--ink)}
.stats span{display:block;font-size:12px;color:var(--sub);line-height:1.35}
.stats button{all:unset;cursor:pointer;display:block}
@media (min-width:760px){.top{grid-template-columns:1.4fr 1fr;align-items:start}}
/* ボタン */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 18px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.sub{background:#fff;color:var(--acc);border:1.5px solid var(--acc)}
.btn.ghost{background:transparent;color:var(--acc);padding:8px 6px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.seg button:focus-visible,.chip:focus-visible,.ib:focus-visible,.card:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
/* 分類 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px}
.chip{min-height:42px;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:6px 14px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.lv{font-weight:600}
.chip em{font-style:normal;opacity:.7;font-weight:600;margin-left:4px}
.cnt{font-size:13px;color:var(--sub);margin:4px 2px 10px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.grid{grid-template-columns:1fr 1fr}}
@media (min-width:940px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{display:flex;flex-direction:column;gap:4px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;color:var(--ink);font-size:14px;min-height:44px;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:#9bbbf0;box-shadow:0 10px 26px rgba(9,28,47,.07)}
.card .k{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--sub)}
.card b{font-size:16px;line-height:1.4}
.card .t2{font-size:13px;color:var(--sub)}
.card .rec{font-size:12px;color:var(--ok);font-weight:700}
.card .rec.no{color:var(--sub);font-weight:500}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap}
/* 会話の画面 */
.sc-h{display:flex;flex-direction:column;gap:6px}
.sc-h .k{font-size:12.5px;font-weight:700;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 12px}
.sc-h h2{margin:0;font-size:22px;line-height:1.35;letter-spacing:-.02em}
.sc-h .t2{font-size:14px;color:var(--sub)}
.sc-h p{margin:2px 0 0;font-size:15px}
.roles{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--sub)}
.rb{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:12px;font-weight:800;color:#fff;background:#5d6b7a;flex:none}
.rb.B{background:var(--acc)}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 4px;background:#fff;padding:6px 0}
@media (min-width:601px){.modes{position:sticky;top:0;z-index:5}}
.modes button{min-height:48px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;padding:4px 4px;line-height:1.25}
.modes button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tool{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:10px 0;font-size:14px}
.tool label{display:inline-flex;align-items:center;gap:8px}
.tool select{min-height:40px;max-width:100%;border:1px solid var(--line);border-radius:10px;padding:4px 8px;font:inherit;background:#fff;color:var(--ink)}
.tool input[type=range]{width:120px;accent-color:var(--acc)}
.msg{font-size:13.5px;background:var(--soft);border-radius:12px;padding:10px 12px;margin:8px 0;color:#3a4a5c}
.msg.w{background:#fff6e0;color:#6b4300}
/* せりふ */
.lines{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.ln{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:#fff;border-left:5px solid #9aa7b4}
.ln.B{border-left-color:var(--acc);background:#f7faff}
.ln.cur{box-shadow:0 0 0 3px #ffd56b}
.ln .who{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:4px}
.ln .who .me{background:#fff2c4;color:#6b4e00;border-radius:999px;padding:1px 8px;font-size:11.5px}
.tx{font-size:19px;line-height:1.55;font-weight:500;word-break:normal;overflow-wrap:anywhere}
body.ko .tx:lang(ko),.tx:lang(ko){word-break:keep-all}
.jr{font-size:13.5px;color:#5c6b7b;margin-top:2px;letter-spacing:.02em}
.hl{font-size:14.5px;color:#3d4c5c;margin-top:4px}
.nt{font-size:13.5px;background:#fffaf0;border-radius:10px;padding:8px 10px;margin-top:8px;color:#5a4500}
.nt b{margin-right:6px}
.act{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ib{display:inline-flex;align-items:center;gap:5px;min-height:40px;min-width:44px;padding:4px 12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;font-size:13.5px;font-weight:700;cursor:pointer}
.ib.on{border-color:var(--gold);color:#7a5a12;background:#fff8e6}
.ib.mic{border-color:#c9d8ee}
.ib.mic.rec{background:#fdeee6;border-color:var(--ng);color:var(--ng)}
.hide{border:2px dashed #b9c6d4;background:#fbfcfd;border-radius:12px;padding:10px 12px;margin-top:4px}
.hide .q{font-size:12.5px;color:var(--sub);font-weight:700}
.hide .hl{font-size:16px;color:var(--ink);margin-top:2px}
.reveal{width:100%;margin-top:8px}
.heard{margin-top:8px;font-size:14px;background:var(--soft);border-radius:10px;padding:8px 10px}
.heard .sc{font-weight:800}
.heard .sc.g{color:var(--ok)}.heard .sc.m{color:#a16207}.heard .sc.b{color:var(--ng)}
.bar2{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.bar2 .btn{flex:1 1 160px}
.fin{background:var(--okbg);color:#0f5a47;border-radius:14px;padding:14px;font-weight:700;margin-top:12px}
/* 言い換え */
.alt{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:#fff}
.alt .o{font-size:12.5px;font-weight:700;color:var(--sub)}
.alt .ot{font-size:16px;margin:2px 0 8px}
.alt .v{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
/* 確認 */
.qz{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}
.qz .qq{font-weight:700;font-size:16px;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;margin:8px 0 0;padding:12px 14px;min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:16px;cursor:pointer;line-height:1.5}
.opt small{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ng{border-color:var(--ng);background:var(--ngbg)}
.opt:disabled{cursor:default;color:var(--ink)}
.score{font-size:18px;font-weight:800;margin-top:12px}
/* 私のフレーズ */
.ph .from{font-size:12.5px;margin-top:6px}
.ph .from a,.ph .from button{color:var(--acc);font-weight:700;background:none;border:0;padding:0;cursor:pointer;font-size:12.5px;text-decoration:underline}
.empty{color:var(--sub);font-size:14px;padding:18px;text-align:center;border:1px dashed var(--line);border-radius:14px}
.foot{font-size:12.5px;color:var(--sub);margin-top:22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:600px){
 header{padding:22px 18px}
 .tx{font-size:18px}
 .modes{grid-template-columns:repeat(2,1fr)}
 .modes button{font-size:14px}
 .sc-h h2{font-size:20px}
 .tool input[type=range]{width:100px}
}
@media print{.modes,.act,.tool,.chips,.top,#setup{display:none!important}}

function lineHtml(s,i,o){var L=s.lines[i],T2=tgt(),H=hlp(),a=o||{},who=s.roles&&s.roles[L.r]?tx(s.roles[L.r],lang):L.r,k=pkey(s.id,i),sv=isSaved(k);
 var h='<div class="ln '+(L.r==='B'?'B':'A')+'" data-i="'+i+'"><div class="who"><span class="rb '+(L.r==='B'?'B':'A')+'">'+esc(L.r||'')+'</span>'+esc(who)+(a.me?'<span class="me">'+esc(t.you)+'</span>':'')+'</div>';
 var body='<div class="tx" lang="'+T2+'">'+esc(tx(L,T2))+'</div>'+(T2==='ja'&&L.jr&&on('furi',true)?'<div class="jr" lang="ja">'+esc(L.jr)+'</div>':'');
 var hint=(H!==T2&&on('tr',true)?'<div class="hl" lang="'+H+'">'+esc(tx(L,H))+'</div>':'');
 if(a.hide){h+='<div class="hide"><div class="q">'+esc(fm(t.say,{L:LNAME[lang][T2]}))+'</div><div class="hl" lang="'+H+'">'+esc(tx(L,H))+'</div></div>'+
   '<div class="ans"'+(st.rev[i]?'':' hidden')+'>'+body+'</div>'+
   '<div class="act">'+(st.rev[i]?'':'<button type="button" class="ib rv" data-i="'+i+'">'+esc(t.reveal)+'</button>')+(SRC?'<button type="button" class="ib mic" data-i="'+i+'">'+esc(t.mic)+'</button>':'')+'<button type="button" class="ib pl" data-i="'+i+'">'+esc(t.play)+'</button><button type="button" class="ib sv'+(sv?' on':'')+'" data-k="'+esc(k)+'" aria-pressed="'+sv+'">'+esc(sv?t.saved:t.save)+'</button></div><div class="heard" hidden></div>'}
 else{h+=body+hint+(a.note&&L.note?'<div class="nt"><b>'+esc(t.point)+'</b>'+esc(tx(L.note,H===T2?lang:H))+'</div>':'')+
   '<div class="act"><button type="button" class="ib pl" data-i="'+i+'">'+esc(t.play)+'</button><button type="button" class="ib sv'+(sv?' on':'')+'" data-k="'+esc(k)+'" aria-pressed="'+sv+'">'+esc(sv?t.saved:t.save)+'</button></div>'}
 return h+'</div>'}
function bindLines(root){root=root||document;
 Array.prototype.forEach.call(root.querySelectorAll('.ib.pl'),function(b){b.onclick=function(){sayLine(+b.getAttribute('data-i'),b.hasAttribute('data-a')?+b.getAttribute('data-a'):null)}});
 Array.prototype.forEach.call(root.querySelectorAll('.ib.sv'),function(b){b.onclick=function(){togglePh(b.getAttribute('data-k'),b)}});
 Array.prototype.forEach.call(root.querySelectorAll('.ib.rv'),function(b){b.onclick=function(){var i=+b.getAttribute('data-i');st.rev[i]=1;var a=document.querySelector('.ln[data-i="'+i+'"] .ans');if(a)a.hidden=false;b.remove()}});
 Array.prototype.forEach.call(root.querySelectorAll('.ib.mic'),function(b){b.onclick=function(){micStart(+b.getAttribute('data-i'),b)}})}

/* ── 会話の画面 ── */
function paintTool(){var el=$('tool');if(!el)return;var T2=tgt(),vs=vlist(T2),nm=S.set.voice[T2],m='';
 if(!SY)m='<p class="msg w" id="ttsMsg">'+esc(t.noTts)+'</p>';
 else{if(!vs.length)m='<p class="msg w" id="ttsMsg">'+esc(fm(t.noVoice,{L:LNAME[lang][T2]}))+'</p>';else if(ttsMsg)m='<p class="msg w" id="ttsMsg">'+esc(ttsMsg)+'</p>'}
 el.innerHTML=(st.mode===0?'<button type="button" class="btn" id="pa">'+esc(t.playAll)+'</button>':'')+
  '<label>'+esc(t.speed)+' <input type="range" id="rt" min="0.5" max="1.3" step="0.1" value="'+rate()+'" aria-label="'+esc(t.speed)+'"><span id="rtv">'+rate().toFixed(1)+'×</span></label>'+
  (vs.length>1?'<label>'+esc(t.voice)+' <select id="vc">'+vs.map(function(v){return '<option'+(v.name===nm?' selected':'')+'>'+esc(v.name)+'</option>'}).join('')+'</select></label>':'')+
  (st.mode===1?'<label><input type="checkbox" id="cbA"'+(on('auto',true)?' checked':'')+'>'+esc(t.auto)+'</label>':'');
 var mm=$('ttsBox');if(mm)mm.innerHTML=m;
 if($('pa'))$('pa').onclick=playAll;
 $('rt').oninput=function(){S.set.rate=+this.value;$('rtv').textContent=(+this.value).toFixed(1)+'×'};$('rt').onchange=save;
 if($('vc'))$('vc').onchange=function(){S.set.voice[T2]=this.value;save()};
 if($('cbA'))$('cbA').onchange=function(){S.set.auto=this.checked;save()}}
function paintScene(){var s=BY[st.id];if(!s){go({view:'list'},true);return}
 var T2=tgt(),H=hlp();
 var h='<div class="panel"><button type="button" class="btn ghost" id="bk">'+esc(t.back)+'</button>'+
  '<div class="sc-h"><span class="k"><span>'+esc(catName(s.cat))+'</span>'+stars(s.lv)+(S.s[s.id]&&S.s[s.id].n?'<span class="rec" style="color:var(--ok)">'+esc(fm(t.times,{n:S.s[s.id].n,d:fmtDate(S.s[s.id].d)}))+'</span>':'')+'</span>'+
  '<h2>'+esc(tx(s.title,lang))+'</h2>'+(T2!==lang?'<span class="t2" lang="'+T2+'">'+esc(tx(s.title,T2))+'</span>':'')+
  (s.scene?'<p><b>'+esc(t.sit)+'：</b>'+esc(tx(s.scene,lang))+'</p>':'')+
  '<div class="roles">'+['A','B'].map(function(r){return s.roles&&s.roles[r]?'<span><span class="rb '+r+'">'+r+'</span> '+esc(tx(s.roles[r],lang))+'</span>':''}).join('')+'</div></div>'+
  '<div class="modes" role="tablist">'+t.modes.map(function(m,i){return '<button type="button" role="tab" aria-selected="'+(st.mode===i)+'" class="'+(st.mode===i?'on':'')+'" data-m="'+i+'">'+esc(m)+'</button>'}).join('')+'</div>'+
  '<div id="ttsBox"></div><div class="tool" id="tool"></div><div id="mode"></div></div>';
 $('app').innerHTML=h;
 $('bk').onclick=function(){go({view:'list'})};
 Array.prototype.forEach.call(document.querySelectorAll('.modes button'),function(b){b.onclick=function(){go({view:'scene',id:s.id,mode:+b.getAttribute('data-m')},false,true)}});
 paintTool();paintMode()}
function paintMode(){var s=BY[st.id],el=$('mode'),T2=tgt(),H=hlp(),h='';stopTts();micStop();
 if(st.mode===0){h='<div class="lines">'+s.lines.map(function(L,i){return lineHtml(s,i,{note:1})}).join('')+'</div>';el.innerHTML=h;bindLines(el);return}
 if(st.mode===1){var R=st.role;
  h='<div class="tool"><span>'+esc(t.role)+'：</span><div class="seg" style="flex:1 1 260px">'+['A','B'].map(function(r){return '<button type="button" data-r="'+r+'" class="'+(R===r?'on':'')+'" aria-pressed="'+(R===r)+'">'+r+'　'+esc(s.roles&&s.roles[r]?tx(s.roles[r],lang):r)+'</button>'}).join('')+'</div></div>'+
   (SRC?'<p class="msg">'+esc(t.micNote)+'</p>':'<p class="msg">'+esc(t.noMic)+'</p>');
  h+='<div class="lines">';for(var i=0;i<=Math.min(st.step,s.lines.length-1);i++){var me=s.lines[i].r===R;h+=lineHtml(s,i,{me:me,hide:me})}h+='</div>';
  var end=st.step>=s.lines.length;
  h+=end?'<div class="fin" id="fin">'+esc(t.fin)+'</div><div class="bar2"><button type="button" class="btn" id="ag">'+esc(t.again)+'</button><button type="button" class="btn sub" id="sw">'+esc(t.swap)+'</button>'+(s.check.length?'<button type="button" class="btn sub" id="tc">'+esc(t.toCheck)+'</button>':'')+'</div>'
   :'<div class="bar2"><button type="button" class="btn" id="nx">'+esc(t.next)+'</button></div>';
  el.innerHTML=h;bindLines(el);
  Array.prototype.forEach.call(el.querySelectorAll('[data-r]'),function(b){b.onclick=function(){st.role=b.getAttribute('data-r');st.step=0;st.rev={};paintMode();autoRead()}});
  if($('nx'))$('nx').onclick=function(){st.step++;if(st.step>=s.lines.length){st.step=s.lines.length;record(s.id)}paintMode();var tg=st.step>=s.lines.length?$('fin'):el.querySelector('.ln[data-i="'+st.step+'"]');if(tg&&tg.scrollIntoView)try{tg.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}autoRead()};
  if($('ag'))$('ag').onclick=function(){st.step=0;st.rev={};paintMode();autoRead()};
  if($('sw'))$('sw').onclick=function(){st.role=st.role==='A'?'B':'A';st.step=0;st.rev={};paintMode();autoRead()};
  if($('tc'))$('tc').onclick=function(){go({view:'scene',id:s.id,mode:3},false,true)};
  return}
 if(st.mode===2){var any=false;h='<p class="msg">'+esc(t.altLead)+'</p><div class="lines">';
  s.lines.forEach(function(L,i){if(!Array.isArray(L.alt)||!L.alt.length)return;any=true;var who=s.roles&&s.roles[L.r]?tx(s.roles[L.r],lang):L.r;
   h+='<div class="alt ln '+(L.r==='B'?'B':'A')+'" data-i="'+i+'"><div class="who"><span class="rb '+(L.r==='B'?'B':'A')+'">'+esc(L.r)+'</span>'+esc(who)+'</div><div class="o">'+esc(t.orig)+'</div><div class="ot" lang="'+T2+'">'+esc(tx(L,T2))+'</div>'+
    (H!==T2&&on('tr',true)?'<div class="hl" lang="'+H+'" style="margin-top:-4px">'+esc(tx(L,H))+'</div>':'');
   L.alt.forEach(function(a,j){if(!a)return;var k=pkey(s.id,i,j),sv=isSaved(k);h+='<div class="v"><div class="tx" lang="'+T2+'">'+esc(tx(a,T2))+'</div>'+(T2==='ja'&&a.jr&&on('furi',true)?'<div class="jr" lang="ja">'+esc(a.jr)+'</div>':'')+(H!==T2&&on('tr',true)?'<div class="hl" lang="'+H+'">'+esc(tx(a,H))+'</div>':'')+
    '<div class="act"><button type="button" class="ib pl" data-i="'+i+'" data-a="'+j+'">'+esc(t.play)+'</button><button type="button" class="ib sv'+(sv?' on':'')+'" data-k="'+esc(k)+'" aria-pressed="'+sv+'">'+esc(sv?t.saved:t.save)+'</button></div></div>'});
   h+='</div>'});
  h+='</div>';el.innerHTML=any?h:'<p class="empty">'+esc(t.altNone)+'</p>';bindLines(el);return}
 if(st.mode===3){if(!s.check.length){el.innerHTML='<p class="empty">'+esc(t.chkNone)+'</p>';return}
  h='<p class="msg">'+esc(t.chkLead)+'</p><div class="lines">'+s.check.map(function(q,qi){var ord=q.opts.map(function(o,i){return i}).sort(function(a,b){return hashStr(s.id+qi+':'+a)-hashStr(s.id+qi+':'+b)}),A=st.ans[qi];
   return '<div class="qz" data-q="'+qi+'"><div class="qq" lang="'+H+'">'+(qi+1)+'. '+esc(tx(q.q,H))+'</div>'+ord.map(function(i){var c=A==null?'':(i===q.a?' ok':(i===A?' ng':''));return '<button type="button" class="opt'+c+'" data-o="'+i+'"'+(A!=null?' disabled':'')+'><span lang="'+T2+'">'+esc(tx(q.opts[i],T2))+'</span>'+(A!=null&&H!==T2?'<small lang="'+H+'">'+esc(tx(q.opts[i],H))+'</small>':'')+(A!=null&&i===q.a?' <b style="color:var(--ok)">✓ '+esc(t.right)+'</b>':(A!=null&&i===A?' <b style="color:var(--ng)">✗ '+esc(t.wrong)+'</b>':''))+'</button>'}).join('')+'</div>'}).join('')+'</div>';
  var na=Object.keys(st.ans).length;if(na>=s.check.length){var k=s.check.filter(function(q,qi){return st.ans[qi]===q.a}).length;h+='<p class="score" id="score">'+esc(fm(t.res,{n:s.check.length,k:k}))+'</p><div class="bar2"><button type="button" class="btn sub" id="rq">'+esc(t.again)+'</button></div>'}
  el.innerHTML=h;
  Array.prototype.forEach.call(el.querySelectorAll('.opt'),function(b){b.onclick=function(){var qi=+b.parentNode.getAttribute('data-q');if(st.ans[qi]!=null)return;st.ans[qi]=+b.getAttribute('data-o');if(Object.keys(st.ans).length>=s.check.length)record(s.id);paintMode()}});
  if($('rq'))$('rq').onclick=function(){st.ans={};paintMode()}}}
function autoRead(){if(st.mode!==1||!on('auto',true)||!SY||!vlist(tgt()).length)return;var s=BY[st.id];if(!s||st.step>=s.lines.length)return;var L=s.lines[st.step];if(L.r!==st.role)sayLine(st.step)}

/* ── 私のフレーズの画面 ── */
function paintPhr(){var T2=tgt(),H=hlp(),P=S.ph.map(phResolve).filter(Boolean);
 var h='<div class="panel ph"><button type="button" class="btn ghost" id="bk">'+esc(t.back)+'</button><h2 class="h2" style="font-size:21px;margin-top:4px">'+esc(t.phrH)+'</h2><p class="msg">'+esc(t.phrLead)+'</p>'+
  '<div id="ttsBox"></div><div class="tool" id="tool" hidden></div>';
 h+=P.length?'<div class="lines">'+P.map(function(p){var L=p.s.lines[p.i];return '<div class="ln '+(L.r==='B'?'B':'A')+'"><div class="tx" lang="'+T2+'">'+esc(tx(p.o,T2))+'</div>'+(T2==='ja'&&p.o.jr&&on('furi',true)?'<div class="jr" lang="ja">'+esc(p.o.jr)+'</div>':'')+(H!==T2?'<div class="hl" lang="'+H+'">'+esc(tx(p.o,H))+'</div>':'')+
  '<div class="act"><button type="button" class="ib pp" data-k="'+esc(p.k)+'">'+esc(t.play)+'</button><button type="button" class="ib rm" data-k="'+esc(p.k)+'">'+esc(t.remove)+'</button></div><div class="from">'+esc(tx(p.s.title,lang))+' · <button type="button" class="op" data-id="'+esc(p.s.id)+'">'+esc(t.open)+' →</button></div></div>'}).join('')+'</div>':'<p class="empty">'+esc(t.phrEmpty)+'</p>';
 $('app').innerHTML=h+'</div>';
 $('bk').onclick=function(){go({view:'list'})};
 if(!SY)$('ttsBox').innerHTML='<p class="msg w">'+esc(t.noTts)+'</p>';else if(!vlist(T2).length)$('ttsBox').innerHTML='<p class="msg w">'+esc(fm(t.noVoice,{L:LNAME[lang][T2]}))+'</p>';
 Array.prototype.forEach.call(document.querySelectorAll('.ib.pp'),function(b){b.onclick=function(){var p=phResolve(b.getAttribute('data-k'));if(p)speak(tx(p.o,T2),T2)}});
 Array.prototype.forEach.call(document.querySelectorAll('.ib.rm'),function(b){b.onclick=function(){togglePh(b.getAttribute('data-k'));paintPhr()}});
 Array.prototype.forEach.call(document.querySelectorAll('.op'),function(b){b.onclick=function(){go({view:'scene',id:b.getAttribute('data-id'),mode:0})}})}

/* ── 住所（#s=会話のid&m=0〜3、#phr）と画面の切り替え ── */
function parse(){var h=(location.hash||'').replace(/^#/,''),o={view:'list'};if(h==='phr')return {view:'phr'};
 h.split('&').forEach(function(p){var kv=p.split('=');if(kv[0]==='s'&&BY[decodeURIComponent(kv[1]||'')]){o.view='scene';o.id=decodeURIComponent(kv[1])}if(kv[0]==='m')o.mode=Math.min(3,Math.max(0,+kv[1]||0))});if(o.view==='scene'&&o.mode==null)o.mode=0;return o}
function hashOf(o){return o.view==='scene'?'#s='+encodeURIComponent(o.id)+(o.mode?'&m='+o.mode:''):o.view==='phr'?'#phr':''}
function apply(o){var ch=o.view!==st.view||o.id!==st.id;st.view=o.view;if(o.view==='scene'){if(o.id!==st.id||ch){st.step=0;st.rev={};st.ans={}}st.id=o.id;if(o.mode!==st.mode){st.ans={}}st.mode=o.mode||0}return ch}
function go(o,replace,keepScroll){var u=location.pathname+location.search+hashOf(o);try{if(replace)history.replaceState(null,'',u);else history.pushState(null,'',u)}catch(e){}
 var ch=apply(o);stopTts();micStop();paintMain();if(ch&&!keepScroll){var a=$('app');if(a&&a.scrollIntoView)try{a.scrollIntoView({block:'start'})}catch(e){}}}
window.addEventListener('popstate',function(){apply(parse());stopTts();micStop();paintMain()});
function paintMain(){if(st.view==='scene'&&BY[st.id])paintScene();else if(st.view==='phr')paintPhr();else{st.view='list';paintList()}}
function render(){t=T[lang];head();paintSetup();paintMain()}
apply(parse());render();
})();
