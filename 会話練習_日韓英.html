<style>
:root{--acc:#1769e0;--ink:#182431;--sub:#65717e;--line:#dfe4e8;--bg:#fff;--card:#fff;--soft:#eef3f7;--blue1:#eaf2fe;--ok:#147d64;--okbg:#e4f4ee;--ng:#c2410c;--ngbg:#fdeee6;--gold:#b89048}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans JP","Noto Sans KR",system-ui,sans-serif;line-height:1.65;-webkit-text-size-adjust:100%}

.wrap{max-width:980px;margin:0 auto;padding:22px 16px 90px}
header{background:linear-gradient(145deg,#0a1b2e,#12314f);color:#fff;border-radius:22px;padding:26px 22px;position:relative}

.langs{position:absolute;top:14px;right:14px;display:inline-flex;border-radius:999px;overflow:hidden;background:#fff}.langs button{border:0;background:transparent;color:#1d5fa0;font:700 13px inherit;font-family:inherit;padding:6px 12px;min-width:44px;min-height:34px;cursor:pointer}.langs button+button{border-left:1px solid #d6e6f6}.langs button.on{background:#FFE08A;color:#3A2A00}

.card.sv{display:flex;flex-direction:column;padding:0;overflow:hidden}.card.sv .svgo{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:14px 16px;flex:1}.card.sv .svgo:focus-visible{outline:2px solid var(--blue,#1769e0)}

/* 確認 */

/* 私のフレーズ */
.ph .from{font-size:12.5px;margin-top:6px}
.ph .from a,.ph .from button{color:var(--acc);font-weight:700;background:none;border:0;padding:0;cursor:pointer;font-size:12.5px;text-decoration:underline}
.empty{color:var(--sub);font-size:14px;padding:18px;text-align:center;border:1px dashed var(--line);border-radius:14px}

@media (max-width:600px){
 header{padding:22px 18px}
 .tx{font-size:18px}

}

<script>
/* 会話練習（日本語・韓国語・英語）2026.10
   ・会話のデータ：talk_data.js（window.TALK に積む。形はそのファイルの先頭）
   ・1つのページの中で：一覧 → 会話（聞く／役になって話す／言い換え／確認）、私のフレーズ
   ・読み上げ：ブラウザの speechSynthesis。聞き取り：SpeechRecognition（ある端末だけ。押したときだけ使い、音声も文字も保存しない）
   ・記録（練習した回数・最後の日・続けた日数・私のフレーズ・設定）：localStorage の acn-talk。使えなくてもページは動く
   ・AIと話す（2026.10）：場面ごとの「AIと話す」・自由に話す（#ai、話題は talk_topics.js）・自分で作る。
     相手は Cloudflare Workers AI（talk_config.js の endpoint。作り方は 00_AI대화_설정방법.md、中身は _build/worker/talk-worker.js）。
     endpoint が空・失敗・無料の分の終わりのときは、プロンプトを渡す形（コピー・ChatGPT・Claude・Gemini）。会話はこのページを開いている間だけで、保存しない */
(function(){

 if(S.own.length)h+='<h3 class="h3os">'+esc(t.osList)+'</h3><p class="msg" style="margin:0 0 8px">'+esc(t.osNote)+'</p><div class="grid">'+S.own.map(function(o){return '<div class="card own sv"><button type="button" class="svgo" data-ow="'+esc(o.id)+'"><span class="k"><span>✎ '+esc(t.own)+'</span></span><b>'+esc(o.sit.length>40?o.sit.slice(0,39)+'…':o.sit)+'</b><span class="t2">'+esc(t.aiRole)+'：'+esc(o.ai)+'</span></button><button type="button" class="svdel" data-od="'+esc(o.id)+'" aria-label="'+esc(t.osDel)+'">'+esc(t.osDel)+'</button></div>'}).join('')+'</div>';
 h+='<div class="grid"><button type="button" class="card own" id="aiOwn"><span class="k"><span>✎</span></span><b>'+esc(t.own)+'</b><span class="t2">'+esc(t.ownLead)+'</span></button>'+
  L.map(function(p){return '<button type="button" class="card" data-tp="'+esc(p.id)+'"><span class="k"><span>'+esc(t.perN[p.persona])+'</span>'+stars(p.lv)+'</span><b>'+esc(tx(p.title,lang))+'</b><span class="t2">'+esc(tx(p.sit,lang))+'</span></button>'}).join('')+'</div>'+notesH()+'</div>';
 $('app').innerHTML=h;
 $('bk').onclick=function(){go({view:'list'})};
 $('aiOwn').onclick=function(){OWN={sit:'',ai:'',me:'',goal:''};openAI({kind:'own'})};
 Array.prototype.forEach.call(document.querySelectorAll('[data-ow]'),function(b){b.onclick=function(){var id=b.getAttribute('data-ow'),o=S.own.filter(function(x){return x.id===id})[0];if(!o)return;OWN={sit:o.sit,ai:o.ai,me:o.me||'',goal:o.goal||''};openAI({kind:'own',sid:id})}});
 Array.prototype.forEach.call(document.querySelectorAll('[data-od]'),function(b){b.onclick=function(){if(!window.confirm||window.confirm(t.osDelQ)){ownDel(b.getAttribute('data-od'));paintAI()}}});
 Array.prototype.forEach.call(document.querySelectorAll('.chip[data-tv]'),function(b){b.onclick=function(){st.tlv=+b.getAttribute('data-tv');paintAI()}});
 Array.prototype.forEach.call(document.querySelectorAll('.card[data-tp]'),function(b){b.onclick=function(){openAI({kind:'topic',id:b.getAttribute('data-tp')})}})}

/* ── 住所（#s=会話のid&m=0〜3、#phr、#ai）と画面の切り替え ── */
function parse(){var h=(location.hash||'').replace(/^#/,''),o={view:'list'};if(h==='phr')return {view:'phr'};if(h==='ai')return {view:'ai'};
 h.split('&').forEach(function(p){var kv=p.split('=');if(kv[0]==='s'&&BY[decodeURIComponent(kv[1]||'')]){o.view='scene';o.id=decodeURIComponent(kv[1])}if(kv[0]==='m')o.mode=Math.min(3,Math.max(0,+kv[1]||0))});if(o.view==='scene'&&o.mode==null)o.mode=0;return o}
function hashOf(o){return o.view==='scene'?'#s='+encodeURIComponent(o.id)+(o.mode?'&m='+o.mode:''):o.view==='phr'?'#phr':o.view==='ai'?'#ai':''}
function apply(o){var ch=o.view!==st.view||o.id!==st.id;st.view=o.view;if(o.view==='scene'){if(o.id!==st.id||ch){st.step=0;st.rev={};st.ans={}}st.id=o.id;if(o.mode!==st.mode){st.ans={}}st.mode=o.mode||0}return ch}
function go(o,replace,keepScroll){var u=location.pathname+location.search+hashOf(o);try{if(replace)history.replaceState(null,'',u);else history.pushState(null,'',u)}catch(e){}
 var ch=apply(o);stopTts();micStop();paintMain();if(ch&&!keepScroll){var a=$('app');if(a&&a.scrollIntoView)try{a.scrollIntoView({block:'start'})}catch(e){}}}
window.addEventListener('popstate',function(){apply(parse());stopTts();micStop();paintMain()});
function paintMain(){if(st.view==='scene'&&BY[st.id])paintScene();else if(st.view==='phr')paintPhr();else if(st.view==='ai')paintAI();else{st.view='list';paintList()}}
function render(){t=T[lang];head();paintSetup();paintMain()}
apply(parse());render();
})();
