 var r=S.pH>0?S.pL/S.pH:1,z=inv(1-r),y=clamp(S.mu+S.sd*z,0,S.C),yr=Math.round(y);

function calcOB(t){S.cap=Math.max(1,Math.round(g('cap')||1));S.p=clamp(g('p')||95,1,99.9);S.f=g('f')||0;S.db=g('db')||0;S.rg=clamp(Math.round(g('rg')||15),1,60);S.fx=g('fx')||150;
 var p=S.p/100,rows=[],best=-1,bv=-Infinity;
 for(var au=S.cap;au<=S.cap+S.rg;au++){var pr=binomRow(au,p),eb=0,ed=0;for(var k=0;k<=au;k++){eb+=pr[k]*Math.min(k,S.cap);ed+=pr[k]*Math.max(0,k-S.cap)}var net=S.f*eb-S.db*ed;rows.push([au,eb,ed,net]);if(net>bv){bv=net;best=au}}
 var base=rows[0][3],h='<table><tr><th>'+t.au+'</th><th>'+t.board+'</th><th>'+t.den+'</th><th>'+t.rev+'</th></tr>';
 rows.forEach(function(r){h+='<tr class="'+(r[0]===best?'best':'')+'"><td class="c">'+r[0]+(r[0]===best?' ('+t.best+')':'')+'</td><td class="n">'+r[1].toFixed(1)+'</td><td class="n">'+r[2].toFixed(2)+'</td><td class="n">'+yen(r[3])+'</td></tr>'});
 document.getElementById('obres').innerHTML=h+'</table><div class="note">'+t.best+'：'+best+'（+'+(base>0?((bv/base-1)*100).toFixed(1):'0')+'% vs '+S.cap+'）</div>'}

function viewKP(t){return '<div class="grid"><div class="card"><h2>'+t.air+'</h2>'+row(t.seats,'k1',S.seats)+row(t.pax,'k2',S.pax)+row(t.dist,'k3',S.km)+row(t.revA,'k4',S.ra,10000)+row(t.cost,'k5',S.co,10000)+'<div class="res" id="kpa"></div></div><div class="card"><h2>'+t.hotel+'</h2>'+row(t.rooms,'h1',S.rm)+row(t.sold,'h2',S.sd2)+row(t.rrev,'h3',S.rr,10000)+row(t.trev,'h4',S.tr,10000)+row(t.gop,'h5',S.gp,10000)+'<div class="res" id="kph"></div></div></div>'}
function calcKP(t){S.seats=g('k1')||0;S.pax=g('k2')||0;S.km=g('k3')||0;S.ra=g('k4')||0;S.co=g('k5')||0;S.rm=g('h1')||0;S.sd2=g('h2')||0;S.rr=g('h3')||0;S.tr=g('h4')||0;S.gp=g('h5')||0;
 var ask=S.seats*S.km,rpk=S.pax*S.km,lf=S.seats?S.pax/S.seats:0,yl=rpk?S.ra/rpk:0,rk=ask?S.ra/ask:0,ck=ask?S.co/ask:0;
 document.getElementById('kpa').innerHTML='<div>'+t.lfL+'：<b>'+(lf*100).toFixed(1)+'%</b></div><div>'+t.yld+'：<b>'+yl.toFixed(2)+'</b></div><div>'+t.rask+'：<b>'+rk.toFixed(2)+'</b></div><div>'+t.cask+'：<b>'+ck.toFixed(2)+'</b></div><div>'+t.bel+'：<b>'+(yl?(ck/yl*100).toFixed(1)+'%':'—')+'</b></div>';
 var occ=S.rm?S.sd2/S.rm:0,adr=S.sd2?S.rr/S.sd2:0;
 document.getElementById('kph').innerHTML='<div>'+t.occ+'：<b>'+(occ*100).toFixed(1)+'%</b></div><div>'+t.adr+'：<b>'+yen(adr)+'</b></div><div>'+t.revpar+'：<b>'+yen(S.rm?S.rr/S.rm:0)+'</b></div><div>'+t.trevpar+'：<b>'+yen(S.rm?S.tr/S.rm:0)+'</b></div><div>'+t.goppar+'：<b>'+yen(S.rm?S.gp/S.rm:0)+'</b></div>'}

var V=[viewLW,viewEM,viewOB,viewKP],K=[calcLW,calcEM,calcOB,calcKP];
function render(){var t=T[L];document.documentElement.lang=L;document.title=t.t;
 document.getElementById('back').textContent=t.back;document.getElementById('back').href='00_シリーズ全体_航空営業入門.html?lang='+L;
 document.getElementById('ttl').textContent=t.t;document.getElementById('lead').textContent=t.lead;
 document.getElementById('langs').innerHTML=['ja','ko','en'].map(function(l){return '<button data-l="'+l+'" class="'+(l===L?'on':'')+'">'+{ja:'日本語',ko:'한국어',en:'English'}[l]+'</button>'}).join(' ');
 document.getElementById('tabs').innerHTML=t.tabs.map(function(x,i){return '<button data-t="'+i+'" class="'+(i===tab?'on':'')+'">'+x+'</button>'}).join('');
 document.getElementById('main').innerHTML=V[tab](t);K[tab](t);
 document.querySelectorAll('#langs button').forEach(function(b){b.onclick=function(){L=b.dataset.l;try{localStorage.setItem('art-lang',L)}catch(e){}render()}});
 document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){tab=+b.dataset.t;render()}});
 document.querySelectorAll('#main input').forEach(function(e){e.oninput=function(){K[tab](T[L])}});
 var e;if(e=document.getElementById('eadd'))e.onclick=function(){K[1](T[L]);var n=S.cl.length;if(n<8){S.cl.push([String.fromCharCode(75+n),Math.max(5000,Math.round(S.cl[n-1][1]*0.7/1000)*1000),40,12]);render()}};
 if(e=document.getElementById('edel'))e.onclick=function(){K[1](T[L]);if(S.cl.length>2){S.cl.pop();render()}};
 document.querySelectorAll('[data-usd]').forEach(function(b){b.onclick=function(){var fx=g('fx')||150;document.getElementById('db').value=Math.round(+b.dataset.usd*fx);K[2](T[L])}});
}
function fromHash(){var m=location.hash.match(/tab=(\d)/);if(m)tab=clamp(+m[1],0,3)}
fromHash();window.addEventListener('hashchange',function(){fromHash();render()});
render();
</script>
