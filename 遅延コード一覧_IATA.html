en:{kick:'Aviation Career Note',ttl:'IATA Delay Codes (AHM730)',lead:'The standard IATA delay codes (00–99) used by airlines and airports worldwide. Each cause has a two-digit number and a two-letter code, used in movement messages (MVT) and punctuality analysis.',ph:'Search codes and causes (e.g. 15, PH, boarding)',all:'All groups',cols:['Code','Alpha','Cause','Group'],n:' codes',note:'Source: IATA Airport Handling Manual AHM730 and 731, as published by EUROCONTROL CODA (“Standard IATA Delay Codes (AHM730)”). Japanese and Korean translations are this site’s. IATA also defines sub-codes (AHM731) and a newer schema (AHM732), and airlines often subdivide codes internally. Check the latest AHM for the official text.'}};
var lang='ja';try{var s=localStorage.getItem('art-lang');if(['ja','ko','en'].indexOf(s)>=0)lang=s}catch(e){}
var m=location.search.match(/lang=(ja|ko|en)/);if(m)lang=m[1];
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hi(x,q){x=esc(x);if(!q)return x;var i=x.toLowerCase().indexOf(q.toLowerCase());return i<0?x:x.slice(0,i)+'<mark>'+x.slice(i,i+q.length)+'</mark>'+x.slice(i+q.length)}
function $(i){return document.getElementById(i)}
function render(){var t=T[lang];document.documentElement.lang=lang;document.title=t.ttl;['kick','ttl','lead','note'].forEach(function(k){$(k).textContent=t[k]});$('q').placeholder=t.ph;
 $('langs').innerHTML=['ja','ko','en'].map(function(l){return '<button type="button" data-l="'+l+'" class="'+(l===lang?'on':'')+'">'+{ja:'日本語',ko:'한국어',en:'English'}[l]+'</button>'}).join('');
 Array.prototype.forEach.call($('langs').querySelectorAll('button'),function(b){b.onclick=function(){lang=b.dataset.l;try{localStorage.setItem('art-lang',lang)}catch(e){}render()}});
 var gv=$('grp').value;$('grp').innerHTML='<option value="">'+t.all+'</option>'+Object.keys(G).map(function(k){return '<option value="'+k+'">'+G[k][lang]+'</option>'}).join('');$('grp').value=gv;
 var q=$('q').value.trim(),g=$('grp').value,n=0,h='';
 Object.keys(G).forEach(function(k){if(g&&g!==k)return;var rows=D.filter(function(r){if(r[2]!==k)return false;if(!q)return true;return (r.join(' ')).toLowerCase().indexOf(q.toLowerCase())>=0});if(!rows.length)return;n+=rows.length;
  h+='<h2>'+esc(G[k][lang])+(lang==='en'?'':' <small style="font-weight:400;color:var(--sub)">'+esc(G[k].en)+'</small>')+'</h2><div class="tbl"><table><tr>'+t.cols.map(function(c){return '<th>'+c+'</th>'}).join('')+'</tr>'+
  rows.map(function(r){var main=lang==='ja'?r[4]:lang==='ko'?r[5]:r[3],sub=lang==='en'?G[k].en:r[3];return '<tr><td class="c">'+hi(r[0],q)+'</td><td class="c">'+hi(r[1],q)+'</td><td>'+hi(main,q)+'</td><td class="en">'+hi(sub,q)+'</td></tr>'}).join('')+'</table></div>'});
 $('list').innerHTML=h;$('cnt').textContent=n+t.n}
$('q').oninput=render;$('grp').onchange=render;render();
</script>
