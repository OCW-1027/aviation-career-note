<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>航空路図の練習</title>
<style>
:root{--ink:#22303F;--sub:#5F6F80;--line:#E3E9EF;--acc:#2F8FE0;--paper:#fff;--card:#F4F8FC;--ok:#1F7A6E;--ng:#C2344F}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:"Noto Sans JP","Noto Sans KR",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 60px}
header{position:relative}header h1{margin:0 0 8px}
.langs{display:inline-flex}.langs button{cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 8px}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:600 14px inherit;font-family:inherit;color:var(--ink);cursor:pointer;min-height:38px}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs .pill.on{background:var(--acc);border-color:var(--acc)}
.map{border:1.5px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.map svg{display:block;width:100%;height:auto}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;margin-top:12px}
.card{border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--card)}
.card h3{margin:0 0 8px;font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14.5px}.kv b{color:var(--sub);font-weight:600}
.big{font-size:22px;font-weight:800;letter-spacing:.02em}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:12px;padding:10px 16px;font:700 15px inherit;font-family:inherit;cursor:pointer;background:var(--acc);color:#fff;min-height:44px}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.bar{position:relative;height:30px;border-radius:8px;overflow:hidden;display:flex;margin-top:6px;font-size:11.5px;font-weight:700;color:#fff}
.bar span{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
.bar i{position:absolute;top:-2px;bottom:-2px;width:4px;background:#E08A2F;border-radius:2px;transition:left .4s}
.note{font-size:13px;color:var(--sub);margin-top:14px}
.q{font-size:17px;font-weight:700;margin:4px 0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;font:600 15px inherit;font-family:inherit;color:var(--ink);cursor:pointer;min-height:46px}
.opt.ok{border-color:var(--ok);background:#E1F5EE}.opt.ng{border-color:var(--ng);background:#FCEBEB}
.exp{margin-top:10px;font-size:14px}
.score{font-size:20px;font-weight:800}
@media (max-width:760px){.grid{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}
</style>
<script src="../1_지상직여객운송입문/assets/shell.js" data-page="route"></script>
</head>
<body>
<div class="wrap">
<header><span class="langs" id="lang" role="group" aria-label="Language"></span><div id="kick"></div><h1 id="ttl"></h1><p id="lead"></p></header>

<div class="row tabs" id="modes"></div>
<div class="map" id="map"></div>
<div id="panel"></div>
<p class="note" id="note"></p>
</div>

 if(r.map==='enr')s+='<text x="'+(box[0]+10)+'" y="'+(box[1]+box[3]-10)+'" font-size="12" font-weight="700" fill="'+INK+'" font-family="Arial">\u2190 N</text>';
 return s+'</svg>'}
/* たどる */
function follow(){var r=R[ri],L=legs(r),t=T[lang],c=L[step],n=L[step+1],last=step===L.length-1;
 $('map').innerHTML=mapSVG(r,step);
 var ph=['dep','clb','crz','des','arr'],col={dep:'#5F6F80',clb:'#1F7A6E',crz:'#2F8FE0',des:'#B3600A',arr:'#22303F'};
 var bar='<div class="bar">',grp=[];L.slice(0,L.length-1).forEach(function(l){var g=grp[grp.length-1];if(g&&g.ph===l.ph)g.nm+=l.nm;else grp.push({ph:l.ph,nm:l.nm})});
 bar+=grp.map(function(g){var w=L.total?g.nm/L.total*100:0;return '<span style="width:'+w.toFixed(2)+'%;background:'+col[g.ph]+'">'+(w>9?t.PH[g.ph]:'')+'</span>'}).join('')+'<i style="left:calc('+(L.total?(c.cum/L.total*100).toFixed(2):0)+'% - 2px)"></i></div>';
 $('panel').innerHTML='<div class="grid"><div class="card"><h3>'+t.now+'</h3><div class="big">'+c.k+'</div><div class="kv" style="margin-top:8px"><b>'+t.next+'</b><span>'+(n?n.k:t.done)+'</span><b>'+t.aw+'</b><span>'+(last?t.none:awName(c.aw))+'</span><b>'+t.dist+'</b><span>'+(last?t.none:c.nm+' '+t.nm)+'</span><b>'+t.mc+'</b><span>'+(last?t.none:pad(c.mc)+'\u00B0')+'</span><b>'+t.cum+'</b><span>'+c.cum+' / '+(L.total-c.cum)+' '+t.nm+'</span></div></div>'+
  '<div class="card"><h3>'+t.ctl+'</h3><div class="big" style="font-size:18px">'+c.ctl[lang]+'</div><h3 style="margin-top:12px">'+t.ph+'</h3><div style="font-weight:800">'+t.PH[c.ph]+(c.ph==='crz'?' \u00B7 '+r.fl:'')+'</div>'+bar+'</div></div>'+
  '<div class="ctl"><button class="btn sec" id="bp">'+t.prev+'</button><button class="btn" id="bn">'+t.nx+'</button><button class="btn sec" id="ba">'+(timer?t.stop:t.auto)+'</button><button class="btn sec" id="br">'+t.reset+'</button></div>';
 $('bp').disabled=step===0;$('bn').disabled=last;
 $('bp').onclick=function(){stop();step=Math.max(0,step-1);follow()};$('bn').onclick=function(){stop();step=Math.min(L.length-1,step+1);follow()};
 $('br').onclick=function(){stop();step=0;follow()};$('ba').onclick=function(){if(timer){stop();follow()}else{if(last)step=0;timer=setInterval(function(){if(step>=L.length-1){stop();follow();return}step++;follow()},1600);follow()}}}
function stop(){if(timer){clearInterval(timer);timer=null}}
/* 問題 */
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
function uniq(a){return a.filter(function(x,i){return a.indexOf(x)===i})}
function makeQuiz(){var r=R[ri],L=legs(r),out=[],allP=Object.keys(PT).filter(function(k){return !/^R[KJ]/.test(k)}),AW=['Y697','Y51','Y517','Y301','Y30','Y16','G585','Y711','Y722','B576','A593'];
 var inner=L.slice(1,L.length-1);
 var a=inner[Math.floor(Math.random()*inner.length)],ai=L.indexOf(a);out.push({t:'q1',a:a.k,ans:L[ai+1].k,opts:uniq([L[ai+1].k].concat(shuf(r.s.map(function(x){return x[0]}).filter(function(k){return k!==L[ai+1].k&&k!==a.k})).slice(0,3)))});
 var en=L.filter(function(x,i){return i<L.length-1&&/^[A-Z]\d/.test(x.aw)});var e=en[Math.floor(Math.random()*en.length)],ei=L.indexOf(e);
 out.push({t:'q2',a:e.k,b:L[ei+1].k,ans:e.aw,opts:uniq([e.aw].concat(shuf(AW.filter(function(x){return x!==e.aw})).slice(0,3)))});
 if(r.fir)out.push({t:'q3',ans:r.fir,opts:uniq([r.fir].concat(shuf(inner.map(function(x){return x.k}).filter(function(k){return k!==r.fir})).slice(0,3)))});
 var lg=L.slice(0,L.length-1).filter(function(x){return x.nm>=20}),g=lg[Math.floor(Math.random()*lg.length)],gi=L.indexOf(g);
 var dv=uniq([g.nm,Math.round(g.nm*1.6),Math.round(g.nm*0.55),Math.round(g.nm*2.3)]);out.push({t:'q4',a:g.k,b:L[gi+1].k,ans:g.nm+'',opts:dv.map(function(x){return x+''}),unit:1});
 var main=L.slice(1,L.length-1).reduce(function(p,x){return x.nm>p.nm?x:p},L[0]);var fl=+r.fl.slice(2),alt=r.odd?[fl-10,fl+10,fl+30]:[fl-10,fl+10,fl-30];
 out.push({t:'q5',ans:r.fl,opts:[r.fl].concat(alt.map(function(x){return 'FL'+x})),mc:main.mc});
 if(!r.fir){var b2=inner[Math.floor(Math.random()*inner.length)],bi=L.indexOf(b2);out.push({t:'q1',a:L[bi-1].k,ans:b2.k,opts:uniq([b2.k].concat(shuf(allP.filter(function(k){return k!==b2.k})).slice(0,3)))})}
 out.forEach(function(q){q.opts=shuf(q.opts)});return {q:shuf(out).slice(0,5),i:0,ok:0,done:false,picked:null}}
function quiz(){var r=R[ri],t=T[lang];$('map').innerHTML=mapSVG(r,0);if(!QZ)QZ=makeQuiz();
 if(QZ.i>=QZ.q.length){$('panel').innerHTML='<div class="card" style="margin-top:12px"><h3>'+t.res+'</h3><div class="score">'+(lang==='en'?QZ.ok+t.of+QZ.q.length+t.cor:QZ.q.length+t.of+QZ.ok+t.cor)+'</div><div class="ctl"><button class="btn" id="qa">'+t.again+'</button></div></div>';$('qa').onclick=function(){QZ=null;quiz()};return}
 var q=QZ.q[QZ.i],txt=t[q.t].replace('{a}',q.a||'').replace('{b}',q.b||'').replace('{r}',r.name[lang]);
 var h='<div class="card" style="margin-top:12px"><div style="color:var(--sub);font-size:13px">'+(QZ.i+1)+' / '+QZ.q.length+'</div><div class="q">'+txt+'</div><div class="opts">'+q.opts.map(function(o,i){var cls='';if(QZ.picked!==null){if(o===q.ans)cls=' ok';else if(i===QZ.picked)cls=' ng'}return '<button class="opt'+cls+'" data-i="'+i+'"'+(QZ.picked!==null?' disabled':'')+'>'+(q.t==='q2'?awName(o):o)+(q.unit?' '+t.nm:'')+'</button>'}).join('')+'</div>';
 if(QZ.picked!==null){var good=q.opts[QZ.picked]===q.ans;h+='<div class="exp"><b style="color:'+(good?'var(--ok)':'var(--ng)')+'">'+(good?t.ok:t.ng)+'</b> '+t.ans+(q.t==='q2'?awName(q.ans):q.ans)+(q.unit?' '+t.nm:'')+(q.t==='q5'?'<br>'+t.q5x.replace('{m}',pad(q.mc)).replace('{oe}',r.odd?t.odd:t.even):'')+'</div><div class="ctl"><button class="btn" id="qn">'+t.nextq+'</button></div>'}
 $('panel').innerHTML=h+'</div>';
 Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b){b.onclick=function(){if(QZ.picked!==null)return;QZ.picked=+b.getAttribute('data-i');if(q.opts[QZ.picked]===q.ans)QZ.ok++;quiz()}});
 if($('qn'))$('qn').onclick=function(){QZ.i++;QZ.picked=null;quiz()}}
/* 画面 */
function langBar(){var g=$('lang');g.innerHTML=['ja','ko','en'].map(function(l){return '<button type="button" data-l="'+l+'" class="'+(l===lang?'on':'')+'" aria-pressed="'+(l===lang)+'">'+{ja:'日本語',ko:'한국어',en:'English'}[l]+'</button>'}).join('');
 Array.prototype.forEach.call(g.querySelectorAll('button'),function(b){b.onclick=function(){lang=b.getAttribute('data-l');try{localStorage.setItem('art-lang',lang)}catch(e){}render()}})}
function render(){var t=T[lang];document.documentElement.lang=lang;document.title=t.ttl;['kick','ttl','lead','note'].forEach(function(k){$(k).textContent=t[k]});langBar();
 $('routes').innerHTML=R.map(function(r,i){return '<button class="pill'+(i===ri?' on':'')+'" data-r="'+i+'">'+r.name[lang]+'</button>'}).join('')+(R[ri].map==='enr'?'<span style="font-size:12.5px;color:var(--sub)">'+t.hint+'</span>':'');
 $('modes').innerHTML=[['follow',t.follow],['quiz',t.quiz]].map(function(m){return '<button class="pill'+(m[0]===mode?' on':'')+'" data-m="'+m[0]+'">'+m[1]+'</button>'}).join('');
 Array.prototype.forEach.call(document.querySelectorAll('[data-r]'),function(b){b.onclick=function(){stop();ri=+b.getAttribute('data-r');step=0;QZ=null;render()}});

 if(mode==='follow')follow();else quiz()}
try{var m=location.search.match(/[?&]r=([a-z]+)/);if(m){R.forEach(function(r,i){if(r.id===m[1])ri=i})}}catch(e){}
render();
