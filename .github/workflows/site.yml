# 航空キャリアノート：静的ページを作って検査し、GitHub Pages に公開する
# ・main に push すると自動で：生成 → 検査 → 公開
#   （検査で問題が見つかったら公開しないで止まる。今の公開サイトはそのまま）
# ・Actions 画面の「Run workflow」で手動でも実行できる
name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        working-directory: _build
        run: npm install --no-audit --no-fund
      - name: Build static pages
        run: node _build/build.mjs . _site
      - name: Check the site
        run: node _build/check.mjs _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
