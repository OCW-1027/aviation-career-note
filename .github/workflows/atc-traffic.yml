# AIRLINE SAGA 관제편 「실제 교통 근무」 — 15분마다 adsb.lol에서 하네다 · 인천 둘레 교통을 받아 traffic-data 가지에 덮어씀
# (사이트 본 가지는 건드리지 않음 — 사이트 빌드 · 배포가 다시 돌지 않음. 기록도 쌓이지 않게 커밋 하나로 덮어씀)
name: atc-traffic
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atc-traffic
  cancel-in-progress: false
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts/atc_traffic.py
          sparse-checkout-cone-mode: false
          path: src
      - name: 데이터 가지 받기(없으면 새로)
        run: |
          git clone --depth 1 --branch traffic-data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data || (mkdir -p data && cd data && git init -q -b traffic-data && git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git")
      - name: 교통 받기
        run: python3 src/.github/scripts/atc_traffic.py data
      - name: 덮어쓰기
        run: |
          cd data
          git config user.name "atc-traffic-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan snap; git add -A; git commit -qm "traffic $(date -u +%FT%TZ)"
          git push -q -f origin snap:traffic-data
