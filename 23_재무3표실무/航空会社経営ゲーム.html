header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

.bsl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kpi span{display:block;color:var(--muted);font-size:12px}.kpi b{font-size:20px;font-variant-numeric:tabular-nums}.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.why{background:#f3f6fa;border-radius:12px;padding:12px 14px;font-size:14px}.why h3{margin:0 0 6px;font-size:14px}.why ul{margin:4px 0;padding-left:20px}.why li{margin:4px 0}
.summary table{width:100%;border-collapse:collapse;font-size:13px}.summary td,.summary th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}.summary th:first-child,.summary td:first-child{text-align:left}
.verdict{font-size:15px;font-weight:700;margin-top:10px}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
details{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--paper)}summary{cursor:pointer;padding:12px 14px;font-weight:700;min-height:46px;display:flex;align-items:center}.dbody{padding:0 14px 14px;font-size:14px}.dbody p{margin:6px 0}
button:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.bar div,.bsbars>div>div{transition:none}}

      ['비용이 움직이는 법','연료·조업·정비·공항 사용료는 좌석킬로(띄운 양)에 비례해 늘고 줍니다. 인건비·감가상각·임차료는 띄우든 안 띄우든 거의 같습니다(고정비). 판매비는 여객 수입의 4% 안팎, 기타는 절반이 승객 수에 비례하고 절반은 고정입니다.'],

en:{title:'Airline Management Game: a year of Vela Air in three statements',lead:'Run the fictional airline Vela Air for one year, quarter by quarter. Each quarter something happens and you make one decision. The income statement, balance sheet and cash flow statement move together, and every quarter the game explains why.',

/* ---- model (단위: 억 엔, 분기) ---- */
var BASE={ask:50,lf:0.82,yld:15.0,cargo:75,ancPer:0.7317,other:30,
 fuel:169.25,labor:127,handling:84.5,maint:70.5,dep:63.5,airport:49.25,lease:42.25,salesPct:0.046,misc:70.5,
 bs:{cash:1200,ar:370,aircraft:2100,otherA:2330,unearned:720,debt:2300,otherL:1060,equity:1920},
 debtRepay:37.5,leaseRepay:15,intRate:0.025/4,tax:0.3};
var EVENTS=['calm','oil','boom','storm'];
function newState(){return {q:0,oil:1,fx:1,askX:1,leaseX:0,extraDep:0,hedge:false,fsc:false,costCut:false,bs:JSON.parse(JSON.stringify(BASE.bs)),hist:[],decs:[]}}
function runQuarter(S,ev,dec){var N=JSON.parse(JSON.stringify(S));var note={};
 if(ev==='oil')N.oil=1.4; if(ev==='boom')N.fx=160/150;
 if(dec==='hedge')N.hedge=true; if(dec==='fsc')N.fsc=true; if(dec==='cost')N.costCut=true;
 var askX=N.askX,lf=BASE.lf,yld=BASE.yld,cancel=0,comp=0;
 if(dec==='add'){askX*=1.05;lf-=0.02} if(dec==='fare'){yld*=1.05;lf-=0.03}
 if(ev==='boom')lf=Math.min(0.95,lf+0.05); if(ev==='storm'){cancel=0.03;comp=3}
 var ask=BASE.ask*askX*(1-cancel); var pax=ask*lf; var paxRev=pax*yld; var anc=pax*BASE.ancPer; var cargo=BASE.cargo*askX*(1-cancel);
 var oilEff=N.hedge?1+(N.oil-1)*0.5:N.oil; var fxEff=N.fx;
 var fuelBase=BASE.fuel*askX*(1-cancel); var fuel=fuelBase*oilEff*fxEff*(N.costCut?0.98:1);
 var fsc=0; if(N.fsc&&N.oil>1.1){fsc=(fuel-fuelBase*fxEff*(N.costCut?0.98:1))*0.4*0.6}
 var c={fuel:fuel,labor:BASE.labor*(0.7+0.3*askX),handling:BASE.handling*askX*(N.costCut?0.97:1),maint:BASE.maint*askX*(1-cancel*0.5)*(0.8+0.2*fxEff),dep:BASE.dep+N.extraDep,
  airport:BASE.airport*askX*(1-cancel),lease:(BASE.lease+N.leaseX)*(0.5+0.5*fxEff),sales:paxRev*BASE.salesPct,misc:BASE.misc*(0.5+0.5*lf/BASE.lf)+comp+(N.hedge?1.5:0)};
 var rev=paxRev+anc+cargo+BASE.other+fsc; var cost=0;for(var k in c)cost+=c[k]; var op=rev-cost;
 var interest=N.bs.debt*BASE.intRate-N.bs.cash*0.001; var pretax=op-interest; var tax=pretax>0?pretax*BASE.tax:0; var net=pretax-tax;
 var capex=0,newLoan=0; if(dec==='buy'){capex=60;newLoan=30;N.extraDep+=0.75;N.askX+=0.02} if(dec==='lease'){N.leaseX+=0.9;N.askX+=0.02}
 var unearnedNew=BASE.bs.unearned*(rev/750); var dun=unearnedNew-N.bs.unearned; var dar=(rev/750-1)*20;
 var cfo=net+c.dep+dun-dar; var cfi=-capex; var cff=newLoan-BASE.debtRepay-BASE.leaseRepay;
 var b=N.bs; b.cash=b.cash+cfo+cfi+cff; b.ar=b.ar+dar; b.aircraft=b.aircraft+capex-c.dep; b.unearned=unearnedNew; b.debt=b.debt+newLoan-BASE.debtRepay-BASE.leaseRepay; b.equity=b.equity+net;
 var assets=b.cash+b.ar+b.aircraft+b.otherA, le=b.unearned+b.debt+b.otherL+b.equity; b.otherL+= (assets-le); /* 미세 차이는 기타 부채(미지급 세금 등)로 흡수 */
 var unit=(yld*lf+BASE.ancPer*lf)*ask/lf; var be=(cost-cargo-BASE.other-fsc)/(ask*(yld+BASE.ancPer));
 var r={ev:ev,dec:dec,rev:rev,c:c,cost:cost,op:op,interest:interest,tax:tax,net:net,cfo:cfo,cfi:cfi,cff:cff,dun:dun,bs:JSON.parse(JSON.stringify(b)),ask:ask,lf:lf,rask:rev/ask,cask:cost/ask,be:be,fsc:fsc,comp:comp,fuel:fuel,paxRev:paxRev,eqr:b.equity/(b.cash+b.ar+b.aircraft+b.otherA)};
 N.hist.push(r);N.decs.push(dec);N.q++;return N}
function simulate(decs){var S=newState();for(var i=0;i<4;i++)S=runQuarter(S,EVENTS[i],decs[i]||'none');return S}

function render(){var d=L[lang];document.documentElement.lang=lang;document.title=d.title;

 var go=document.getElementById('btn_go');go.textContent=d.go;go.disabled=done||!picked;document.getElementById('btn_reset').textContent=d.restart;document.getElementById('t_hint').textContent=(!done&&!picked)?d.hint:'';
 var r=S.hist[S.hist.length-1];
 if(!r){var base=simulate([]).hist[0];r=base;r.preview=true}
 var c=r.c;
 document.getElementById('plbar').innerHTML=ORDER.map(function(k){return '<div style="width:'+(c[k]/r.cost*100)+'%;background:'+COL[k]+'" title="'+d.C[k]+'"></div>'}).join('');
 var rows=[[d.rev,r.rev,'tot']];ORDER.forEach(function(k){rows.push(['<i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+COL[k]+';margin-right:5px"></i>'+d.C[k],-c[k]])});
 rows.push([d.costs,-r.cost,'tot'],[d.op,r.op,'tot'],[d.int,-r.interest],[d.tax,-r.tax],[d.net,r.net,'tot']);
