<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>取引と財務諸表の練習</title>
<style>
:root{--ink:#1d2a38;--muted:#5b6b7d;--line:#dbe3ec;--bg:#f7fafd;--paper:#fff;--ok:#1f7a6e;--ng:#c2344f;--pl:#2f8fe0;--bs:#1f7a6e;--cf:#e08a2f}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans JP","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 60px}
header{position:relative}header h1{margin:0 0 8px}html[lang=ko] header h1,html[lang=ko] header p{word-break:keep-all}
h1{font-size:22px;margin:10px 0 4px}.lead{color:var(--muted);font-size:14px;margin:4px 0 14px;max-width:70ch}
.langs{display:inline-flex}.langs button{cursor:pointer}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.card h2{font-size:15px;margin:0 0 10px}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.levels button{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--ink);min-height:72px;font-size:14px}
.levels button small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.levels button.on{border-color:var(--ink);background:#eef3f8}
.bar{display:flex;gap:4px;margin:0 0 10px}.bar span{flex:1;height:8px;border-radius:4px;background:#e6ecf2}.bar span.ok{background:var(--ok)}.bar span.ng{background:var(--ng)}.bar span.now{background:var(--pl)}
.tx{border-left:5px solid var(--pl);background:#eef5fc;padding:12px 16px;border-radius:10px;font-size:17px;font-weight:700}.tx small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
.q{margin-top:14px}.q h3{font-size:14px;margin:0 0 6px;display:flex;align-items:center;gap:8px}.q h3 i{width:12px;height:12px;border-radius:3px;display:inline-block}
.opts{display:flex;flex-wrap:wrap;gap:6px}.opts button{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:14px;color:var(--ink);min-height:44px}
.opts button.on{border-color:var(--ink);background:#eef3f8}.opts button.right{border-color:var(--ok);background:#e8f3f0}.opts button.wrong{border-color:var(--ng);background:#fdeef0}.opts button:disabled{cursor:default}
.go{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.go button{min-height:48px;border:0;background:var(--ink);color:#fff;border-radius:12px;padding:0 20px;font-size:15px;cursor:pointer;font-weight:700}.go button.sec{background:var(--paper);color:var(--ink);border:2px solid var(--line)}.go button:disabled{opacity:.4;cursor:default}
.score{margin-left:auto;font-size:14px;color:var(--muted)}.score b{color:var(--ink);font-size:18px}
.exp{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fbfcfe;font-size:14px}.exp .v{font-weight:700}.exp .v.ok{color:var(--ok)}.exp .v.ng{color:var(--ng)}
.exp ul{margin:6px 0 0;padding-left:18px}.exp li{margin:2px 0}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}@media(max-width:820px){.three{grid-template-columns:1fr}}
.stmt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper)}.stmt h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}.stmt h3 i{width:12px;height:12px;border-radius:3px;display:inline-block}
.stmt table{width:100%;border-collapse:collapse;font-size:13px}.stmt td{padding:3px 2px;border-bottom:1px dashed #eef2f6}.stmt td:last-child{text-align:right;font-variant-numeric:tabular-nums}.stmt tr.sum td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.pat{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:10px}.pat div{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}.pat b{display:block}
.note{font-size:12px;color:var(--muted)}
.books{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}@media(max-width:820px){.books{grid-template-columns:1fr}}
.books .stmt{max-height:340px;overflow:auto}.books .stmt td{white-space:nowrap}.jl td:first-child{color:var(--muted);width:2em}.jl .cr{padding-left:1.6em}
.lk{display:block;margin-top:12px;font-weight:700;color:#1C6FBF}
button:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
</style>
<script src="../1_지상직여객운송입문/assets/shell.js" data-page="fincard"></script>
<script src="../1_지상직여객운송입문/assets/accounts.js"></script>
</head>
<body>
<div class="wrap">
<header><span class="langs" id="lang" role="group" aria-label="Language"><button type="button" data-l="ja">日本語</button><button type="button" data-l="ko">한국어</button><button type="button" data-l="en">English</button></span><h1 id="t_title"></h1><p id="t_lead"></p></header>

<div class="card" id="lvcard">
 <h2 id="t_level"></h2>
 <div class="levels" id="levels"></div>
</div>

<div class="card" id="play" style="display:none">
 <div class="bar" id="bar"></div>
 <div class="tx" id="tx"></div>
 <div class="q"><h3><i style="background:var(--pl)"></i><span id="t_q1"></span></h3><div class="opts" id="q1"></div></div>
 <div class="q"><h3><i style="background:var(--cf)"></i><span id="t_q2"></span></h3><div class="opts" id="q2"></div></div>
 <div class="q"><h3><i style="background:var(--bs)"></i><span id="t_q3"></span></h3><div class="opts" id="q3"></div><p class="note" id="t_q3note"></p></div>
 <div class="go"><button id="btn_ans"></button><button id="btn_next" class="sec" style="display:none"></button><span class="score" id="score"></span></div>
 <div id="exp"></div>
</div>

<div class="card" id="jplay" style="display:none">
 <div class="bar" id="jbar"></div>
 <div class="tx" id="jtx"></div>
 <div class="q"><h3><i style="background:var(--pl)"></i><span id="t_jdr"></span></h3><div class="opts" id="jdr"></div></div>
 <div class="q"><h3><i style="background:var(--cf)"></i><span id="t_jcr"></span></h3><div class="opts" id="jcr"></div></div>
 <div class="go"><button id="jans"></button><button id="jnext" class="sec" style="display:none"></button><span class="score" id="jscore"></span></div>
 <div id="jexp"></div>
 <div class="books" id="jbooks"></div>
</div>

<div class="card" id="result" style="display:none">
 <h2 id="t_result"></h2>
 <p id="verdict" style="font-size:15px;font-weight:700"></p>
 <div class="pat" id="pat"></div>
 <div id="final"></div>
 <div class="go"><button id="btn_again"></button><button id="btn_lv" class="sec"></button></div>
</div>
</div>

 {t:['屋台の1か月分の減価償却4,000円を計上した','포장마차 한 달 치 감가상각 4,000엔을 계상했다','Recorded one month’s depreciation of 4,000 yen on the cart'],a:4000,dr:'529',cr:'165',w:['減価償却費（費用）が左。屋台の価値を直接減らすので右は器具備品（直接法）。','감가상각비(비용)가 왼쪽. 포장마차의 가치를 직접 줄이므로 오른쪽은 비품(직접법).','Depreciation (an expense): left. The cart’s value is reduced directly, so equipment goes on the right (direct method).']},
 {t:['今月使った材料7万5,000円を費用にした（残り1万5,000円は在庫）','이번 달 쓴 재료 7만 5,000엔을 비용으로 잡았다(남은 1만 5,000엔은 재고)','Expensed 75,000 yen of ingredients used (15,000 remains as stock)'],a:75000,dr:'502',cr:'142',w:['使った分を在庫（資産）から費用へ移す。費用が左、在庫が右。','쓴 만큼을 재고(자산)에서 비용으로 옮긴다. 비용이 왼쪽, 재고가 오른쪽.','Move what was used from stock (an asset) to expense: expense left, stock right.']},
 {t:['今月の税金1万6,000円を見積もった（来月払う）','이번 달 세금 1만 6,000엔을 추정했다(다음 달 냄)','Accrued 16,000 yen of tax for the month (paid next month)'],a:16000,dr:'550',cr:'205',w:['税金（費用）が左、まだ払っていないので未払法人税等（負債）が右。','세금(비용)이 왼쪽, 아직 내지 않았으므로 미지급법인세(부채)가 오른쪽.','Tax (an expense): left. Not yet paid, so income taxes payable (a liability): right.']}];
var JA=['100','121','142','165','220','205','300','400','502','526','511','525','540','529','550'];
var jdeck=[],ji=0,jpick={dr:null,cr:null},jdone=false,jscore=0,jres=[],jpost=[];
function an(c){var a=window.ACCTS&&ACCTS.by[c];return a?a.n[LI]:c}
function yf(v){return Math.round(v).toLocaleString('ja-JP')}
function jbal(){var B={};jpost.forEach(function(p){(B[p.dr]=B[p.dr]||{d:0,c:0}).d+=p.a;(B[p.cr]=B[p.cr]||{d:0,c:0}).c+=p.a});return B}
function nb(c,b){var g=ACCTS.by[c].g;return (g==='a'||g==='x')?b.d-b.c:b.c-b.d}
function jbooks(){var T=LJ[lang],B=jbal(),ks=Object.keys(B).sort();
 var jl='<div class="stmt"><h3><i style="background:var(--pl)"></i>'+T.jr+'</h3><table class="jl">'+jpost.map(function(p,k){return '<tr><td>'+(k+1)+'</td><td>'+an(p.dr)+'</td><td>'+yf(p.a)+'</td></tr><tr><td></td><td class="cr">'+an(p.cr)+'</td><td>'+yf(p.a)+'</td></tr>'}).join('')+'</table></div>';
 var lg='<div class="stmt"><h3><i style="background:var(--bs)"></i>'+T.led+'</h3><table><tr><td><b>'+T.acc+'</b></td><td><b>'+T.d+'</b></td><td><b>'+T.c+'</b></td><td><b>'+T.bal+'</b></td></tr>'+ks.map(function(c){return '<tr><td>'+an(c)+'</td><td>'+(B[c].d?yf(B[c].d):'')+'</td><td>'+(B[c].c?yf(B[c].c):'')+'</td><td>'+yf(nb(c,B[c]))+'</td></tr>'}).join('')+'</table></div>';
 document.getElementById('jbooks').innerHTML=jpost.length?jl+lg:''}
function startJ(){level='d';jdeck=JC.slice();ji=0;jscore=0;jres=[];jpost=[];document.getElementById('play').style.display='none';document.getElementById('result').style.display='none';document.getElementById('jplay').style.display='';render();jcard()}
function jcard(){var T=LJ[lang],c=jdeck[ji];jdone=false;jpick={dr:null,cr:null};
 document.getElementById('t_jdr').textContent=T.dr;document.getElementById('t_jcr').textContent=T.cr;document.getElementById('jans').textContent=T.ans;document.getElementById('jnext').textContent=T.next;
 document.getElementById('jbar').innerHTML=jdeck.map(function(_,k){return '<span class="'+(k<ji?(jres[k]===2?'ok':'ng'):k===ji?'now':'')+'"></span>'}).join('');
 document.getElementById('jtx').innerHTML=c.t[LI]+'　'+yf(c.a)+(lang==='en'?' yen':'円').replace('円',lang==='ko'?'엔':'円')+'<small>'+(ji+1)+' '+L[lang].of+' '+jdeck.length+'</small>';
 ['dr','cr'].forEach(function(side){var el=document.getElementById('j'+side);el.innerHTML='';JA.forEach(function(k){var b=document.createElement('button');b.textContent=an(k);b.dataset.k=k;b.onclick=function(){if(jdone)return;jpick[side]=k;el.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x.dataset.k===k)});document.getElementById('jans').disabled=!(jpick.dr&&jpick.cr)};el.appendChild(b)})});
 document.getElementById('jans').disabled=true;document.getElementById('jans').style.display='';document.getElementById('jnext').style.display='none';document.getElementById('jexp').innerHTML='<p class="note">'+T.rule+'</p>';
 document.getElementById('jscore').innerHTML=L[lang].score+' <b>'+jscore+'</b> '+L[lang].of+' '+(jdeck.length*2);jbooks()}
function jrestore(){var T=LJ[lang],c=jdeck[ji],pts=jres[ji];
 ['dr','cr'].forEach(function(side){var el=document.getElementById('j'+side);el.querySelectorAll('button').forEach(function(b){b.disabled=true;var k=b.dataset.k;b.classList.toggle('on',k===jpick[side]);if(k===c[side])b.classList.add('right');else if(k===jpick[side])b.classList.add('wrong')})});
 var v=pts===2?'<span class="v ok">'+T.ok+'</span>':pts===0?'<span class="v ng">'+T.ng+'</span>':'<span class="v">'+T.half+'</span>';
 document.getElementById('jexp').innerHTML='<div class="exp">'+v+'<ul><li>'+T.right+(lang==='en'?': Debit ':'：（'+T.d+'）')+an(c.dr)+' '+yf(c.a)+(lang==='en'?' / Credit ':' ／（'+T.c+'）')+an(c.cr)+' '+yf(c.a)+'</li><li>'+T.why+(lang==='en'?': ':'：')+c.w[LI]+'</li></ul></div>';
 document.getElementById('jans').style.display='none';document.getElementById('jnext').style.display='';document.getElementById('jscore').innerHTML=L[lang].score+' <b>'+jscore+'</b> '+L[lang].of+' '+(jdeck.length*2);jbooks()}
document.getElementById('jans').onclick=function(){if(jdone)return;var c=jdeck[ji];jdone=true;var pts=(jpick.dr===c.dr?1:0)+(jpick.cr===c.cr?1:0);jscore+=pts;jres[ji]=pts;jpost.push({dr:c.dr,cr:c.cr,a:c.a});jrestore()};
document.getElementById('jnext').onclick=function(){ji++;if(ji<jdeck.length)jcard();else showJ()};
function showJ(){var T=LJ[lang],d=L[lang],B=jbal(),max=jdeck.length*2,rate=jscore/max;document.getElementById('jplay').style.display='none';document.getElementById('result').style.display='';document.getElementById('t_result').textContent=d.result;
 document.getElementById('verdict').textContent=d.score+' '+jscore+' '+d.of+' '+max+'（'+Math.round(rate*100)+'%） ― '+T.verdict[rate>=0.9?0:rate>=0.6?1:2];document.getElementById('pat').innerHTML='';
 var ks=Object.keys(B).sort(),td=0,tc=0,tb=ks.map(function(c){var v=B[c].d-B[c].c;if(v>=0)td+=v;else tc-=v;return '<tr><td>'+an(c)+'</td><td>'+(v>0?yf(v):'')+'</td><td>'+(v<0?yf(-v):'')+'</td></tr>'}).join('');
 var rev=0,cost=0,pl='',bsa='',bsl='',ta=0,tl=0;ks.forEach(function(c){var A=ACCTS.by[c],v=nb(c,B[c]);if(A.g==='r'){rev+=v;pl+='<tr><td>'+an(c)+'</td><td>'+yf(v)+'</td></tr>'}else if(A.g==='x'){cost+=v;pl+='<tr><td>'+an(c)+'</td><td>−'+yf(v)+'</td></tr>'}else if(A.g==='a'){ta+=v;bsa+='<tr><td>'+an(c)+'</td><td>'+yf(v)+'</td></tr>'}else{tl+=v;bsl+='<tr><td>'+an(c)+'</td><td>'+yf(v)+'</td></tr>'}});
 var ni=rev-cost;
 document.getElementById('final').innerHTML='<div class="three"><div class="stmt"><h3><i style="background:var(--muted)"></i>'+T.tb+'</h3><table><tr><td><b>'+T.acc+'</b></td><td><b>'+T.d+'</b></td><td><b>'+T.c+'</b></td></tr>'+tb+'<tr class="sum"><td>'+T.tot+'</td><td>'+yf(td)+'</td><td>'+yf(tc)+'</td></tr></table><p class="note">'+(td===tc?T.match:T.nomatch)+'</p></div>'+
  '<div class="stmt"><h3><i style="background:var(--pl)"></i>'+T.pl+'</h3><table>'+pl+'<tr class="sum"><td>'+T.ni+'</td><td>'+yf(ni)+'</td></tr></table></div>'+
  '<div class="stmt"><h3><i style="background:var(--bs)"></i>'+T.bs+'</h3><table>'+bsa+'<tr class="sum"><td>'+T.ta+'</td><td>'+yf(ta)+'</td></tr>'+bsl+'<tr><td>'+T.re+'</td><td>'+yf(ni)+'</td></tr><tr class="sum"><td>'+T.tle+'</td><td>'+yf(tl+ni)+'</td></tr></table></div></div>'+
  '<a class="lk" href="../12_일본지점인사재무실무/決算の練習.html">'+T.more+'</a>'}
var _render=render;render=function(){_render();var T=LJ[lang],LV=document.getElementById('levels');if(LV&&!LV.querySelector('[data-lv=d]')){var b=document.createElement('button');b.dataset.lv='d';b.innerHTML='<b>'+T.lv[0]+'</b><small>'+T.lv[1]+'</small>';b.className=level==='d'?'on':'';b.onclick=function(){startJ()};LV.appendChild(b)}
 if(level!=='d'){document.getElementById('jplay').style.display='none';return}
 if(document.getElementById('jplay').style.display!=='none'){if(jdone)jrestore();else{var keep=jpick;jcard();['dr','cr'].forEach(function(s){if(keep[s]){jpick[s]=keep[s];document.querySelectorAll('#j'+s+' button').forEach(function(x){x.classList.toggle('on',x.dataset.k===keep[s])})}});document.getElementById('jans').disabled=!(jpick.dr&&jpick.cr)}}};
var _show=showResult;showResult=function(){if(level==='d'){showJ();return}_show()};
var _start=start;start=function(k){if(k==='d'){startJ();return}document.getElementById('jplay').style.display='none';_start(k)};
document.getElementById('btn_again').onclick=function(){start(level)};
render();
</script>
