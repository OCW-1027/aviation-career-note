.langs{display:inline-flex}.langs button{cursor:pointer}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.card h2{font-size:15px;margin:0 0 10px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 140px;min-height:48px;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 10px;font-size:14px;cursor:pointer;color:var(--ink);text-align:left;line-height:1.3}
.seg button small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.seg button.on{border-color:var(--ink);background:#eef3f8}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:720px){.row2{grid-template-columns:1fr}}
.lf{display:flex;align-items:center;gap:12px;margin-top:8px}.lf input{flex:1;min-height:44px;accent-color:var(--ink)}.lf output{font-size:22px;font-weight:800;min-width:72px;text-align:right}
.hero{padding:18px}
.total{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:8px}
.total b{font-size:34px;letter-spacing:-.5px}.total span{color:var(--muted);font-size:14px}
.bar{display:flex;height:46px;border-radius:10px;overflow:hidden;background:#edf2f7}
.bar div{height:100%;transition:width .6s cubic-bezier(.2,.7,.2,1);position:relative}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;margin-top:12px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px;justify-content:space-between}.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.legend span{color:var(--muted)}.legend b{font-variant-numeric:tabular-nums}
.rev{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.revbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#edf2f7}.revbar div{transition:width .6s}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi span{display:block;color:var(--muted);font-size:12.5px}.kpi b{font-size:22px;font-variant-numeric:tabular-nums}.kpi em{font-style:normal;font-size:12px;color:var(--muted);display:block}
.kpi.good b{color:var(--ok)}.kpi.bad b{color:var(--ng)}
.sc{display:flex;flex-wrap:wrap;gap:8px}
.sc button{min-height:46px;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
.sc button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.delta{margin-top:10px;font-size:14px}.delta b{font-variant-numeric:tabular-nums}.up{color:var(--ng)}.dn{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
button:focus-visible,input:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
details{border:1px solid var(--line);border-radius:12px;padding:0;margin:8px 0;background:var(--paper)}summary{cursor:pointer;padding:12px 14px;font-weight:700;display:flex;align-items:center;gap:10px;min-height:46px;list-style:none}summary::-webkit-details-marker{display:none}summary i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}summary .tg{margin-left:auto;font-size:12px;font-weight:400;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}summary .amt{font-weight:800;font-variant-numeric:tabular-nums}
.dbody{padding:0 14px 14px;font-size:14px}.dbody h4{font-size:13px;color:var(--muted);margin:10px 0 4px}.dbody ul{margin:4px 0;padding-left:20px}.dbody li{margin:2px 0}
.formula{background:#f3f6fa;border-radius:8px;padding:8px 10px;font-family:Consolas,Menlo,monospace;font-size:13px;overflow-x:auto;white-space:nowrap}
.exp p{margin:6px 0;font-size:14px;max-width:72ch}.exp .big{font-size:15px}
.chart{width:100%;height:auto;display:block;margin:8px 0}
@media(prefers-reduced-motion:reduce){.bar div,.revbar div{transition:none}}

     '座席を1席多く売ると、収入は運賃 {fare}円＋付帯収入 {anc}円、追加の費用は約 {mc}円（販売手数料と機内サービス分）。差額 {mg}円がそのまま損益に乗ります。だから航空会社は座席利用率を1ポイントでも上げようとします。',
     '下のグラフは、座席利用率を40%から100%まで動かしたときの収入（青）と費用（橙）です。2本の線が交わる {be} が損益分岐点。いまの利用率 {lf} はその{side}にあります。費用の線がほとんど平らなのが、固定費の大きい航空事業の特徴です。'],

 E:{fuel:{sub:['ジェット燃料の代金（市況はシンガポール・ケロシンなどの指標価格）','国内線の航空機燃料税（日本）','給油作業・貯蔵の手数料','燃油ヘッジの損益（会社によって費用に含める）'],how:'消費量 {burn}kg/時 × 飛行時間 {bh}時間 × 単価 {yk}円/kg ＝ {v}円。単価は、ケロシン {kero}ドル/バレル × 為替 {fx}円 ÷ 127kg/バレル で計算しています。{delaytxt}',field:'機体の重さ（搭載量・燃料の積みすぎ）、地上での待機時間、エンジンの使い方で変わります。支店にできるのは、搭載の正確さと定時出発で無駄な燃料を減らすこと。'},

  handling:{sub:['チェックイン・搭乗口の案内要員','手荷物の仕分け・搭載・取り降ろし','ランプ作業（プッシュバック・給水・汚水・GPU）','機内清掃・リネン','冬季の除氷・防氷（別料金が多い）','運航書類の受け渡し・ロードコントロール'],how:'1便あたりの契約単価 {hdl}円（機材の大きさと国際・国内で変わる）{delaytxt2} ＝ {v}円。実際はSGHAの付属書Bで便ごと・作業ごとの単価が決まります。',field:'支店が直接管理する費用。追加作業の依頼、遅延時の延長作業、契約外の作業が請求を押し上げます（空港支店の運営実務 2-1・4-8）。'},
  maint:{sub:['定期点検（Aチェック・Cチェック）と整備士の人件費','エンジン・補助動力装置のオーバーホール積立','部品の購入・修理・リース','外注整備（海外MROなど）','不具合対応・部品の緊急輸送'],how:'飛行1時間あたりの整備費 {maint}円 × 飛行時間 {bh}時間 ＝ {v}円。実際は飛行時間とサイクル（離着陸回数）の両方で発生し、エンジン整備は数年分を積み立てます。',field:'乱暴な地上作業（機体への接触）や異物（FOD）は整備費を直接増やします。ランプの安全が整備費を守ります。'},
  own:{sub:['自社所有機の減価償却（取得価額を使用年数で配分）','運用リースのリース料','予備エンジン・予備部品の償却','機体保険の一部'],how:'飛行1時間あたりの機材費 {own}円 × 飛行時間 {bh}時間 ＝ {v}円。年間の減価償却＋リース料を、年間の飛行時間で割って1便に配っています。飛ばなくてもかかる費用なので、機材の稼働率が高いほど1便あたりは下がります。',field:'支店の運用では変えられない費用ですが、「飛ばない日もかかっている」と知ることが、定時運航と機材の回転を大切にする理由になります。'},
  airport:{sub:['着陸料（最大離陸重量に応じた料金）','駐機料（スポット・ナイトステイ）','航行援助施設の使用料（航空路・管制）','保安料・旅客搭乗橋の使用料','ターミナル施設の賃料（カウンター・事務所は固定費として本社・支店側で計上）'],how:'着陸料 {landing}円（最大離陸重量 {mtow}トン × 単価）＋ 航行使用料 {nav}円（距離 {km}km × 単価 × 機体の大きさ）＋ 駐機・施設 60,000円 ＝ {v}円。旅客施設使用料（PSFC）はお客様が運賃と一緒に払うので、航空会社の費用には入れていません。',field:'空港の決める公的な料金で、航空会社の努力では下げにくい費用です（ANAの資料も「管理不可能な公的負担コスト」と説明）。深夜の駐機や時間外の申請は追加料金になります。'},
  sales:{sub:['予約システム（GDS）の利用料','旅行会社への販売手数料','クレジットカードの決済手数料','広告・プロモーション'],how:'運賃収入 {farerev}円 × {salesPct}% ＝ {v}円。実際は販売経路（自社サイト・旅行会社・GDS）ごとに料率が違い、自社サイトの比率を上げると下がります。',field:'乗客が増えるほど増える「変動費」のひとつ。'},

  overhead:{sub:['本社の人件費（企画・財務・人事・運航管理）','ITシステム（予約・運航・整備のシステム）','乗務員・地上職の教育訓練','支店の事務所費・固定人件費','監査・法務・保険の共通費'],how:'直接費の合計 {sub}円 × {ohPct}% ＝ {v}円。本社や支店の固定費は特定の便には結びつかないので、便数や座席キロに応じて「配賦」します。配賦のしかたは会社ごとに違います。',field:'便数を増やすと1便あたりの配賦は小さくなります。路線の採算を見るとき、この配賦を含めるか（フルコスト）含めないか（直接費）で結論が変わることがあります。'}},

ko:{exp:'이 숫자를 어떻게 읽나',items:'비용 항목별 해설 — 무엇이 들어가고 어떻게 계산했나',itemslead:'각 항목을 열면 실제 항공사에서 그 항목에 들어가는 비용, 이 도구의 계산식(지금 숫자를 대입한 것), 현장이 움직일 수 있는 부분이 나옵니다.',kpiexp:'지표의 계산식',

 X:['띠 그래프는 이 한 편을 띄우는 데 드는 비용을 연료비부터 본사 간접비까지 9개 항목으로 늘어놓은 것입니다. 합계 {tot}엔 가운데 승객이 한 명도 없어도 드는 비용(연료·승무원·조업·정비·항공기·공항·간접비)이 {fixed}엔, 전체의 {fixedPct}입니다. 승객이 늘면 함께 느는 비용은 판매비와 기내 서비스·보험뿐입니다.',
     '좌석을 하나 더 팔면 수입은 운임 {fare}엔 + 부대수입 {anc}엔, 추가 비용은 약 {mc}엔(판매 수수료와 기내 서비스)입니다. 차액 {mg}엔이 그대로 손익에 얹힙니다. 그래서 항공사는 탑승률을 1%p라도 올리려 합니다.',
     '아래 그림은 탑승률을 40%에서 100%까지 움직였을 때의 수입(파랑)과 비용(주황)입니다. 두 선이 만나는 {be}가 손익분기점. 지금 탑승률 {lf}는 그 {side}에 있습니다. 비용선이 거의 평평한 것이 고정비가 큰 항공 사업의 특징입니다.'],
 side:{ok:'오른쪽(흑자 쪽)',ng:'왼쪽(적자 쪽)'},
 lccnote:'【LCC 설정】운임을 낮추는 대신 부대수입(수하물·좌석 지정·기내 판매)이 수입의 {ancpct}를 차지합니다. 화물은 거의 운반하지 않고, 기내식은 유료라 「기내 서비스」 비용이 거의 없습니다. 단일 기종에 가동률이 높아 한 편당 항공기 비용이 낮고, 승무원·조업은 필요 최소한, 판매는 직판 중심(판매비 {salesPct}%), 본사도 작습니다(간접비 {ohPct}%). 그 결과 좌석킬로당 비용(CASK)은 {cask}엔으로, 같은 노선·기종의 FSC({fcask}엔)보다 낮아집니다. 실제 예: Peach의 좌석킬로당 수입 10.7엔(ANA 국내선 15.9엔), 라이언에어 부대수입 비율 33.8%, 제주항공 9.2%.',
 E:{fuel:{sub:['제트 연료 대금(시세는 싱가포르 케로신 등 지표 가격)','국내선 항공기 연료세(일본)','급유 작업·저장 수수료','연료 헤지 손익(회사에 따라 비용에 포함)'],how:'소비량 {burn}kg/시간 × 비행시간 {bh}시간 × 단가 {yk}엔/kg = {v}엔. 단가는 케로신 {kero}달러/배럴 × 환율 {fx}엔 ÷ 127kg/배럴로 계산합니다.{delaytxt}',field:'기체 무게(탑재량·연료 과다 탑재), 지상 대기 시간, 엔진 사용 방식에 따라 달라집니다. 지점이 할 수 있는 것은 정확한 탑재와 정시 출발로 낭비되는 연료를 줄이는 일입니다.'},
  crew:{sub:['조종사·객실승무원 급여와 상여','승무 수당·심야 수당','체재지 호텔과 일당(국제선)','훈련비와 자격 유지','유니폼·이동 교통비'],how:'(조종사 {pilots}명 × 26,000엔 + 객실승무원 {cabin}명 × 6,500엔) × (비행 {bh}시간 + 지상 1시간) × 노선 계수 {crewx} = {v}엔. 장거리는 교대 요원이 타므로 인원과 계수가 늘어납니다.',field:'지연이 길어지면 승무시간 상한에 걸려 교대 승무원과 숙박이 필요해집니다. 정시 운항이 승무원 비용을 지킵니다.'},
  handling:{sub:['체크인·탑승구 안내 인원','수하물 분류·탑재·하기','램프 작업(푸시백·급수·오수·GPU)','기내 청소·리넨','겨울철 제빙·방빙(별도 요금이 많음)','운항 서류 전달·로드컨트롤'],how:'한 편당 계약 단가 {hdl}엔(기종 크기와 국제·국내에 따라 다름){delaytxt2} = {v}엔. 실제로는 SGHA 부속서 B에서 편별·작업별 단가가 정해집니다.',field:'지점이 직접 관리하는 비용입니다. 추가 작업 요청, 지연 시 연장 작업, 계약 외 작업이 청구를 밀어 올립니다(공항 지점 운영 실무 2-1·4-8).'},
  maint:{sub:['정기 점검(A체크·C체크)과 정비사 인건비','엔진·보조동력장치 오버홀 적립','부품 구매·수리·리스','외주 정비(해외 MRO 등)','결함 대응·부품 긴급 수송'],how:'비행 1시간당 정비비 {maint}엔 × 비행시간 {bh}시간 = {v}엔. 실제로는 비행시간과 사이클(이착륙 횟수) 양쪽에서 발생하며, 엔진 정비는 몇 년 치를 적립합니다.',field:'거친 지상 작업(기체 접촉)과 이물질(FOD)은 정비비를 바로 늘립니다. 램프 안전이 정비비를 지킵니다.'},
  own:{sub:['자사 소유기의 감가상각(취득가액을 사용 연수로 배분)','운용리스 리스료','예비 엔진·예비 부품 상각','기체 보험 일부'],how:'비행 1시간당 항공기 비용 {own}엔 × 비행시간 {bh}시간 = {v}엔. 연간 감가상각 + 리스료를 연간 비행시간으로 나눠 한 편에 배부합니다. 날지 않아도 드는 비용이라, 기재 가동률이 높을수록 한 편당은 낮아집니다.',field:'지점 운영으로 바꿀 수 없는 비용이지만, 「날지 않는 날에도 들고 있다」는 것을 아는 것이 정시 운항과 기재 회전을 중시하는 이유가 됩니다.'},
  airport:{sub:['착륙료(최대 이륙 중량에 따른 요금)','주기료(스폿·나이트 스테이)','항행시설 사용료(항공로·관제)','보안료·탑승교 사용료','터미널 시설 임차료(카운터·사무실은 고정비로 본사·지점 쪽에서 계상)'],how:'착륙료 {landing}엔(최대 이륙 중량 {mtow}톤 × 단가) + 항행 사용료 {nav}엔(거리 {km}km × 단가 × 기체 크기) + 주기·시설 60,000엔 = {v}엔. 여객시설사용료(PSFC)는 승객이 운임과 함께 내므로 항공사 비용에 넣지 않았습니다.',field:'공항이 정하는 공적 요금이라 항공사 노력으로 낮추기 어렵습니다(ANA 자료도 「관리 불가능한 공적 부담 비용」이라고 설명). 심야 주기나 시간 외 신청은 추가 요금이 됩니다.'},
  sales:{sub:['예약 시스템(GDS) 이용료','여행사 판매 수수료','신용카드 결제 수수료','광고·프로모션'],how:'운임 수입 {farerev}엔 × {salesPct}% = {v}엔. 실제로는 판매 경로(자사 사이트·여행사·GDS)마다 요율이 다르고, 자사 사이트 비중을 올리면 내려갑니다.',field:'승객이 늘수록 느는 「변동비」의 하나.'},
  other:{sub:['기내식·음료·기내 판매 사입','기내 용품(담요·헤드폰·잡지)','기체·배상책임 보험','지연·결항 시 승객 보상','통신·기상 정보 서비스료'],how:'승객 {pax}명 × 1인당 {otherp}엔 + 한 편당 보험·잡비 {otherf}엔 = {v}엔. 국제선 장거리는 기내식이 여러 번 나오므로 1인당 금액이 커집니다.',field:'보상(식사권·호텔)이 이 항목에 들어갑니다. 지연 대응 판단이 비용에 직결됩니다.'},
  overhead:{sub:['본사 인건비(기획·재무·인사·운항관리)','IT 시스템(예약·운항·정비 시스템)','승무원·지상직 교육 훈련','지점 사무실비·고정 인건비','감사·법무·보험 공통비'],how:'직접비 합계 {sub}엔 × {ohPct}% = {v}엔. 본사나 지점의 고정비는 특정 편에 묶이지 않으므로 편수나 좌석킬로에 따라 「배부」합니다. 배부 방법은 회사마다 다릅니다.',field:'편수를 늘리면 한 편당 배부는 작아집니다. 노선 채산을 볼 때 이 배부를 넣는지(풀코스트) 빼는지(직접비)에 따라 결론이 달라질 수 있습니다.'}},
 K:[['좌석킬로당 비용(CASK)','비용 합계 {tot}엔 ÷ 좌석킬로 {ask}({seats}석 × {km}km) = {cask}엔. 좌석 하나를 1km 나르는 데 드는 비용. 노선이나 기종이 다른 편을 비교할 때의 공통 잣대입니다.'],
    ['좌석킬로당 수입(RASK)','수입 합계 {rev}엔 ÷ 좌석킬로 {ask} = {rask}엔. RASK가 CASK보다 크면 흑자입니다.'],
    ['손익분기 탑승률','(비용 합계 {tot}엔 − 화물 수입 {cargo}엔) ÷ (1석당 수입 {unit}엔 × {seats}석) = {be}. 이보다 탑승률이 높으면 흑자, 낮으면 적자입니다.'],
    ['좌석 1석당 비용','비용 합계 {tot}엔 ÷ {seats}석 = {perSeat}엔. 팔리든 안 팔리든 1석에 이만큼 들고 있다고 생각하면 빈 좌석의 무게가 보입니다.']],

en:{exp:'How to read these numbers',items:'Cost items explained: what is included and how it is calculated',itemslead:'Open an item to see what real airlines book under it, the formula this tool uses (with the current figures filled in), and what the station can influence.',kpiexp:'How the indicators are calculated',

 X:['The bar lays out the cost of operating this one flight in nine items, from fuel to head-office overheads. Of the total {tot} yen, {fixed} yen ({fixedPct}) is spent even with no passengers on board: fuel, crew, handling, maintenance, aircraft, airport charges and overheads. Only distribution and catering, insurance and sundries rise with passenger numbers.',
     'Selling one more seat brings in the fare {fare} yen plus ancillaries {anc} yen, and adds only about {mc} yen of cost (commission and catering). The difference, {mg} yen, drops straight to the result. That is why airlines fight for every point of load factor.',
     'The chart below moves the load factor from 40% to 100% and plots revenue (blue) against cost (orange). They cross at {be}, the break-even point; the current load factor {lf} sits to its {side}. The almost flat cost line is the mark of a business dominated by fixed costs.'],
 side:{ok:'right (profit side)',ng:'left (loss side)'},
 lccnote:'[LCC settings] Fares are low, so ancillaries (bags, seat selection, on-board sales) make up {ancpct} of revenue. Almost no cargo is carried and meals are sold, so catering cost nearly disappears. A single fleet type flown hard lowers aircraft cost per flight; crew and handling are kept to a minimum, sales are mostly direct (distribution {salesPct}%) and head office is lean (overheads {ohPct}%). As a result CASK is {cask} yen against {fcask} yen for a full-service carrier on the same route and aircraft. Real examples: Peach earns 10.7 yen per seat-km (ANA domestic 15.9), Ryanair gets 33.8% of revenue from ancillaries, Jeju Air 9.2%.',
 E:{fuel:{sub:['Jet fuel (priced off benchmarks such as Singapore kerosene)','Aviation fuel tax on domestic flights (Japan)','Into-plane and storage fees','Fuel hedging gains and losses (booked here by some airlines)'],how:'Burn {burn} kg/h × block time {bh} h × price {yk} yen/kg = {v} yen. Price = kerosene {kero} $/bbl × FX {fx} yen ÷ 127 kg per barrel.{delaytxt}',field:'Driven by aircraft weight (load, excess fuel), time on the ground and engine use. A station reduces waste through accurate loading and on-time departures.'},

  handling:{sub:['Check-in and gate agents','Baggage sorting, loading and unloading','Ramp services (pushback, water, lavatory, GPU)','Cabin cleaning and linen','Winter de-icing and anti-icing (often charged separately)','Flight documents and load control'],how:'Contract rate per turnaround {hdl} yen (varies with aircraft size and domestic/international){delaytxt2} = {v} yen. In practice SGHA Annex B sets rates per flight and per service.',field:'The cost a station controls most directly. Extra requests, extended work during delays and out-of-scope services push invoices up (Station Management 2-1, 4-8).'},
  maint:{sub:['Scheduled checks (A and C checks) and engineer pay','Engine and APU overhaul reserves','Spare parts purchase, repair and leasing','Outsourced maintenance (overseas MROs)','Defect rectification and emergency parts shipping'],how:'Maintenance {maint} yen per flying hour × block time {bh} h = {v} yen. Real costs accrue by both hours and cycles (take-offs and landings), and engine work is reserved over years.',field:'Rough ground handling (aircraft contact) and foreign object debris (FOD) add directly to maintenance. Ramp safety protects this line.'},
  own:{sub:['Depreciation of owned aircraft (purchase price spread over useful life)','Operating lease rentals','Depreciation of spare engines and parts','Part of hull insurance'],how:'Aircraft cost {own} yen per flying hour × block time {bh} h = {v} yen. Annual depreciation plus lease rentals are divided by annual flying hours and allocated to each flight. The cost runs whether or not the aircraft flies, so higher utilisation lowers the cost per flight.',field:'Not something a station can change, but knowing the aircraft costs money on days it does not fly is the reason punctuality and aircraft rotation matter.'},
  airport:{sub:['Landing fees (by maximum take-off weight)','Parking charges (stands, night stops)','Air navigation charges (en route and terminal control)','Security and boarding-bridge fees','Terminal rentals (counters and offices are booked as fixed costs by head office or the station)'],how:'Landing fee {landing} yen (MTOW {mtow} t × rate) + navigation charges {nav} yen (distance {km} km × rate × aircraft size) + parking and facilities 60,000 yen = {v} yen. Passenger facility charges are paid by passengers with the fare, so they are not an airline cost here.',field:'Public charges set by airports and authorities that airlines can barely influence (ANA describes them as public costs beyond management control). Late-night parking and out-of-hours requests add extra fees.'},
  sales:{sub:['Booking system (GDS) fees','Travel agency commissions','Card payment fees','Advertising and promotion'],how:'Fare revenue {farerev} yen × {salesPct}% = {v} yen. Rates differ by channel (own website, agencies, GDS); a higher direct share lowers this cost.',field:'One of the few costs that rise with passenger numbers.'},
  other:{sub:['Meals, drinks and in-flight sales stock','Cabin supplies (blankets, headsets, magazines)','Hull and liability insurance','Passenger compensation for delays and cancellations','Communications and weather services'],how:'Passengers {pax} × {otherp} yen each + insurance and sundries {otherf} yen per flight = {v} yen. Long-haul flights serve several meals, so the per-passenger amount is higher.',field:'Compensation (meal vouchers, hotels) sits here. Decisions during a delay feed straight into this cost.'},
  overhead:{sub:['Head-office staff (planning, finance, HR, operations control)','IT systems (reservations, operations, maintenance)','Training for crew and ground staff','Station offices and fixed staff costs','Audit, legal and shared insurance'],how:'Direct costs {sub} yen × {ohPct}% = {v} yen. Head-office and station fixed costs do not belong to any one flight, so they are allocated by flights or seat-km. Allocation methods differ by airline.',field:'More flights spread the allocation thinner. Whether a route pays can depend on whether this allocation is included (full cost) or excluded (direct cost).'}},
 K:[['Cost per seat-km (CASK)','Total cost {tot} yen ÷ seat-km {ask} ({seats} seats × {km} km) = {cask} yen. The cost of carrying one seat one kilometre, the common yardstick for comparing flights on different routes and aircraft.'],
    ['Revenue per seat-km (RASK)','Total revenue {rev} yen ÷ seat-km {ask} = {rask} yen. When RASK exceeds CASK the flight is profitable.'],
