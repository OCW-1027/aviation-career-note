<style>

*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans JP","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 60px}

.langs{display:inline-flex}.langs button{cursor:pointer}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}

.dec{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.dec button{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink);min-height:70px;font-size:14px;line-height:1.35}
.dec button small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:2px}
.dec button.on{border-color:var(--ink);background:#eef3f8}
.go{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.go button.sec{background:var(--paper);color:var(--ink);border:2px solid var(--line)}.go button:disabled{opacity:.4;cursor:default}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}@media(max-width:820px){.three{grid-template-columns:1fr}}

.stmt h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}.stmt h3 i{width:12px;height:12px;border-radius:3px;display:inline-block}
.stmt table{width:100%;border-collapse:collapse;font-size:13px}.stmt td{padding:3px 2px;border-bottom:1px solid #eef2f6}.stmt td.n{text-align:right;font-variant-numeric:tabular-nums}

.bar{display:flex;height:20px;border-radius:6px;overflow:hidden;background:#edf2f7;margin:4px 0 8px}.bar div{height:100%;transition:width .5s}
.bsbars{display:flex;gap:10px;align-items:flex-end;height:150px;margin:6px 0 4px}.bsbars>div{flex:1;display:flex;flex-direction:column-reverse;border-radius:8px;overflow:hidden;background:#edf2f7;height:100%}
.bsbars>div>div{width:100%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;overflow:hidden;transition:height .5s}
.bsl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kpi span{display:block;color:var(--muted);font-size:12px}.kpi b{font-size:20px;font-variant-numeric:tabular-nums}.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.why{background:#f3f6fa;border-radius:12px;padding:12px 14px;font-size:14px}.why h3{margin:0 0 6px;font-size:14px}.why ul{margin:4px 0;padding-left:20px}.why li{margin:4px 0}
.summary table{width:100%;border-collapse:collapse;font-size:13px}.summary td,.summary th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}.summary th:first-child,.summary td:first-child{text-align:left}
.verdict{font-size:15px;font-weight:700;margin-top:10px}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
details{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--paper)}summary{cursor:pointer;padding:12px 14px;font-weight:700;min-height:46px;display:flex;align-items:center}.dbody{padding:0 14px 14px;font-size:14px}.dbody p{margin:6px 0}
.inp{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 14px}.inp label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;min-height:40px}.inp input[type=number]{width:96px;min-height:40px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:14px;text-align:right}.inp label.chk{justify-content:flex-start}.inp input[type=checkbox]{width:20px;height:20px}
.custom{margin-top:10px;padding:12px 14px;border:2px dashed var(--line);border-radius:12px}.custom h3{margin:0 0 8px;font-size:14px}
button:focus-visible,input:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.bar div,.bsbars>div>div{transition:none}}
.goals{margin:0;padding-left:22px;font-size:14px}.goals li{margin:3px 0}.goals small{color:var(--muted);margin-left:6px}.score{margin-top:12px}.score table{width:100%;border-collapse:collapse;font-size:13.5px}.score th,.score td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}.score td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.score tr.tot td{font-weight:800;border-top:2px solid var(--line)}.rank{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 14px;border-radius:12px;background:#eef3f8}.rank b{font-size:30px;line-height:1;color:var(--ink)}.rank span{font-size:14px}.summary td:not(:first-child){white-space:nowrap}.score th{white-space:nowrap}
</style>

    d_fsc:'サーチャージで {fsc}億円を国際線で回収しました。計算は「原油高による燃油費の増加分（85ドル比、全体）× 国際線の比率60% × 回収率40%」という仮定です（全体の増加分の24%）。国内線には使えません。',d_custom:'直接入力：運賃 {cfare}%、供給 {ccap}%、燃油・ハンドリング削減 {ccut}%、購入 {cbuy}機、リース {clease}機{chedge}{cfsc}。基本の四半期と比べて収入 {drev}億円、費用 {dcost}億円。',ovrtxt:'状況を変更：原油 {oil}%（85ドル比）、為替 {fx}円、利用率 {lfd}ポイント（原油・為替は次の四半期以降も続き、利用率はこの四半期だけ）。',
    st:'この四半期の前提：原油 {oil}ドル/バレル（85ドル比 {oilp}）、為替 {fx}円/ドル。',carry:'原油価格と為替は、いったん変わると次の四半期以降も続きます。',cont:'適用中の対応：{list}。',CN:{hedge:'燃油ヘッジ',fsc:'サーチャージ改定',cost:'現場の費用削減'},sep:'・',
    link1:'当期純利益は {net}億円、営業キャッシュフローは {cfo}億円。差額の主な中身は、減価償却 {dep}億円（お金が出ていかない費用）と、前受金の増減 {dun}億円（先に受け取った航空券代）です。',
    link2:'現金は {dcash}億円変わりました。営業 {cfo}、投資 {cfi}（機材の購入）、財務 {cff}（借入と返済・リース返済）の合計です。',
    link3:'純資産は利益の分だけ増え（損失なら減り）、資産＝負債＋純資産 は毎四半期末に必ず一致します（いま {assets}億円）。'},
 HOW:[['3つの表のつながり','損益計算書の当期純利益は、貸借対照表の純資産（利益剰余金）に積み上がります。キャッシュフロー計算書の期末現金は、貸借対照表の現金と同じ数字です。このシミュレーションはその3つを毎四半期つないで計算しています。'],
      ['費用の動き方','燃油・ハンドリング・整備・空港使用料は座席キロ（飛ばした量）に比例して増減します。人件費・減価償却・賃借料は飛ばしても飛ばさなくてもほぼ同じ（固定費）。販売費は旅客収入の4%前後、その他は半分が乗客数に比例、半分が固定です。'],
      ['利益と現金のずれ','減価償却は過去に払った機材代を分割して費用にしているので、お金は出ていきません。航空券は乗る前に売れるので、前受金が増えると利益より先に現金が入ります。逆に機材の購入は一度に現金が出ますが、費用には少しずつしかなりません。'],
      ['指標','座席キロあたり収入（RASK）＝売上÷座席キロ、座席キロあたり費用（CASK）＝費用÷座席キロ。RASKがCASKを上回れば黒字。損益分岐の利用率は、いまの単価で何%席が埋まれば費用を回収できるかです（販売手数料など、乗る人の数に比例して増える費用も含めて計算）。']]},

      ['비용의 변동 구조','연료·조업·정비·공항 사용료는 좌석킬로(공급량)에 비례해 증감합니다. 인건비·감가상각·임차료는 운항 여부와 관계없이 거의 일정합니다(고정비). 판매비는 여객 수입의 4% 안팎, 기타는 절반이 승객 수에 비례하고 절반은 고정입니다.'],

var BASE={ask:50,lf:0.82,yld:15.0,cargo:75,ancPer:0.7317,other:30,

 bs:{cash:1200,ar:370,aircraft:2100,otherA:2330,unearned:720,debt:2300,otherL:1060,equity:1920},
 debtRepay:37.5,leaseRepay:15,intRate:0.025/4,tax:0.3};
var EVENTS=['calm','oil','boom','storm'];
function newState(){return {q:0,oil:1,fx:1,askX:1,leaseX:0,extraDep:0,hedge:false,fsc:false,costCut:false,bs:JSON.parse(JSON.stringify(BASE.bs)),hist:[],decs:[]}}
function runQuarter(S,ev,dec,o){var N=JSON.parse(JSON.stringify(S));o=o||{};var v=o.ovr||{};
 if(ev==='oil')N.oil=1.4; if(ev==='boom')N.fx=160/150;
 if(v.oil!=null)N.oil=1+v.oil/100; if(v.fx!=null)N.fx=v.fx/150;
 if(dec==='hedge'||(dec==='custom'&&o.hedge))N.hedge=true; if(dec==='fsc'||(dec==='custom'&&o.fsc))N.fsc=true; if(dec==='cost')N.costCut=true;
 var askX=N.askX,lf=BASE.lf,yld=BASE.yld,cancel=0,comp=0,cutF=N.costCut?0.98:1,cutH=N.costCut?0.97:1;
 if(dec==='add'){askX*=1.05;lf-=0.02} if(dec==='fare'){yld*=1.05;lf-=0.03}
 if(dec==='custom'){var fr=(o.fare||0)/100,cp=(o.cap||0)/100,ct=(o.cut||0)/100;yld*=1+fr;lf-=fr*0.6;askX*=1+cp;lf-=Math.max(0,cp)*0.4;cutF=Math.min(cutF,1-ct);cutH=Math.min(cutH,1-ct*1.5)}
 if(ev==='boom')lf=Math.min(0.95,lf+0.05); if(ev==='storm'){cancel=0.03;comp=3}
 if(v.lfd!=null)lf=Math.max(0.4,Math.min(0.97,lf+v.lfd/100));
 var ask=BASE.ask*askX*(1-cancel); var pax=ask*lf; var paxRev=pax*yld; var anc=pax*BASE.ancPer; var cargo=BASE.cargo*askX*(1-cancel);
 var oilEff=N.hedge?1+(N.oil-1)*0.5:N.oil; var fxEff=N.fx;
 var fuelBase=BASE.fuel*askX*(1-cancel); var fuel=fuelBase*oilEff*fxEff*cutF;
 var fsc=0; if(N.fsc&&N.oil>1.1){fsc=(fuel-fuelBase*fxEff*cutF)*0.4*0.6}
 var c={fuel:fuel,labor:BASE.labor*(0.7+0.3*askX),handling:BASE.handling*askX*cutH,maint:BASE.maint*askX*(1-cancel*0.5)*(0.8+0.2*fxEff),dep:BASE.dep+N.extraDep,
  airport:BASE.airport*askX*(1-cancel),lease:(BASE.lease+N.leaseX)*(0.5+0.5*fxEff),sales:paxRev*BASE.salesPct,misc:BASE.misc*(0.5+0.5*lf/BASE.lf)+comp+(N.hedge?1.5:0)};
 var rev=paxRev+anc+cargo+BASE.other+fsc; var cost=0;for(var k in c)cost+=c[k]; var op=rev-cost;
 var interest=N.bs.debt*BASE.intRate-N.bs.cash*0.001; var pretax=op-interest; var tax=pretax>0?pretax*BASE.tax:0; var net=pretax-tax;
 var capex=0,newLoan=0; if(dec==='buy'){capex=60;newLoan=30;N.extraDep+=0.75;N.askX+=0.02} if(dec==='lease'){N.leaseX+=0.9;N.askX+=0.02}
 if(dec==='custom'){var nb=o.buy||0,nl=o.lease||0;capex=60*nb;newLoan=30*nb;N.extraDep+=0.75*nb;N.leaseX+=0.9*nl;N.askX+=0.02*(nb+nl)}
 var unearnedNew=BASE.bs.unearned*(rev/750); var dun=unearnedNew-N.bs.unearned; var dar=(rev/750-1)*20;
 var cfo=net+c.dep+dun-dar; var cfi=-capex; var cff=newLoan-BASE.debtRepay-BASE.leaseRepay;
 var b=N.bs; b.cash=b.cash+cfo+cfi+cff; b.ar=b.ar+dar; b.aircraft=b.aircraft+capex-c.dep; b.unearned=unearnedNew; b.debt=b.debt+newLoan-BASE.debtRepay-BASE.leaseRepay; b.equity=b.equity+net;
 var assets=b.cash+b.ar+b.aircraft+b.otherA, le=b.unearned+b.debt+b.otherL+b.equity; b.otherL+= (assets-le); /* 미세 차이는 기타 부채(미지급 세금 등)로 흡수 */
 var unit=(yld*lf+BASE.ancPer*lf)*ask/lf; var varPerLf=ask*yld*BASE.salesPct+BASE.misc*0.5/BASE.lf; /* 利用率に比例して増える費用（販売費・その他の一部） */ var be=(cost-lf*varPerLf-cargo-BASE.other-fsc)/(ask*(yld+BASE.ancPer)-varPerLf);
 var r={ev:ev,dec:dec,o:o,rev:rev,c:c,cost:cost,op:op,interest:interest,tax:tax,net:net,cfo:cfo,cfi:cfi,cff:cff,dun:dun,bs:JSON.parse(JSON.stringify(b)),ask:ask,lf:lf,rask:rev/ask,cask:cost/ask,be:be,fsc:fsc,comp:comp,fuel:fuel,paxRev:paxRev,oilS:N.oil,fxS:N.fx,stHedge:N.hedge,stFsc:N.fsc,stCut:N.costCut,eqr:b.equity/(b.cash+b.ar+b.aircraft+b.otherA)};
 N.hist.push(r);N.decs.push({dec:dec,o:o});N.q++;return N}
function simulate(decs){var S=newState();for(var i=0;i<4;i++)S=runQuarter(S,EVENTS[i],decs[i]||'none');return S}
function readCustom(){function n(id){var e=document.getElementById(id);var x=parseFloat(e.value);return isNaN(x)?null:x}var ov={oil:n('o_oil'),fx:n('o_fx'),lfd:n('o_lfd')};var has=ov.oil!=null||ov.fx!=null||ov.lfd!=null;
