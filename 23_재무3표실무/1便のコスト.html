<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1便のコストを見る ― Vela Air 練習ツール</title>
<style>
:root{--ink:#1d2a38;--muted:#5b6b7d;--line:#dbe3ec;--bg:#f7fafd;--paper:#fff;--ok:#1f7a6e;--ng:#c2344f;--acc:#2f8fe0;--pl:#2f8fe0;--bs:#1f7a6e;--cf:#e08a2f}
*{box-sizing:border-box}body{margin:0;font-family:"Hiragino Sans","Noto Sans JP","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 70px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:22px;margin:6px 0}.lead{color:var(--muted);font-size:14px;margin:4px 0 14px;max-width:70ch}
.langs button{border:1px solid var(--line);background:var(--paper);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--ink)}
.langs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.card h2{font-size:15px;margin:0 0 10px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 140px;min-height:48px;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 10px;font-size:14px;cursor:pointer;color:var(--ink);text-align:left;line-height:1.3}
.seg button small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.seg button.on{border-color:var(--ink);background:#eef3f8}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:720px){.row2{grid-template-columns:1fr}}
.lf{display:flex;align-items:center;gap:12px;margin-top:8px}.lf input{flex:1;min-height:44px;accent-color:var(--ink)}.lf output{font-size:22px;font-weight:800;min-width:72px;text-align:right}
.hero{padding:18px}
.total{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:8px}
.total b{font-size:34px;letter-spacing:-.5px}.total span{color:var(--muted);font-size:14px}
.bar{display:flex;height:46px;border-radius:10px;overflow:hidden;background:#edf2f7}
.bar div{height:100%;transition:width .6s cubic-bezier(.2,.7,.2,1);position:relative}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;margin-top:12px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px;justify-content:space-between}.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.legend span{color:var(--muted)}.legend b{font-variant-numeric:tabular-nums}
.rev{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.revbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#edf2f7}.revbar div{transition:width .6s}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi span{display:block;color:var(--muted);font-size:12.5px}.kpi b{font-size:22px;font-variant-numeric:tabular-nums}.kpi em{font-style:normal;font-size:12px;color:var(--muted);display:block}
.kpi.good b{color:var(--ok)}.kpi.bad b{color:var(--ng)}
.sc{display:flex;flex-wrap:wrap;gap:8px}
.sc button{min-height:46px;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
.sc button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.delta{margin-top:10px;font-size:14px}.delta b{font-variant-numeric:tabular-nums}.up{color:var(--ng)}.dn{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
button:focus-visible,input:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.bar div,.revbar div{transition:none}}
</style>
</head>

<div class="wrap">
<header>
 <div><h1 id="t_title"></h1><p class="lead" id="t_lead"></p></div>
 <div class="langs" role="group" aria-label="language"><button data-l="ja">日本語</button><button data-l="ko">한국어</button><button data-l="en">English</button></div>
</header>

<div class="row2">
 <div class="card"><h2 id="t_route"></h2><div class="seg" id="routes"></div></div>
 <div class="card"><h2 id="t_type"></h2><div class="seg" id="types"></div></div>
</div>
<div class="card"><h2 id="t_lf"></h2>

<div class="card hero">

 <div class="legend" id="legend"></div>
 <div class="rev"><div class="total" style="margin-bottom:6px"><b id="revtotal" style="font-size:24px"></b><span id="t_rev"></span></div>
  <div class="revbar" id="revbar"></div><div class="legend" id="revlegend"></div></div>
</div>

<div class="kpis">
 <div class="kpi" id="k_profit"><span id="t_k1"></span><b></b><em></em></div>
 <div class="kpi"><span id="t_k2"></span><b id="k_seat"></b><em id="t_k2e"></em></div>
 <div class="kpi"><span id="t_k3"></span><b id="k_cask"></b><em id="k_rask"></em></div>
 <div class="kpi" id="k_be"><span id="t_k4"></span><b></b><em></em></div>
</div>

<div class="card"><h2 id="t_sc"></h2>
 <div class="sc" id="scen"></div>
 <div class="delta" id="delta"></div>
</div>

<div class="card"><h2 id="t_tbl"></h2>
 <table><thead><tr><th id="th1"></th><th class="n" id="th2"></th><th class="n" id="th3"></th><th id="th4"></th></tr></thead><tbody id="tbody"></tbody></table>
 <div class="note" id="t_note"></div>
</div>
</div>

 document.getElementById('revbar').innerHTML=['fare','anc','cargo'].map(function(k){return '<div style="width:'+(x.rv[k]/x.rev*100)+'%;background:'+RC[k]+'"></div>'}).join('');
 document.getElementById('revlegend').innerHTML=['fare','anc','cargo'].map(function(k){return '<div><span><i style="background:'+RC[k]+'"></i>'+d.RV[k]+'</span><b>'+fy(x.rv[k])+'</b></div>'}).join('')+'<div><span>'+x.pax+' '+d.pax+' / '+x.seats+' '+d.seats+'</span></div>';
 var kp=document.getElementById('k_profit');kp.className='kpi '+(x.profit>=0?'good':'bad');kp.querySelector('b').textContent=(x.profit>=0?'+':'−')+fy(Math.abs(x.profit));kp.querySelector('em').textContent=(x.profit>=0?d.profit:d.loss)+' '+pct(x.profit/x.rev);
 document.getElementById('k_seat').textContent=fy(x.perSeat);
 document.getElementById('k_cask').textContent=x.cask.toFixed(1)+' '+d.yen;document.getElementById('k_rask').textContent=d.cask+' '+x.rask.toFixed(1)+' '+d.yen;
 var kb=document.getElementById('k_be');kb.className='kpi '+(lf>=x.be?'good':'bad');kb.querySelector('b').textContent=pct(x.be);kb.querySelector('em').textContent=d.bego+' '+(lf>=x.be?d.beok:d.beng);
 var dc=x.tot-base.tot,dp=x.profit-base.profit;
 document.getElementById('delta').innerHTML=st.sc==='base'?'':d.vs+'<b class="'+(dc>0?'up':'dn')+'">'+(dc>=0?'+':'−')+fy(Math.abs(dc))+'</b>'+d.rev2+'<b class="'+(dp>=0?'dn':'up')+'">'+(dp>=0?'+':'−')+fy(Math.abs(dp))+'</b>';
 tb.innerHTML=ORDER.map(function(k){return '<tr><td><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+COL[k]+';margin-right:6px"></i>'+d.C[k][0]+'</td><td class="n">'+fy(x.c[k])+'</td><td class="n">'+pct(x.c[k]/x.tot)+'</td><td>'+d.C[k][1]+'</td></tr>'}).join('');}
document.querySelectorAll('.langs button').forEach(function(b){b.onclick=function(){lang=b.dataset.l;localStorage.setItem('art-lang',lang);render()}});
document.getElementById('lf').addEventListener('input',function(e){st.lf=+e.target.value/100;render()});
render();
