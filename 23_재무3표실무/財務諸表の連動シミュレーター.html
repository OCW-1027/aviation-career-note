<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>財務諸表の連動シミュレーター ― 小さな会社の1年を動かす</title>
<style>
:root{--ink:#1d2a38;--muted:#5b6b7d;--line:#dbe3ec;--bg:#f7fafd;--paper:#fff;--ok:#1f7a6e;--ng:#c2344f;--pl:#2f8fe0;--bs:#1f7a6e;--cf:#e08a2f}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans JP","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 60px}
header{position:relative}header h1{margin:0 0 8px}html[lang=ko] header h1,html[lang=ko] header p{word-break:keep-all}
h1{font-size:22px;margin:10px 0 4px}.lead{color:var(--muted);font-size:14px;margin:4px 0 14px;max-width:72ch}
.langs{display:inline-flex}.langs button{cursor:pointer}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.card h2{font-size:15px;margin:0 0 10px}
.lay{display:grid;grid-template-columns:340px 1fr;gap:14px}@media(max-width:900px){.lay{grid-template-columns:1fr}}
.grp{margin-bottom:12px}.grp h3{font-size:13px;margin:0 0 6px;color:var(--muted);display:flex;align-items:center;gap:8px}.grp h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sl{display:grid;grid-template-columns:1fr 70px;gap:6px;align-items:center;margin:4px 0}
.sl label{font-size:13px;grid-column:1/3;display:flex;justify-content:space-between}.sl label b{font-weight:700}
.sl input[type=range]{width:100%;grid-column:1/2}.sl output{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.presets button{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:13px;color:var(--ink);min-height:40px;text-align:left}
.presets button.on{border-color:var(--ink);background:#eef3f8}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}@media(max-width:1080px){.three{grid-template-columns:1fr}}
.stmt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper)}
.stmt h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}.stmt h3 i{width:12px;height:12px;border-radius:3px;display:inline-block}
.stmt table{width:100%;border-collapse:collapse;font-size:13px}.stmt td{padding:3px 2px;border-bottom:1px dashed #eef2f6}.stmt td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.stmt tr.sum td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}.stmt tr.hd td{font-weight:700;color:var(--muted);border-bottom:0;padding-top:8px}
.d{font-size:11px;margin-left:4px}.d.up{color:var(--ok)}.d.dn{color:var(--ng)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:10px}
.chk{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;background:#f0f8f6}.chk.bad{background:#fff0f2;border-color:#f1c2c9}.chk b{display:block}
.bridge{display:flex;align-items:flex-end;gap:6px;height:150px;margin:8px 0 4px;overflow-x:auto;padding-bottom:4px}
.bar{flex:1;min-width:52px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar i{display:block;width:100%;border-radius:4px 4px 0 0}.bar small{font-size:10px;color:var(--muted);text-align:center;line-height:1.2;margin-top:3px;height:26px}.bar b{font-size:11px}
.note{font-size:12px;color:var(--muted)}
.warn{border-left:5px solid var(--ng);background:#fff0f2;padding:8px 12px;border-radius:10px;margin-top:10px;font-size:14px}
.warn.ok{border-color:var(--ok);background:#f0f8f6}
details summary{cursor:pointer;font-weight:700;font-size:14px}.dbody{font-size:13px;color:var(--muted);margin-top:6px}
button:focus-visible,input:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
</style>
<script src="../1_지상직여객운송입문/assets/shell.js" data-page="finlink"></script>
</head>
<body>
<div class="wrap">
<header><span class="langs" id="lang" role="group" aria-label="Language"><button type="button" data-l="ja">日本語</button><button type="button" data-l="ko">한국어</button><button type="button" data-l="en">English</button></span><h1 id="t_title"></h1><p id="t_lead"></p></header>

<div class="card">
 <h2 id="t_presets"></h2>
 <div class="presets" id="presets"></div>
 <div class="lay">
  <div id="sliders"></div>
  <div>
   <div class="three">
    <div class="stmt"><h3><i style="background:var(--pl)"></i><span id="t_pl"></span></h3><table id="pl"></table></div>
    <div class="stmt"><h3><i style="background:var(--bs)"></i><span id="t_bs"></span></h3><table id="bs"></table></div>
    <div class="stmt"><h3><i style="background:var(--cf)"></i><span id="t_cf"></span></h3><table id="cf"></table></div>
   </div>
   <div class="checks" id="checks"></div>
   <div id="warn"></div>
  </div>
 </div>
</div>

<div class="card">
 <h2 id="t_bridge"></h2>
 <div class="bridge" id="bridge"></div>
 <p class="note" id="t_bridgenote"></p>
</div>

<div class="card">
 <details><summary id="t_how"></summary><div class="dbody" id="how"></div></details>
</div>
</div>
