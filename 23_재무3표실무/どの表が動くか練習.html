<style>

*{box-sizing:border-box}body{margin:0;font-family:"Hiragino Sans","Noto Sans JP","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}

header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}

.go{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.go button{min-height:48px;border:0;background:var(--ink);color:#fff;border-radius:12px;padding:0 20px;font-size:15px;cursor:pointer;font-weight:700}.go button.sec{background:var(--paper);color:var(--ink);border:2px solid var(--line)}.go button:disabled{opacity:.4;cursor:default}
.score{margin-left:auto;font-size:14px;color:var(--muted)}.score b{color:var(--ink);font-size:18px}
.exp{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fbfcfe;font-size:14px}.exp .v{font-weight:700}.exp .v.ok{color:var(--ok)}.exp .v.ng{color:var(--ng)}

.stmt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper)}.stmt h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}.stmt h3 i{width:12px;height:12px;border-radius:3px;display:inline-block}

.pat{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:10px}.pat div{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}.pat b{display:block}

button:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}

 document.querySelectorAll('.langs button').forEach(function(b){b.classList.toggle('on',b.dataset.l===lang)});document.getElementById('back').textContent={ja:'← 講座の目次',ko:'← 강좌 목차',en:'← Course index'}[lang];

 document.getElementById('tx').innerHTML=c.t[LI]+'<small>'+(i+1)+' '+d.of+' '+deck.length+'</small>';
