.langs{display:inline-flex}.langs button{cursor:pointer}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.card h2{font-size:16px;margin:0 0 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.card h2 .tag{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.pre{display:flex;flex-wrap:wrap;gap:8px}
.pre button{min-height:44px;padding:8px 14px;border:2px solid var(--line);background:var(--paper);border-radius:12px;font:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
.pre button.on{border-color:var(--ink);background:#eef3f8}.pre button.sub{font-weight:500;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.grp{border-left:5px solid var(--line);padding:2px 0 2px 12px;margin:14px 0 0}.grp.g1{border-color:var(--ink)}.grp.g2{border-color:var(--pl)}.grp.g3{border-color:var(--cf)}.grp.g4{border-color:var(--bs)}
.grp h3{font-size:14px;margin:0 0 8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 12px}
.g label{display:block;font-size:12.5px;color:var(--muted);font-weight:700}
.g input{display:block;width:100%;height:44px;margin-top:3px;padding:6px 10px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:16px;text-align:right;background:#fff;color:var(--ink)}
.r{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.r:first-of-type{border-top:0}
.r .nm{font-weight:700;font-size:14.5px}.r .v{font-size:20px;font-weight:800;text-align:right;white-space:nowrap}
.r .fm{grid-column:1/-1;font-size:13px;color:var(--muted);overflow-wrap:anywhere}.r .hn{grid-column:1/-1;font-size:13px}
.r.neg .v{color:var(--ng)}.r.na .v{color:var(--muted);font-weight:500}.r .al{color:var(--ng);font-weight:700}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:460px}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:right;white-space:nowrap}
th{background:#eef3f8;text-align:center;font-weight:700}td:first-child,th:first-child{text-align:center;font-weight:700;background:#f4f7fa}
td.base{background:#fff6e9;font-weight:800}
.sw{display:none;font-size:12px;color:var(--muted);margin:0 0 6px}
.ff{display:block;width:100%;max-width:640px;height:auto;margin:0 auto}
button:focus-visible,input:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
@media(max-width:600px){.card{padding:14px 12px}.sw{display:block}}
</style>
