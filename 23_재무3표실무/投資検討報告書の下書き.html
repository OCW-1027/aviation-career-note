<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>投資検討報告書の下書き</title>
<style>
:root{--ink:#1d2a38;--muted:#5b6b7d;--line:#dbe3ec;--bg:#f7fafd;--paper:#fff;--ok:#1f7a6e;--ng:#c2344f;--pl:#2f8fe0;--bs:#1f7a6e;--cf:#e08a2f}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans JP","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 60px}
header{position:relative}header h1{margin:0 0 8px}html[lang=ko] body{word-break:keep-all;overflow-wrap:break-word}
h1{font-size:22px;margin:10px 0 4px}.lead{color:var(--muted);font-size:14px;margin:4px 0 14px;max-width:72ch}
.langs{display:inline-flex}.langs button{cursor:pointer}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.card h2{font-size:16px;margin:0 0 6px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.card h2 .tag{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.pre{display:flex;flex-wrap:wrap;gap:8px}
.pre button,.acts button{min-height:44px;padding:8px 14px;border:2px solid var(--line);background:var(--paper);border-radius:12px;font:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
.acts button.main{background:var(--ink);border-color:var(--ink);color:#fff}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0 12px}
label{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin:10px 0 0}
input[type=text],select,textarea{display:block;width:100%;margin-top:3px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:16px;font-weight:500;background:#fff;color:var(--ink);min-height:44px!important}
input.n{text-align:right}textarea{min-height:76px!important;resize:vertical;line-height:1.5}
.li{display:grid;grid-template-columns:1fr 120px;gap:6px;margin:4px 0}.li input{margin:0}
.rk{display:grid;grid-template-columns:1.3fr 1fr 150px 1.5fr;gap:6px;margin:6px 0;padding-bottom:6px;border-bottom:1px dashed var(--line)}.rk input,.rk select{margin:0}
.sum{background:#eef3f8;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;margin:10px 0 0}
.ck{margin:0;padding-left:20px;font-size:14px}.ck li{margin:3px 0}.okmsg{color:var(--ok);font-weight:700;font-size:14px;margin:0}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}.acts select{width:auto;margin:0}.acts span{font-size:13px;color:var(--muted);font-weight:700}
.doc{background:#fff;border:1px solid var(--line);border-radius:6px;padding:26px 28px;font-size:14px;line-height:1.7;overflow-wrap:anywhere}
.doc h1{font-size:20px;margin:0 0 2px}.doc h2{font-size:15.5px;margin:20px 0 8px;padding:0 0 4px;border-bottom:2px solid var(--ink);display:block}
.doc h3{font-size:14px;margin:12px 0 2px}.doc .meta{color:var(--muted);font-size:13px;margin:0 0 6px}
.doc table{border-collapse:collapse;width:100%;margin:6px 0 10px;font-size:13.5px}
.doc th,.doc td{border:1px solid #9aa7b4;padding:5px 8px;vertical-align:top;text-align:left}
.doc th{background:#eef3f8;text-align:center}.doc td.r{text-align:right;white-space:nowrap}.doc tr.t td{font-weight:800;background:#f6f9fc}
.doc .ph{color:#9aa7b4}.doc p{margin:4px 0}.doc ol{margin:4px 0;padding-left:22px}
.dtw{overflow-x:auto}
#printroot{display:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
@media(max-width:760px){.rk{grid-template-columns:1fr 1fr}.li{grid-template-columns:1fr 96px}}
@media(max-width:600px){.card{padding:14px 12px}.doc{padding:16px 14px}}
@media print{body>*:not(#printroot){display:none!important}#printroot{display:block!important}#printroot .doc{border:0;padding:0}}
</style>
