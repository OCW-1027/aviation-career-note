<style>
:root{--ink:#1d2a3a;--sub:#5b6b7d;--line:#e3ebf3;--bg:#fff;--card:#f7fbff;--acc:#2F8FE0}
@media (prefers-color-scheme:dark){:root{--ink:#e8eef5;--sub:#a9b6c4;--line:#2a3a4c;--bg:#0f1720;--card:#16212d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Noto Sans KR","Hiragino Sans","Malgun Gothic",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 90px}
header{background:linear-gradient(160deg,#6db8f2,#2F8FE0);color:#fff;border-radius:20px;padding:24px 22px;position:relative}
header h1{font-size:clamp(21px,3.6vw,30px);margin:6px 0}header p{margin:0;max-width:72ch;opacity:.95}
.langs{position:absolute;top:14px;right:14px;display:inline-flex;border-radius:999px;overflow:hidden;background:#fff}.langs button{border:0;background:transparent;color:#1d5fa0;font:700 13px inherit;font-family:inherit;padding:6px 12px;cursor:pointer}.langs button.on{background:#FFE08A;color:#3A2A00}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 10px}.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;font:600 14px inherit;font-family:inherit;cursor:pointer}.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 8px}.bar input,.bar select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}.bar input{flex:1;min-width:200px}
.cnt{align-self:center;color:var(--sub);font-size:13px}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--card);font-size:13px;position:sticky;top:0}
td.c{font-family:Consolas,Menlo,monospace;font-weight:700;white-space:nowrap}td.s{color:var(--sub);font-size:13px}
.note{font-size:13px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:16px}
.more{margin:12px 0;text-align:center}.more button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 18px;border-radius:999px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.lead2{font-size:14px;color:var(--sub);margin:4px 0 10px}
mark{background:#FFE08A;color:inherit}a{color:var(--acc)}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--card);border:1px solid var(--line);color:var(--sub)}
</style>
</head>

ko:{kick:'항공 커리어 노트',ttl:'항공 코드 사전',lead:'공항 3레터(IATA)·4레터(ICAO), 도시 코드, 항공사 2레터·3레터, 국가별 기호, 항공권 번호 앞 3자리를 한곳에서 찾을 수 있습니다.',tabs:{apt:'공항',city:'도시 코드',al:'항공사',pfx:'ICAO 국가 기호',tkt:'항공권 번호 앞 3자리'},lds:{apt:'정기편이 있는 세계 공항. 3레터·4레터·이름·도시로 검색할 수 있습니다.',city:'공항이 여러 개인 도시에는 묶어서 나타내는 도시 코드가 있습니다. 예약·운임에 씁니다.',al:'주요 항공사의 2레터(IATA)와 3레터(ICAO).',pfx:'ICAO 4레터의 앞 1~2글자는 나라·지역을 나타냅니다.',tkt:'항공권 번호(13자리)의 앞 3자리는 항공사를 나타냅니다.'},ph:'검색 (예: NRT, RJTT, 인천, Sapporo)',allC:'전체 국가·지역',allS:'전체 규모',size:{L:'대',M:'중',S:'소'},cols:{apt:['3레터','4레터','공항','도시','국가·지역','규모'],city:['도시 코드','공항','도시'],al:['2레터','3레터','항공사','국가·지역'],pfx:['기호','국가·지역'],tkt:['앞 3자리','2레터','항공사']},n:'건',more:'더 보기',nodata:'공항 데이터 파일(airports_data.js)을 찾을 수 없습니다.',note:'출처: 공항은 OurAirports(퍼블릭 도메인, 2026년 9월 취득)에서 정기편이 있는 공항을 수록. 도시 코드·항공사·기호·항공권 번호는 이 사이트가 정리한 주요 목록입니다. 코드는 바뀔 수 있으니 업무에서는 최신 공식 자료(IATA·ICAO·각사)로 확인하세요. ★'},
en:{kick:'Aviation Career Note',ttl:'Aviation Code Dictionary',lead:'Look up airport three-letter (IATA) and four-letter (ICAO) codes, city codes, airline two- and three-letter codes, ICAO country prefixes and ticket number prefixes in one place.',tabs:{apt:'Airports',city:'City codes',al:'Airlines',pfx:'ICAO prefixes',tkt:'Ticket prefixes'},lds:{apt:'Airports worldwide with scheduled service. Search by IATA, ICAO, name or city.',city:'Cities with several airports have a city code used in reservations and fares.',al:'Two-letter (IATA) and three-letter (ICAO) codes of major airlines.',pfx:'The first one or two letters of an ICAO code show the country or region.',tkt:'The first three digits of a 13-digit ticket number identify the airline.'},ph:'Search (e.g. NRT, RJTT, Incheon, Sapporo)',allC:'All countries',allS:'All sizes',size:{L:'Large',M:'Medium',S:'Small'},cols:{apt:['IATA','ICAO','Airport','City','Country','Size'],city:['City code','Airports','City'],al:['IATA','ICAO','Airline','Country'],pfx:['Prefix','Country or region'],tkt:['Prefix','IATA','Airline']},n:' entries',more:'Show more',nodata:'The airport data file (airports_data.js) was not found.',note:'Sources: airports with scheduled service from OurAirports (public domain, retrieved September 2026). City codes, airlines, prefixes and ticket numbers are this site’s list of the main ones. Codes can change; check the latest official sources (IATA, ICAO, airlines) for operational use. ★'}};
function $(i){return document.getElementById(i)}
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hi(x,q){x=esc(x);if(!q)return x;var i=x.toLowerCase().indexOf(q.toLowerCase());return i<0?x:x.slice(0,i)+'<mark>'+x.slice(i,i+q.length)+'</mark>'+x.slice(i+q.length)}
function cname(cc){var c=(window.CTRY||{})[cc];if(!c)return cc;return (L==='ja'&&c[1])?c[1]:(L==='ko'&&c[2])?c[2]:c[0]}
function alName(a){return L==='ja'?a[4]:L==='ko'?a[5]:a[2]}
function render(){var t=T[L];document.documentElement.lang=L;document.title=t.ttl;['kick','ttl','lead','note'].forEach(function(k){$(k).textContent=t[k]});
 $('langs').innerHTML=['ja','ko','en'].map(function(l){return '<button type="button" data-l="'+l+'" class="'+(l===L?'on':'')+'">'+{ja:'日本語',ko:'한국어',en:'English'}[l]+'</button>'}).join('');
 Array.prototype.forEach.call($('langs').querySelectorAll('button'),function(b){b.onclick=function(){L=b.dataset.l;try{localStorage.setItem('art-lang',L)}catch(e){}render()}});
 $('tabs').innerHTML=Object.keys(t.tabs).map(function(k){return '<button type="button" data-t="'+k+'" class="'+(k===tab?'on':'')+'">'+t.tabs[k]+'</button>'}).join('');
 Array.prototype.forEach.call($('tabs').querySelectorAll('button'),function(b){b.onclick=function(){tab=b.dataset.t;limit=200;$('q')&&($('q').value='');render()}});
 $('tabLead').textContent=t.lds[tab];
 var qv=$('q')?$('q').value:'',cv=$('cc')?$('cc').value:'JP',sv=$('sz')?$('sz').value:'';
 var bar='<input id="q" type="search" placeholder="'+esc(t.ph)+'" value="'+esc(qv)+'">';
 if(tab==='apt'&&window.APT){var ccs=Object.keys(window.CTRY||{}).sort(function(a,b){if(a==='JP')return -1;if(b==='JP')return 1;if(a==='KR')return -1;if(b==='KR')return 1;return cname(a)<cname(b)?-1:1});
  bar+='<select id="cc"><option value="">'+t.allC+'</option>'+ccs.map(function(c){return '<option value="'+c+'"'+(c===cv?' selected':'')+'>'+esc(cname(c))+'</option>'}).join('')+'</select>';
  bar+='<select id="sz"><option value="">'+t.allS+'</option>'+['L','M','S'].map(function(s){return '<option value="'+s+'"'+(s===sv?' selected':'')+'>'+t.size[s]+'</option>'}).join('')+'</select>'}
 bar+='<span class="cnt" id="cnt"></span>';$('bar').innerHTML=bar;
 $('q').oninput=function(){limit=200;draw()};if($('cc'))$('cc').onchange=function(){limit=200;draw()};if($('sz'))$('sz').onchange=function(){limit=200;draw()};
 var qe=$('q');if(qv){qe.focus();qe.setSelectionRange(qv.length,qv.length)}
 draw()}
function draw(){var t=T[L],q=$('q').value.trim(),ql=q.toLowerCase(),rows=[],cols=t.cols[tab],h='';
 function m(arr){return !ql||arr.join(' ').toLowerCase().indexOf(ql)>=0}
 if(tab==='apt'){if(!window.APT){$('tbl').innerHTML='<tr><td>'+t.nodata+'</td></tr>';$('cnt').textContent='';$('more').innerHTML='';return}
  var cc=$('cc').value,sz=$('sz').value;
  window.APT.forEach(function(a){if(cc&&a[4]!==cc)return;if(sz&&a[5]!==sz)return;var nm=(L==='ja'&&a[6])?a[6]:(L==='ko'&&a[7])?a[7]:a[2];if(!m([a[0],a[1],a[2],a[3],a[6],a[7],cname(a[4])]))return;
   rows.push({s:(a[0].toLowerCase()===ql?0:a[1].toLowerCase()===ql?1:(a[6]===q||a[7]===q)?1:a[5]==='L'?2:3),h:'<tr><td class="c">'+hi(a[0],q)+'</td><td class="c">'+hi(a[1],q)+'</td><td>'+hi(nm,q)+(nm!==a[2]?'<div class="s">'+hi(a[2],q)+'</div>':'')+'</td><td>'+hi(a[3],q)+'</td><td>'+esc(cname(a[4]))+'</td><td><span class="badge">'+t.size[a[5]]+'</span></td></tr>'})});
  if(ql)rows.sort(function(x,y){return x.s-y.s});rows=rows.map(function(x){return x.h})}
 else if(tab==='city'){CITY.forEach(function(c){if(!m(c))return;var nm=L==='ja'?c[2]:L==='ko'?c[3]:c[4];rows.push('<tr><td class="c">'+hi(c[0],q)+'</td><td class="c">'+hi(c[1],q)+'</td><td>'+hi(nm,q)+'</td></tr>')})}
 else if(tab==='al'){AL.forEach(function(a){if(!m(a.concat([cname(a[3])])))return;var nm=alName(a);rows.push('<tr><td class="c">'+hi(a[0],q)+'</td><td class="c">'+hi(a[1],q)+'</td><td>'+hi(nm,q)+(nm!==a[2]?'<div class="s">'+hi(a[2],q)+'</div>':'')+'</td><td>'+esc(cname(a[3]))+'</td></tr>')})}
 else if(tab==='pfx'){PFX.forEach(function(p){if(!m(p))return;rows.push('<tr><td class="c">'+hi(p[0],q)+'</td><td>'+hi(L==='ja'?p[1]:L==='ko'?p[2]:p[3],q)+'</td></tr>')})}
 else {TKT.forEach(function(k){var a=AL.filter(function(x){return x[0]===k[1]})[0]||[k[1],'','','','',''];if(!m([k[0],k[1],a[2],a[4],a[5]]))return;rows.push('<tr><td class="c">'+hi(k[0],q)+'</td><td class="c">'+hi(k[1],q)+'</td><td>'+hi(alName(a),q)+'</td></tr>')})}
 h='<tr>'+cols.map(function(c){return '<th>'+c+'</th>'}).join('')+'</tr>'+rows.slice(0,limit).join('');
 $('tbl').innerHTML=h;$('cnt').textContent=rows.length+t.n;
 $('more').innerHTML=rows.length>limit?'<button type="button" id="mb">'+t.more+' ('+(rows.length-limit)+')</button>':'';
 if($('mb'))$('mb').onclick=function(){limit+=500;draw()}}
render();
</script>
