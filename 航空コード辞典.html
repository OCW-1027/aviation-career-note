.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 90px}
header{background:linear-gradient(160deg,#6db8f2,#2F8FE0);color:#fff;border-radius:20px;padding:24px 22px;position:relative}

.langs{position:absolute;top:14px;right:14px;display:inline-flex;border-radius:999px;overflow:hidden;background:#fff}.langs button{border:0;background:transparent;color:#1d5fa0;font:700 13px inherit;font-family:inherit;padding:6px 12px;cursor:pointer}.langs button.on{background:#FFE08A;color:#3A2A00}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 10px}.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;font:600 14px inherit;font-family:inherit;cursor:pointer}.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 8px}.bar input,.bar select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}.bar input{flex:1;min-width:200px}
.cnt{align-self:center;color:var(--sub);font-size:13px}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--card);font-size:13px;position:sticky;top:0}
td.c{font-family:Consolas,Menlo,monospace;font-weight:700;white-space:nowrap}td.s{color:var(--sub);font-size:13px}
.note{font-size:13px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:16px}
.more{margin:12px 0;text-align:center}.more button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 18px;border-radius:999px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.lead2{font-size:14px;color:var(--sub);margin:4px 0 10px}
mark{background:#FFE08A;color:inherit}a{color:var(--acc)}
.how details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin:0 0 10px}.how summary{cursor:pointer;font-weight:700;font-size:14px}.how p{margin:6px 0 2px;font-size:14px;line-height:1.75}
select{max-width:100%}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--card);border:1px solid var(--line);color:var(--sub)}

city:'複数の空港がある都市は、運賃の計算や検索に使う都市コードを持ちます（例：TYO＝羽田・成田）。IATAは2022年10月1日から、運賃の計算で1つの都市として扱う「複数空港都市」を1つの一覧にそろえました。この表はその一覧です。そのためニューアーク（EWR）はNYCに含まれず、単独の空港として運賃を計算します。予約システムの検索では、この一覧より広い範囲をまとめて表示することがあります。',
al:'2レター（IATA）は便名・予約・航空券に、3レター（ICAO）は管制・飛行計画の呼び出しに使います。例：日本航空＝JL／JAL、大韓航空＝KE／KAL。2レターは数字を含むことがあり（7C、6E）、別の会社と同じ2レターを分けて使う「管理された重複」（＊付き）もあります。韓国では、ティーウェイ航空が2026年9月10日にトリニティ航空に改称（TWは同じ）、アシアナ航空は2026年12月17日に大韓航空と、エアプサン・エアソウルは2027年3月17日にジンエアーと統合する予定です。',
pfx:'ICAOの4レターは「地域→国→空港」の順に並びます。例：RJTT＝R（日本・韓国などの地域）＋J（日本本土）＋TT（羽田）、RKSI＝RK（韓国）＋SI（仁川）。アメリカ本土（K）・カナダ（C）・オーストラリア（Y）は1文字で国を表し、アメリカ本土では3レターの前にKを付けたコードが多く使われます（KJFK）。I・J・Q・Xで始まる空港のコードはありません。ウズベキスタンは2025年10月2日にUTからUZに変わりました。',
reg:'機体の登録記号は「国籍記号＋登録記号」で、国籍記号は機体を登録した国を表します（シカゴ条約第20条、ICAO第7附属書）。日本はJA、韓国はHL、アメリカはNで、この3か国はハイフンを付けません（例：JA801A）。国籍記号は航空会社の国ではなく登録した国なので、リースの機体では別の国の記号（アイルランドのEI、バミューダのVP-B、マルタの9Hなど）がよく見られます。中国本土・台湾はどちらもBで、あとに続く文字の形で見分けます。',

lds:{apt:'정기편이 있는 세계 공항. 3레터·4레터·이름·도시로 검색할 수 있습니다.',city:'운임 계산에서 하나의 도시로 취급하는, 공항이 여러 개인 도시(IATA 공식 목록, 41개 도시).',al:'주요 항공사의 2레터(IATA)와 3레터(ICAO).',pfx:'ICAO 4레터의 앞 1~2글자가 나타내는 나라·지역(258개 기호).',reg:'기체 등록기호 앞에 붙는 국적 기호(210개 기호).',tkt:'항공권 번호·항공화물운송장 번호의 앞 3자리(IATA 회원 354개사).'},
howT:'읽는 법',how:{apt:'3레터(IATA)는 예약·시간표·수하물 태그에 쓰는 공항 코드, 4레터(ICAO)는 관제·비행계획·운항관리에 쓰는 코드입니다. 예: 하네다=HND/RJTT, 인천=ICN/RKSI. 4레터의 앞 글자는 나라·지역을 나타내므로(‘ICAO 국가 기호’ 탭), 4레터를 보면 대략적인 위치를 알 수 있습니다.',
city:'공항이 여러 개인 도시는 운임 계산과 검색에 쓰는 도시 코드를 가집니다(예: TYO=하네다·나리타). IATA는 2022년 10월 1일부터 운임 계산에서 하나의 도시로 취급하는 ‘복수 공항 도시’를 하나의 목록으로 통일했습니다. 이 표가 그 목록입니다. 그래서 뉴어크(EWR)는 NYC에 포함되지 않고 단독 공항으로 운임을 계산합니다. 예약 시스템 검색에서는 이 목록보다 넓은 범위를 묶어 보여 주기도 합니다.',
al:'2레터(IATA)는 편명·예약·항공권에, 3레터(ICAO)는 관제·비행계획 호출에 씁니다. 예: 일본항공=JL/JAL, 대한항공=KE/KAL. 2레터에는 숫자가 들어가기도 하고(7C, 6E), 다른 회사와 같은 2레터를 나눠 쓰는 ‘관리된 중복’(＊ 표시)도 있습니다. 한국에서는 티웨이항공이 2026년 9월 10일 트리니티항공으로 사명을 바꿨고(TW 유지), 아시아나항공은 2026년 12월 17일 대한항공과, 에어부산·에어서울은 2027년 3월 17일 진에어와 통합할 예정입니다.',
pfx:'ICAO 4레터는 ‘지역→나라→공항’ 순으로 이루어집니다. 예: RJTT=R(일본·한국 등의 지역)+J(일본 본토)+TT(하네다), RKSI=RK(한국)+SI(인천). 미국 본토(K)·캐나다(C)·호주(Y)는 한 글자로 나라를 나타내며, 미국 본토에서는 3레터 앞에 K를 붙인 코드를 많이 씁니다(KJFK). I·J·Q·X로 시작하는 공항 코드는 없습니다. 우즈베키스탄은 2025년 10월 2일 UT에서 UZ로 바뀌었습니다.',
reg:'기체 등록기호는 ‘국적 기호+등록 기호’이며, 국적 기호는 기체를 등록한 나라를 나타냅니다(시카고 협약 제20조, ICAO 부속서 7). 일본은 JA, 한국은 HL, 미국은 N이며, 이 세 나라는 하이픈을 붙이지 않습니다(예: JA801A). 국적 기호는 항공사의 나라가 아니라 등록한 나라이므로, 리스 기체에서는 다른 나라 기호(아일랜드 EI, 버뮤다 VP-B, 몰타 9H 등)가 자주 보입니다. 중국 본토와 대만은 모두 B이며 뒤에 오는 글자 형식으로 구별합니다.',
tkt:'항공권 번호(13자리)의 앞 3자리는 항공권을 발행한 항공사의 번호입니다. 예: 131-2345678901(예시)은 JAL이 발행한 항공권. 코드셰어편이나 다른 항공사 편이 포함된 여정에서도 앞 3자리는 발행한 회사를 나타내므로 실제 운항 회사와 다를 수 있습니다. 항공화물운송장(AWB)도 같은 번호를 쓰며 ‘앞 3자리+8자리’(마지막 1자리는 앞 7자리를 7로 나눈 나머지) 형식입니다. 여객과 화물 번호가 다른 회사도 있습니다(루프트한자 220/루프트한자 카고 020).'},

note:'출처: 공항=OurAirports(퍼블릭 도메인, 2026년 9월 취득). 도시 코드=IATA 결의 011c 부속 A(2022년 10월 1일 발효 복수 공항 도시 목록). ICAO 국가 기호=ICAO Doc 7910 구성(2025년 10월 우즈베키스탄 변경 반영). 기체 국적 기호=ICAO ‘Aircraft Nationality Marks’(2025년 6월판). 항공권 번호 앞 3자리=IATA ‘Current Airline Members’(2026년 9월 28일 취득, 회원사만). 항공사=이 사이트가 정리한 주요 목록. 코드는 바뀔 수 있으니 업무에서는 최신 공식 자료로 확인하세요. ★'},
en:{kick:'Aviation Career Note',ttl:'Aviation Code Dictionary',lead:'Look up airport three-letter (IATA) and four-letter (ICAO) codes, city codes, airline two- and three-letter codes, ICAO country prefixes, aircraft nationality marks and ticket number prefixes in one place.',
tabs:{apt:'Airports',city:'City codes',al:'Airlines',pfx:'ICAO prefixes',reg:'Nationality marks',tkt:'Ticket prefixes'},
lds:{apt:'Airports worldwide with scheduled service. Search by IATA, ICAO, name or city.',city:'Cities with several airports treated as one city for pricing (IATA’s official list, 41 cities).',al:'Two-letter (IATA) and three-letter (ICAO) codes of major airlines.',pfx:'The country or region shown by the first one or two letters of an ICAO code (258 prefixes).',reg:'The nationality mark at the start of an aircraft registration (210 marks).',tkt:'The first three digits of ticket and air waybill numbers (354 IATA member airlines).'},
howT:'How to read',how:{apt:'Three-letter IATA codes are used in reservations, timetables and bag tags; four-letter ICAO codes in air traffic control, flight plans and dispatch. For example, Haneda is HND / RJTT and Incheon ICN / RKSI. The first letters of an ICAO code show the country or region (see ICAO prefixes), so the code tells you roughly where the airport is.',
city:'Cities with several airports have a city code used for pricing and searches (e.g. TYO = Haneda and Narita). From 1 October 2022 IATA standardised a single list of Multi-Airport Cities treated as one city for pricing; this table is that list. That is why Newark (EWR) is not part of NYC and is priced as a stand-alone airport. Reservation systems may group a wider set of airports for searches.',
al:'Two-letter IATA codes are used in flight numbers, reservations and tickets; three-letter ICAO codes in ATC call signs and flight plans. For example, Japan Airlines is JL / JAL and Korean Air KE / KAL. Two-letter codes can include digits (7C, 6E), and some are controlled duplicates (marked *) shared by two carriers. In Korea, T’way Air became Trinity Airways on 10 September 2026 (still TW); Asiana is due to merge into Korean Air on 17 December 2026, and Air Busan and Air Seoul into Jin Air on 17 March 2027.',
pfx:'An ICAO code runs region → country → airport. For example, RJTT = R (region incl. Japan and Korea) + J (mainland Japan) + TT (Haneda); RKSI = RK (Korea) + SI (Incheon). The contiguous US (K), Canada (C) and Australia (Y) use a single letter, and US codes are often K + the IATA code (KJFK). No airport codes begin with I, J, Q or X. Uzbekistan changed from UT to UZ on 2 October 2025.',
reg:'A registration is nationality mark + registration mark, and the nationality mark shows the State of Registry (Chicago Convention Art. 20, ICAO Annex 7). Japan uses JA, Korea HL and the US N, all without a hyphen (e.g. JA801A). Because the mark shows where the aircraft is registered, not the airline’s nationality, leased aircraft often carry other marks (EI Ireland, VP-B Bermuda, 9H Malta). Mainland China and Taiwan both use B, told apart by the format that follows.',
tkt:'The first three digits of a 13-digit ticket number identify the airline that issued the ticket. For example, 131-2345678901 (example) is a JAL-issued ticket. Even on itineraries with codeshare or other carriers’ flights, the prefix shows the issuing airline, which may differ from the operating carrier. Air waybills use the same codes: prefix + 8 digits, the last being a check digit (the first seven digits modulo 7). Some airlines use different passenger and cargo codes (Lufthansa 220 / Lufthansa Cargo 020).'},
ph:'Search (e.g. NRT, RJTT, Incheon, Sapporo)',allC:'All countries',allS:'All sizes',allR:'All regions',allK:'Passenger and cargo',kind:{p:'Passenger',c:'Cargo only'},size:{L:'Large',M:'Medium',S:'Small'},

note:'Sources: airports from OurAirports (public domain, retrieved September 2026); city codes from IATA Resolution 011c Attachment A (Multi-Airport Cities, effective 1 October 2022); ICAO prefixes following ICAO Doc 7910 (including Uzbekistan’s October 2025 change); nationality marks from ICAO “Aircraft Nationality Marks” (June 2025); ticket prefixes from IATA “Current Airline Members” (retrieved 28 September 2026, members only); airlines are this site’s list of major carriers. Codes can change; check the latest official sources for operational use. ★'}};
function $(i){return document.getElementById(i)}

function cname(cc){var c=(window.CTRY||{})[cc];if(!c)return cc;return (L==='ja'&&c[1])?c[1]:(L==='ko'&&c[2])?c[2]:c[0]}

 var qv=$('q')?$('q').value:'',cv=$('cc')?$('cc').value:'JP',sv=$('sz')?$('sz').value:'',rv=$('rg')?$('rg').value:'',kv=$('kd')?$('kd').value:'';
 var bar='<input id="q" type="search" placeholder="'+esc(t.ph)+'" value="'+esc(qv)+'">';
 function ccOpts(list){return list.sort(function(a,b){if(a==='JP')return -1;if(b==='JP')return 1;if(a==='KR')return -1;if(b==='KR')return 1;return cname(a)<cname(b)?-1:1}).map(function(c){return [c,cname(c)]})}
 if(tab==='apt'&&window.APT){bar+=sel('cc',t.allC,ccOpts(Object.keys(window.CTRY||{})),cv)+sel('sz',t.allS,['L','M','S'].map(function(s){return [s,t.size[s]]}),sv)}
 if(tab==='pfx'){bar+=sel('rg',t.allR,Object.keys(PRG).map(function(k){return [k,k+(L==='en'?': ':'：')+tx(PRG[k])]}),rv)}
 if(tab==='tkt'){var u={};TKT.forEach(function(k){u[k[4]]=1});bar+=sel('kd',t.allK,[['p',t.kind.p],['c',t.kind.c]],kv)+sel('cc',t.allC,ccOpts(Object.keys(u)),tab==='tkt'&&$('cc')&&$('kd')?cv:'')}
 bar+='<span class="cnt" id="cnt"></span>';$('bar').innerHTML=bar;

function draw(){var t=T[L],q=$('q').value.trim(),ql=q.toLowerCase(),rows=[],cols=t.cols[tab],h='';
 function m(arr){return !ql||arr.join(' ').toLowerCase().indexOf(ql)>=0}
 function sortS(){if(ql)rows.sort(function(x,y){return x.s-y.s});rows=rows.map(function(x){return x.h})}
 if(tab==='apt'){if(!window.APT){$('tbl').innerHTML='<tr><td>'+t.nodata+'</td></tr>';$('cnt').textContent='';$('more').innerHTML='';return}
  var cc=$('cc').value,sz=$('sz').value;
  window.APT.forEach(function(a){if(cc&&a[4]!==cc)return;if(sz&&a[5]!==sz)return;var nm=(L==='ja'&&a[6])?a[6]:(L==='ko'&&a[7])?a[7]:a[2];if(!m([a[0],a[1],a[2],a[3],a[6],a[7],cname(a[4])]))return;
   rows.push({s:(a[0].toLowerCase()===ql?0:a[1].toLowerCase()===ql?1:(a[6]===q||a[7]===q)?1:a[5]==='L'?2:3),h:'<tr><td class="c">'+hi(a[0],q)+'</td><td class="c">'+hi(a[1],q)+'</td><td>'+hi(nm,q)+(nm!==a[2]?'<div class="s">'+hi(a[2],q)+'</div>':'')+'</td><td>'+hi(a[3],q)+'</td><td>'+esc(cname(a[4]))+'</td><td><span class="badge">'+t.size[a[5]]+'</span></td></tr>'})});sortS()}
 else if(tab==='city'){CITY.forEach(function(c){var nm=tx(c[3]),ap=c[1].map(function(x){return [x,aptN(x)]});if(!m([c[0],c[1].join(' '),nm,c[3][2],cname(c[2])].concat(ap.map(function(x){return x[1]}))))return;
  rows.push({s:c[0].toLowerCase()===ql?0:1,h:'<tr><td class="c">'+hi(c[0],q)+'</td><td>'+ap.map(function(x){return '<div><span class="c">'+hi(x[0],q)+'</span>'+(x[1]?' <span class="s">'+hi(x[1],q)+'</span>':'')+'</div>'}).join('')+'</td><td>'+hi(nm,q)+(c[4]?'<div class="s">'+esc(tx(c[4]))+'</div>':'')+'</td><td>'+esc(cname(c[2]))+'</td></tr>'})});sortS()}
 else if(tab==='al'){AL.forEach(function(a){if(!m(a.concat([cname(a[3])])))return;var nm=alName(a);rows.push({s:(a[0].toLowerCase()===ql?0:a[1].toLowerCase()===ql?1:2),h:'<tr><td class="c">'+hi(a[0],q)+'</td><td class="c">'+hi(a[1],q)+'</td><td>'+hi(nm,q)+(nm!==a[2]?'<div class="s">'+hi(a[2],q)+'</div>':'')+'</td><td>'+esc(cname(a[3]))+'</td></tr>'})});sortS()}
 else if(tab==='pfx'){var rg=$('rg').value;PFX.forEach(function(p){var r=p[0].charAt(0);if(rg&&r!==rg)return;var cn=cnames(p[1]),nt=tx(p[2]);if(!m([p[0],cn,nt,tx(PRG[r])].concat(p[1].map(function(c){return (window.CTRY[c]||[c])[0]}))))return;

 else if(tab==='reg'){REG.forEach(function(p){var cn=cnames(p[1]),nt=tx(p[2]);if(!m([p[0],cn,nt].concat(p[1].map(function(c){return (window.CTRY[c]||[c])[0]}))))return;
  var ex=p[0].split('・').some(function(x){return x.toLowerCase()===ql});rows.push({s:ex?0:ql&&p[0].toLowerCase().indexOf(ql)===0?1:2,h:'<tr><td class="c">'+hi(p[0],q)+'</td><td>'+hi(cn,q)+'</td><td class="s">'+hi(nt,q)+'</td></tr>'})});sortS()}
 else {var kd=$('kd').value,cc2=$('cc').value;TKT.forEach(function(k){if(kd==='p'&&k[5])return;if(kd==='c'&&!k[5])return;if(cc2&&k[4]!==cc2)return;var a=tktAl(k),nm=a?alName(a):k[3];if(!m([k[0],k[1],k[2],k[3],nm,cname(k[4])]))return;
