*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP','Noto Sans KR',sans-serif;line-height:1.6}
body.ko{font-family:'Noto Sans KR','Noto Sans JP',sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:24px 18px 60px}
header{background:linear-gradient(160deg,#6db8f2,#2F8FE0);color:#fff;border-radius:22px;padding:26px 24px;position:relative}

header p{margin:0;opacity:.95}
.lang{position:absolute;top:16px;right:16px;border:0;background:#fff;color:var(--sky);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}
.bar input{flex:1 1 260px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--card);color:var(--ink)}
.bar select{padding:9px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--card);color:var(--ink)}
.cnt{color:var(--sub);font-size:14px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:720px}
th{background:var(--sky);color:#fff;text-align:center;padding:10px;font-size:14px;position:sticky;top:0}
td{border-top:1px solid var(--line);padding:9px 10px;vertical-align:top;font-size:15px}
td.lb{font-weight:700}
td.df{font-size:13.5px;color:var(--sub);min-width:220px}td.df .ct{display:block;margin-top:4px;font-size:11px;color:var(--sky)}
tr:nth-child(even) td{background:var(--card)}
.refs a{display:inline-block;margin:2px 4px 2px 0;font-size:12px;padding:2px 8px;border-radius:999px;background:#e7f1fc;color:#1d5fa0;text-decoration:none}
.refs a.s2{background:#e3f4e9;color:#1f7a45}
mark{background:var(--hl);color:inherit}
footer{margin-top:30px;color:var(--sub);font-size:13px;text-align:center}
.refs a.s3{background:#fdecd9;color:#9a5310}.refs a.s4{background:#ece9fd;color:#4b3fb0}.refs a.s5{background:#dff1ec;color:#12675a}.refs a.s6{background:#fbeede;color:#8a4b12}.refs a.s7{background:#eef0f3;color:#3d4a5a}.refs a.s8{background:#fbe6f0;color:#a1305f}.refs a.s9{background:#e1f3f3;color:#1f6f6f}.langs{position:absolute;top:16px;right:16px;display:inline-flex;border-radius:999px;overflow:hidden;background:#fff}.langs button{border:0;background:transparent;color:#1d5fa0;font:700 13px inherit;font-family:inherit;padding:6px 12px;min-width:44px;min-height:34px;cursor:pointer}.langs button+button{border-left:1px solid #d6e6f6}.langs button.on{background:#FFE08A;color:#3A2A00}
html[lang="en"] body{font-family:"Noto Sans","Noto Sans JP",system-ui,sans-serif}
</style>
