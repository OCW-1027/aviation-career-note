 '<tr><td>'+t.zone+'</td><td class="n">A '+a.zs[0]+' / B '+a.zs[1]+' / C '+a.zs[2]+'</td></tr>'+
 '<tr><td>'+t.cpt+'</td><td class="n">'+a.cpt.map(function(c){return c.id+': '+f(c.max)}).join(' / ')+'</td></tr>'+
 '<tr><td>'+t.range+'</td><td class="n">ZFW '+a.izfw.join('–')+' / TOW '+a.itow.join('–')+'</td></tr></table></div>'}
function inp(id,lab,v){return '<label>'+lab+'<input type="number" min="0" step="1" data-k="'+id+'" value="'+v+'"></label>'}
function render(){var t=T[L],a=AC[cur];document.documentElement.lang=L;document.title=t.t;
 ['ttl','lead','back','disc'].forEach(function(id){document.getElementById(id).textContent=t[{ttl:'t',lead:'lead',back:'back',disc:'disc'}[id]]});
 document.getElementById('back').href='00_シリーズ全体_地上職旅客運送入門.html?lang='+L;
 document.getElementById('langs').innerHTML=['ja','ko','en'].map(function(l){return '<button data-l="'+l+'" class="'+(l===L?'on':'')+'">'+{ja:'日本語',ko:'한국어',en:'English'}[l]+'</button>'}).join(' ');
 document.getElementById('tabs').innerHTML=[1,2,3].map(function(i){return '<button data-t="'+i+'" class="'+(tab==i?'on':'')+'">'+t['tab'+i]+'</button>'}).join('');
 document.getElementById('aclab').textContent=t.ac;
 document.getElementById('acsel').innerHTML=['S','M','L'].map(function(c){return '<optgroup label="'+t.cat[c]+'">'+AC.map(function(x,i){return x.cat!==c?'':'<option value="'+i+'"'+(i===cur?' selected':'')+'>'+x.id+' ('+x.ver+')</option>'}).join('')+'</optgroup>'}).join('');
 document.getElementById('app').innerHTML=tab==1?calcHTML():tab==2?quizHTML():listHTML();bind();if(tab==1)update()}
function calcHTML(){var t=T[L],a=AC[cur];return '<div class="grid"><div><div class="card"><h2>'+t.pax+'</h2>'+inp('ad',t.ad,S.ad)+inp('ch',t.ch,S.ch)+inp('inf',t.inf,S.inf)+
 '<h2 style="margin-top:12px">'+t.zone+'</h2>'+[0,1,2].map(function(i){return inp('z'+i,'ABC'[i]+' ('+a.zs[i]+t.seats+')',S.z[i])}).join('')+'</div>'+
 '<div class="card" style="margin-top:14px"><h2>'+t.cpt+'</h2>'+a.cpt.map(function(c,j){return inp('c'+j,c.id+' ('+t.max+' '+f(c.max)+')',S.c[j])}).join('')+'<h2 style="margin-top:12px">'+t.fuel+'</h2>'+inp('tof',t.tof,S.tof)+inp('trip',t.trip,S.trip)+
 '<p><button class="btn sub" id="breset">'+t.reset+'</button></p></div></div>'+
 '<div><div class="card"><h2>'+t.res+'</h2><table id="out"></table><p class="note" id="warn"></p></div><div style="margin-top:14px">'+specHTML(a)+'</div></div></div>'}
function update(){var t=T[L],a=AC[cur];document.querySelectorAll('#app input[data-k]').forEach(function(e){var k=e.dataset.k,v=Math.max(0,+e.value||0);if(k[0]==='z'&&k.length===2)S.z[+k[1]]=v;else if(k[0]==='c'&&k.length===2)S.c[+k[1]]=v;else S[k]=v});
 var r=calc(a,S),lim=[t.lz,t.lt,t.ll][r.lim];
 document.getElementById('out').innerHTML=row(t.paxw,f(r.pw))+row(t.ttl,f(r.tl))+row(t.zfw+' ('+t.max+' '+f(a.mzfw)+')',f(r.zfw),r.zfw<=a.mzfw)+row(t.tow+' ('+t.max+' '+f(a.mtow)+')',f(r.tow),r.tow<=a.mtow)+row(t.law+' ('+t.max+' '+f(a.mlw)+')',f(r.law),r.law<=a.mlw)+
  row(t.allow,f(r.al))+row(t.lim,lim)+row(t.under,f(r.ul),r.ul>=0)+row(t.izfw+' ('+a.izfw.join('–')+')',r.iz.toFixed(1),r.iz>=a.izfw[0]&&r.iz<=a.izfw[1])+row(t.itow+' ('+a.itow.join('–')+')',r.it.toFixed(1),r.it>=a.itow[0]&&r.it<=a.itow[1]);
 var w=[];if(a.cpt.some(function(c,j){return S.c[j]>c.max}))w.push(t.cptng);if(sum(S.z)!==S.ad+S.ch)w.push(t.zonechk);if(S.z.some(function(z,i){return z>a.zs[i]}))w.push(t.zoneover);
 document.getElementById('warn').innerHTML=w.map(function(x){return '<span class="ng">'+x+'</span>'}).join('<br>')}
function rnd(a,b,st){st=st||1;return Math.round((a+Math.random()*(b-a))/st)*st}
function newQ(){if(RND){cur=Math.floor(Math.random()*AC.length);def()}var a=AC[cur],seats=sum(a.zs),n=rnd(seats*0.5,seats*0.95),ch=rnd(0,n*0.04),inf=rnd(0,n*0.02),z=a.zs.map(function(s){return Math.round(n*s/seats)});z[2]=n-z[0]-z[1];
 var tof=rnd(a.d[5]*0.75,a.d[5]*1.2,100),trip=Math.round(tof*rnd(0.72,0.85,0.01)/100)*100;
 var s={ad:n-ch,ch:ch,inf:inf,z:z,c:a.cpt.map(function(c){return rnd(c.max*0.15,c.max*0.75,10)}),tof:tof,trip:trip};Q={a:cur,s:s,r:calc(a,s)}}
function quizHTML(){if(!Q||Q.a!==cur)newQ();var t=T[L],s=Q.s,a=AC[Q.a];return '<div class="grid"><div class="card"><h2>'+t.qlead+'<span class="badge">'+a.id+'</span></h2><table>'+
 '<tr><td>'+t.pax+'</td><td class="n">'+t.ad+' '+s.ad+' / '+t.ch+' '+s.ch+' / '+t.inf+' '+s.inf+'</td></tr>'+
 '<tr><td>'+t.cpt+'</td><td class="n">'+a.cpt.map(function(c,j){return c.id+'/'+s.c[j]}).join(' ')+'</td></tr>'+
 '<tr><td>'+t.tof+'</td><td class="n">'+f(s.tof)+'</td></tr><tr><td>'+t.trip+'</td><td class="n">'+f(s.trip)+'</td></tr></table>'+
 '<div class="q" style="margin-top:10px">'+['zfw','tow','law','under'].map(function(k){return '<label>'+t[k]+'<input type="number" id="q_'+k+'"></label>'}).join('')+
 '<p><button class="btn" id="bchk">'+t.chk+'</button><button class="btn sub" id="bans">'+t.ans+'</button><button class="btn sub" id="bnew">'+t.q+'</button></p>'+
 '<label style="justify-content:flex-start"><input type="checkbox" id="rndac"'+(RND?' checked':'')+'> '+t.rndac+'</label><div class="res" id="qres"></div></div>'+specHTML(a)+'</div>'}
function listHTML(){var t=T[L];return '<div class="card" style="overflow-x:auto"><table class="list"><tr><th>'+t.name+'</th><th></th><th>'+t.ver+'</th><th class="n">DOW</th><th class="n">'+t.lz+'</th><th class="n">'+t.lt+'</th><th class="n">'+t.ll+'</th><th class="n">'+t.pl+'</th><th>'+t.cpt+'</th></tr>'+
 AC.map(function(a,i){return '<tr class="'+(i===cur?'cur':'')+'"><td><a href="#" data-i="'+i+'">'+a.id+'</a></td><td>'+t.cat[a.cat]+'</td><td>'+a.ver+'</td><td class="n">'+f(a.dow)+'</td><td class="n">'+f(a.mzfw)+'</td><td class="n">'+f(a.mtow)+'</td><td class="n">'+f(a.mlw)+'</td><td class="n">'+f(a.mzfw-a.dow)+'</td><td>'+a.cpt.map(function(c){return c.id}).join('·')+'</td></tr>'}).join('')+'</table></div>'}
function check(show){var t=T[L],r=Q.r,m={zfw:r.zfw,tow:r.tow,law:r.law,under:r.ul},h='';
 for(var k in m){var e=document.getElementById('q_'+k),v=+e.value;if(show)e.value=Math.round(m[k]);var ok=show||(e.value!==''&&Math.abs(v-m[k])<1);h+='<div>'+t[k]+': '+(ok?'<span class="ok">'+(show?f(m[k]):t.right)+'</span>':'<span class="ng">'+t.wrong+'</span>')+'</div>'}
 if(show)h+='<div class="note">'+t.lim+': '+[t.lz,t.lt,t.ll][r.lim]+'</div>';document.getElementById('qres').innerHTML=h}
function bind(){document.querySelectorAll('#langs button').forEach(function(b){b.onclick=function(){L=b.dataset.l;try{localStorage.setItem('art-lang',L)}catch(e){}render()}});
 document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){tab=+b.dataset.t;render()}});
 document.getElementById('acsel').onchange=function(){cur=+this.value;def();Q=null;render()};
 document.querySelectorAll('#app input[data-k]').forEach(function(e){e.oninput=update});
 var rs=document.getElementById('breset');if(rs)rs.onclick=function(){def();render()};
 document.querySelectorAll('.list a[data-i]').forEach(function(x){x.onclick=function(ev){ev.preventDefault();cur=+x.dataset.i;def();Q=null;tab=1;render()}});
 var c=document.getElementById('bchk');if(c){c.onclick=function(){check(false)};document.getElementById('bans').onclick=function(){check(true)};document.getElementById('bnew').onclick=function(){newQ();render()};document.getElementById('rndac').onchange=function(){RND=this.checked}}}
def();render();
