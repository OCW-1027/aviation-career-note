 exp:[["重心（CG）とは","機体の重さがつり合う一点。前すぎると機首が上がりにくく、後ろすぎると安定が悪くなる。メーカーが重さごとに前と後ろの限界を決めている。"],["%MAC","重心の位置を、主翼の平均の幅（MAC：平均空力翼弦）の前の端から何%の位置かで表す。例：25%MAC。"],["指数（インデックス）","重さ×（基準からの距離）を扱いやすい数にしたもの。足し算で重心の計算ができる。DOI（機体）に、お客様・貨物・燃料の指数を足していく。"],["DOI・DLI・LIZFW・LITOW","DOI＝乾燥運航時の指数、DLI＝DOIに貨物（デッドロード）を足したもの、LIZFW＝さらにお客様を足した無燃料時の指数、LITOW＝燃料を足した離陸時の指数。"],["バランスチャート","縦が重量、横が指数。重心の許される範囲（エンベロープ）の中に、ZFW・TOW・LAWの点が入っているかを見る。"],["燃料で重心が動く","燃料タンクの位置によって、燃料を積むと重心が前後に動く。離陸と着陸で重心が違うのはこのため。"],["貨物の場所で調整","重心が前すぎ・後ろすぎのときは、貨物・手荷物を別の貨物室に移す、座席を移すなどで調整する。"],["LMC","ロードシートを渡した後の小さな変更。決められた範囲内なら、ロードシートに書き足して機長に伝える。範囲を超えたら作り直す。"]],
 expnote:"この練習の重心の限界・係数・トリムは説明のための架空の値です。"},

 exp:[["무게중심(CG)이란","기체 무게가 균형을 이루는 한 점. 너무 앞이면 기수가 잘 안 들리고, 너무 뒤면 안정이 나빠진다. 제작사가 무게별로 앞뒤 한계를 정한다."],["%MAC","무게중심 위치를 주익의 평균 폭(MAC: 평균 공력 시위) 앞끝에서 몇 % 위치인지로 나타낸다. 예: 25%MAC."],["지수(인덱스)","무게×(기준에서의 거리)를 다루기 쉬운 수로 만든 것. 덧셈으로 무게중심을 계산할 수 있다. DOI(기체)에 승객·화물·연료 지수를 더해 간다."],["DOI·DLI·LIZFW·LITOW","DOI=건조 운항 시 지수, DLI=DOI에 화물(데드로드)을 더한 것, LIZFW=승객까지 더한 무연료 시 지수, LITOW=연료를 더한 이륙 시 지수."],["밸런스 차트","세로가 중량, 가로가 지수. 무게중심 허용 범위(엔벨로프) 안에 ZFW·TOW·LAW 점이 들어가는지 본다."],["연료로 무게중심이 움직인다","연료 탱크 위치에 따라 연료를 실으면 무게중심이 앞뒤로 움직인다. 이륙과 착륙의 무게중심이 다른 이유."],["화물 위치로 조정","무게중심이 너무 앞·뒤이면 화물·수하물을 다른 화물칸으로 옮기거나 좌석을 옮겨 조정한다."],["LMC","로드시트를 건넨 뒤의 작은 변경. 정해진 범위 안이면 로드시트에 덧붙여 기장에게 알린다. 넘으면 다시 만든다."]],

en:{t:"Load Control Practice: Weight, Balance and the Loadsheet",lead:"Choose one of 20 fictional aircraft, enter passengers, hold loads and fuel, and practise not only weights and underload but also centre of gravity (%MAC), the balance chart, the loadsheet and last-minute changes (LMC). Use it alongside 3-7 “Reading a loadsheet” and 3-8 “Reading the LIR” (ZA-174 matches the 3-7 example).",back:"← Series contents",tab1:"Calculator",tab2:"Practice questions",tab3:"Aircraft list",tab4:"How balance works",ac:"Aircraft (fictional): ",cat:{S:"Small",M:"Medium",L:"Large"},spec:"Aircraft data",ver:"Cabin version",crew:"Crew (flight deck/cabin)",pax:"Passengers",ad:"Adults",ch:"Children",inf:"Infants (no seat)",zone:"Seating by zone (adults + children)",cpt:"Holds (kg)",fuel:"Fuel (kg)",tof:"Take-off fuel",trip:"Trip fuel",res:"Weights",paxw:"Passenger weight",ttl:"Total traffic load",zfw:"Zero fuel weight (ZFW)",tow:"Take-off weight (TOW)",law:"Landing weight (LAW)",allow:"Allowed take-off weight",under:"Underload",lim:"Limited by",max:"Max",ok:"Within limits",ng:"Out of limits",lz:"Max zero fuel weight",lt:"Max take-off weight",ll:"Max landing weight",cptng:"A hold limit is exceeded",zonechk:"Zone totals do not match adults + children",zoneover:"A zone has more passengers than seats",seats:" seats",q:"New question",rndac:"Random aircraft too",chk:"Check",ans:"Show answer",qlead:"Read the conditions and calculate the five figures (CG to one decimal place; ±0.3 counts as correct).",right:"Correct",wrong:"Try again",reset:"Reset to defaults",disc:"* A simplified model for training. Aircraft names, data, standard weights (adult 75 kg, child 35 kg), index factors, CG limits and trim values are all fictional, unrelated to any real aircraft or airline, and must not be used for real operations. Real load control follows each airline’s rules and approved systems and documents.",dow:"Dry operating weight (DOW)",doi:"Dry operating index (DOI)",name:"Aircraft",total:"Total seats",pl:"Max payload (max ZFW − DOW)",
 steps:["Aircraft and crew","Passengers","Holds","Fuel","Calculate and check","Loadsheet","LMC"],bal:"Balance",dli:"DLI (DOI + cargo)",lizfw:"LIZFW (index at ZFW)",litow:"LITOW (index at take-off)",lilaw:"LILAW (index at landing)",maczfw:"MACZFW",mactow:"MACTOW",maclaw:"MACLAW",stab:"Stabiliser trim (fictional)",lims:"Limits",chart:"Balance chart (index and weight)",chartnote:"Blue outline = take-off and landing CG limits; green outline = zero fuel CG limits (all fictional). ● marks ZFW, TOW and LAW; ◇ marks values after LMC.",mac:"MAC length",lsbtn:"Create loadsheet",lshead:"Loadsheet (practice sample)",flt:"Flight",route:"Route (from to)",lsnote:"A practice sample based on the commonly used industry layout; real formats vary by airline and system.",lmc:"LMC (changes after the loadsheet is issued)",lmclead:"When passengers, baggage or cargo change after the loadsheet has been handed over, decide whether an LMC is enough or a new loadsheet is needed.",dad:"Change in adults",dch:"Change in children",dzone:"Zone",dcpt:"Hold",dkg:"Change in weight (kg)",lmcchk:"Check",tolw:"Weight tolerance (example: 0.5% of max landing weight)",tolc:"CG tolerance (example: %MAC change under 0.5)",lmcok:"LMC is enough (enter it on the loadsheet and tell the captain)",lmcng:"Issue a new loadsheet",dw:"Weight change",dmac:"Change in MACTOW",lmcul:"Underload after change",lmcenv:"CG after change",needls:"Press “Create loadsheet” first.",lmctol:"* Tolerances are set by each airline for each type; these are practice examples.",
 exp:[["What CG is","The point where the aircraft’s weight balances. Too far forward and the nose is hard to raise; too far aft and stability suffers. The manufacturer sets forward and aft limits for each weight."],["%MAC","CG position expressed as a percentage of the mean aerodynamic chord (MAC) from its leading edge, e.g. 25% MAC."],["Index","Weight × distance from a reference, scaled to a handy number so that balance can be worked out by addition: start from the DOI and add passenger, cargo and fuel indices."],["DOI, DLI, LIZFW, LITOW","DOI = dry operating index; DLI = DOI plus deadload (cargo); LIZFW = plus passengers, the index at ZFW; LITOW = plus fuel, the index at take-off."],["Balance chart","Weight on the vertical axis, index on the horizontal. Check that the ZFW, TOW and LAW points sit inside the CG envelope."],["Fuel moves the CG","Depending on where the tanks are, fuel moves the CG forward or aft, which is why take-off and landing CG differ."],["Adjusting with load position","If the CG is too far forward or aft, move cargo or baggage to another hold or re-seat passengers."],["LMC","A small change after the loadsheet has been handed over. Within the set limits it is added to the loadsheet and passed to the captain; beyond them a new loadsheet is issued."]],
