<!DOCTYPE html>
    <html lang="ja">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>AIRLINE SAGA ― ゲームを選ぶ</title>
    <meta name="description" content="AIRLINE SAGA：空港の現場を体験する「AIRPORT OPERATIONS」と、航空会社を経営する「AIRLINE MANAGEMENT」。日本語・韓国語・英語。">
    <script src="assets/shell.js" data-page="sagahome"></script>
    <style>
    :root{--ink:#14223b;--sub:#5a6b86;--line:#d9e2ef;--card:#fff;--bg:#f5f8fc;--acc:#1f6fe5;--acc2:#0e9f8e}
    body{background:var(--bg);color:var(--ink);font-family:'Noto Sans JP','Noto Sans KR',system-ui,sans-serif;margin:0}
    .sel{max-width:1160px;margin:0 auto;padding:8px 16px 32px;box-sizing:border-box}
    .sel h1{font-size:26px;letter-spacing:.06em;margin:6px 0 2px}.sel .sub{color:var(--sub);margin:0 0 16px;font-size:15px}
    .langs{display:flex;gap:6px;justify-content:flex-end;margin:4px 0 6px}.langs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}.langs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
    .cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    @media (max-width:720px){.cards{grid-template-columns:1fr}}
    .card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 6px 22px rgba(20,34,59,.08);transition:transform .18s ease,box-shadow .18s ease}
    .card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 12px 30px rgba(20,34,59,.14)}
    .card .ph{position:relative;overflow:hidden;aspect-ratio:16/9;background:#dfe7f3}
    .card .ph:after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px}.card.f .ph:after{background:var(--acc)}.card.m .ph:after{background:var(--acc2)}
    .card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}.card:hover img{transform:scale(1.03)}
    @media (prefers-reduced-motion:reduce){.card,.card img{transition:none}.card:hover,.card:hover img{transform:none}}
    .card .tx{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
    .card b{font-size:21px;letter-spacing:.04em}.card span{color:var(--sub);font-size:14px;line-height:1.55}
    .card .go{margin-top:auto;align-self:flex-start;background:var(--acc);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px}
    .card.m .go{background:var(--acc2)}.card .cont{font-size:12.5px;color:var(--acc2)}
    .note{color:var(--sub);font-size:12.5px;margin-top:14px}
    </style>
    </head>
    <body>
    <div class="sel wrap">
    <div class="langs" id="langs" role="group" aria-label="Language"><button type="button" data-l="ja">日本語</button><button type="button" data-l="ko">한국어</button><button type="button" data-l="en">English</button></div>
    <h1 id="h"></h1><p class="sub" id="sub"></p>
    <div class="cards">
    <a class="card f" href="AIRLINE_SAGA.html"><div class="ph"><img src="saga/select/banner_field.webp" alt="" width="1120" height="630"></div><div class="tx"><b id="f"></b><span id="fd"></span><em class="cont" id="fc" hidden></em><span class="go" id="fgo"></span></div></a>
    <a class="card m" href="AIRLINE_SAGA_MG.html"><div class="ph"><img src="saga/select/banner_mgmt.webp" alt="" width="1120" height="630"></div><div class="tx"><b id="m"></b><span id="md"></span><em class="cont" id="mc" hidden></em><span class="go" id="mgo"></span></div></a>
    </div>
    <p class="note" id="note"></p>
    </div>
    <script>
    (function(){var T={"en": {"chk": "Save needs checking", "cont": "Continue", "f": "AIRPORT OPERATIONS", "fd": "Check-in, boarding gate, load control, ramp, flight dispatch and CIQ — send off a flight on the airport floor", "go": "Start", "h": "AIRLINE SAGA", "m": "AIRLINE MANAGEMENT", "md": "Run the fictional Vela Air — open routes, operate, manage finance and crises for a year (currently Korean only; English in preparation)", "note": "An educational game. Figures are learning assumptions, not real company data or regulations.", "sub": "Choose one of two games"}, "ja": {"chk": "保存データの確認が必要", "cont": "続きから", "f": "AIRPORT OPERATIONS", "fd": "チェックイン・搭乗ゲート・搭載・ランプ・運航管理・CIQ — 空港の現場で1便を送り出す", "go": "はじめる", "h": "AIRLINE SAGA", "m": "AIRLINE MANAGEMENT", "md": "架空の航空会社 Vela Air を経営 — 路線開設・運航・財務・危機対応を1年で（現在は韓国語版のみ・日本語版は準備中）", "note": "教育用ゲームです。数値は学習用の仮定で、実際の会社・規程とは異なります。", "sub": "2つのゲームから選んでください"}, "ko": {"chk": "저장본 확인 필요", "cont": "이어하기", "f": "AIRPORT OPERATIONS", "fd": "체크인·탑승 게이트·탑재·램프·운항관리·CIQ — 공항 현장에서 한 편을 띄우기", "go": "시작하기", "h": "AIRLINE SAGA", "m": "AIRLINE MANAGEMENT", "md": "가상의 항공사 Vela Air 경영 — 노선 개설·운항·재무·위기 대응을 1년 동안", "note": "교육용 게임입니다. 수치는 학습용 가정이며 실제 회사·규정과 다릅니다.", "sub": "두 게임 중 하나를 고르세요"}};
    function lang(){var q=(location.search.match(/[?&]lang=(ja|ko|en)\b/)||[])[1];if(q){try{localStorage.setItem('art-lang',q)}catch(e){}return q}try{var s=localStorage.getItem('art-lang');if(T[s])return s}catch(e){}var n=(navigator.language||'ja').slice(0,2);return T[n]?n:'ja'}
    function has(re){try{for(var i=0;i<localStorage.length;i++){if(re.test(localStorage.key(i)))return true}}catch(e){}return false}
    /* 191차 GPT 권고: 「이어하기」 = 실제 저장본이 있을 때만 — IDB 메타 verified + 그 칸 본문 있음 / localStorage 메타 last + 그 칸 있음. 빈 DB·메타만·칸 없음 = 숨김 · 옮기지 못한 손상 옛 저장본 = 「확인 필요」. DB가 없으면 만들지 않음(열기 전 목록 확인 · 업그레이드 요청 = 중단) */
    function lsSaved(P){try{var p=P+':vela-main:',m=JSON.parse(localStorage.getItem(p+'meta')||'null');return !!(m&&(m.last==='a'||m.last==='b')&&localStorage.getItem(p+m.last))}catch(e){return false}}
    function mgOne(P,N){var ls=lsSaved(P)?'ok':null;if(!window.indexedDB||!indexedDB.databases)return Promise.resolve(ls);
    return indexedDB.databases().then(function(L){if(!L.some(function(d){return d.name===N}))return ls;return new Promise(function(res){var done=function(v){res(v||ls)},q;try{q=indexedDB.open(N)}catch(e){return done(null)}
    q.onupgradeneeded=function(){try{q.transaction.abort()}catch(e){}};q.onerror=q.onblocked=function(){done(null)};
    q.onsuccess=function(){var db=q.result;try{if(!db.objectStoreNames.contains('meta')||!db.objectStoreNames.contains('saves')){db.close();return done(null)}var tx=db.transaction(['meta','saves'],'readonly'),g=tx.objectStore('meta').get('vela-main');
    g.onsuccess=function(){var m=g.result;if(m&&m.verified&&m.verified.slot){var r=tx.objectStore('saves').get('vela-main:'+m.verified.slot);r.onsuccess=function(){db.close();done(typeof r.result==='string'&&r.result.length?'ok':'chk')};r.onerror=function(){db.close();done('chk')}}else{db.close();done(m&&m.corrupt?'chk':null)}};g.onerror=function(){db.close();done(null)}}catch(e){try{db.close()}catch(e2){}done(null)}}})}).catch(function(){return ls})}
    /* 193차 2-7-2: 신판 이름공간(v3)을 먼저 · 없으면 옛 이름공간(읽기만 — 게임이 첫 저장 때 v3에 새로 씀) */
    function mgSaved(){return mgOne('acn-saga-mg-v3','acn-saga-mg-v3').then(function(k){return k||mgOne('acn-saga-mg-v2','acn-saga-mg')})}
    function draw(l){var t=T[l];document.documentElement.lang=l;['h','sub','f','fd','m','md','note'].forEach(function(k){document.getElementById(k).textContent=t[k]});
    document.getElementById('fgo').textContent=t.go;document.getElementById('mgo').textContent=t.go;
    var fc=document.getElementById('fc'),mc=document.getElementById('mc');fc.textContent=mc.textContent=t.cont;
    fc.hidden=!has(/^acn-saga-(hist|save|run)/);mc.hidden=true;mgSaved().then(function(k){if(!k)return;mc.textContent=k==='ok'?t.cont:t.chk;mc.hidden=false});
    [].forEach.call(document.querySelectorAll('.langs button'),function(b){b.classList.toggle('on',b.getAttribute('data-l')===l)})}
    [].forEach.call(document.querySelectorAll('.langs button'),function(b){b.addEventListener('click',function(){var l=b.getAttribute('data-l');try{localStorage.setItem('art-lang',l)}catch(e){}draw(l)})});
    draw(lang())})();
    </script>
    </body>
    </html>
