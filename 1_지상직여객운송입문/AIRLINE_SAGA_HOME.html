<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIRLINE SAGA ― 空港の仕事を体験するゲーム</title>
<meta name="description" content="AIRLINE SAGA のホーム：架空の航空会社 Vela Air のグランドスタッフとして、チェックインカウンターの5日間を体験する教育用ゲーム。日本語・韓国語・英語。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<script src="assets/shell.js" data-page="sagahome"></script>
<style>
/* AIRLINE SAGA ゲームホーム（23차）。サイトの頭・フッター（acn_shell.js）と同じ白い画面。ゲームの記録（acn-saga-hist-v2）を読んで日ごとの状態を出す */
:root{
  --bg:#f6f7f8; --paper:#ffffff; --ink:#182431; --sub:#5b6676; --line:#dfe4e8;
  --navy:#24346b; --amber:#f0a030; --amber-ink:#8a5200;
  --ok:#1f7a4f; --okbg:#e6f4ec; --lock:#6f7888; --lockbg:#eef0f4; --soon:#9a6b12; --soonbg:#f7efdc;
  --board:#0f1830; --board-line:#26335a; --board-txt:#ffd26a; --board-dim:#8f9bc0;
  --shadow:0 10px 30px rgba(27,36,64,.10);
}
body{margin:0}
.sg *{box-sizing:border-box}
.sg [hidden]{display:none!important}
.sg{color:var(--ink);font-family:Inter,"Noto Sans JP","Noto Sans KR",system-ui,sans-serif;line-height:1.65}
html:lang(ko) .sg{font-family:Inter,"Noto Sans KR","Noto Sans JP",system-ui,sans-serif;word-break:keep-all}
.sg a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:6px 10px}
.langs.sgl{display:none}

/* ヒーロー */
.hero{position:relative;border-radius:22px;overflow:hidden;background:#cfe3f2;box-shadow:var(--shadow);aspect-ratio:16/8;min-height:300px;max-width:100%}
.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(16,24,48,.86) 0%,rgba(16,24,48,.62) 38%,rgba(16,24,48,0) 66%)}
.hero .cast{position:absolute;bottom:0;height:88%;max-width:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.25))}
.hero .copy{position:absolute;left:0;top:0;bottom:0;width:min(540px,46%);padding:clamp(18px,4vw,44px);display:flex;flex-direction:column;justify-content:center;color:#fff}
.eyebrow{font:700 12px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--amber-ink)}
.hero .eyebrow{color:#ffcf73}
.hero h1{white-space:nowrap;font:900 clamp(30px,4.2vw,56px)/1 Inter,sans-serif;letter-spacing:-.02em;margin:10px 0 12px;color:#fff}
.hero h1 span{color:#ffcf73}
.hero .tag{color:#fff;font-weight:800;font-size:clamp(17px,2.3vw,24px);line-height:1.35;margin:0 0 10px;text-wrap:balance}
.hero p.lead{margin:0 0 18px;font-size:clamp(13px,1.5vw,15.5px);color:#dfe5f7;max-width:44ch}
.ctas{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:11px 18px;font-weight:800;font-size:15px;text-decoration:none;border:2px solid transparent;cursor:pointer}
.btn.pri{background:var(--amber);color:#2a1a00}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:rgba(255,255,255,.6);color:#fff;background:rgba(255,255,255,.10)}
.pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.pillrow span{font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 10px}

/* 見出し */
.sg section{padding-block:clamp(26px,5vw,44px)}
.sgh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sgh h2{font-size:clamp(22px,3vw,30px);line-height:1.25;margin:6px 0 0;text-wrap:balance}
.sgh p{margin:0;color:var(--sub);max-width:62ch}

/* 勤務地 */
.stn{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.stn button{border:0;background:none;color:var(--sub);font:700 13px Inter,"Noto Sans JP","Noto Sans KR",sans-serif;padding:7px 14px;cursor:pointer;min-height:36px}
.stn button.on{background:var(--navy);color:#fff}
.stnrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.stnrow small{color:var(--sub);font-size:13px}

/* 5日のカード */
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.day{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 14px 16px;text-decoration:none;min-width:0;transition:transform .15s,box-shadow .15s}
a.day:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#9bbbf0}
a.day:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
.day .n{font:800 12px "JetBrains Mono",monospace;letter-spacing:.08em;color:var(--sub)}
.day b{font-size:17px;line-height:1.3}
.day .lr{font-size:13px;color:var(--sub);flex:1}
.chip{align-self:flex-start;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;line-height:1.5}
.chip.open{background:var(--okbg);color:var(--ok)}
.chip.lock{background:var(--lockbg);color:var(--lock)}
.chip.rank{background:var(--navy);color:#fff}
.day .go{font-size:13px;font-weight:800;color:#1769e0}
.day.locked{background:#fbfbfc}
.day .stripe{position:absolute;left:14px;right:14px;top:0;height:4px;border-radius:0 0 4px 4px;background:var(--amber)}
.day.locked .stripe{background:var(--line)}
.note{font-size:13px;color:var(--sub);margin:12px 0 0}

/* 進め方 */
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.step{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center}
.step img{width:72px;height:72px;object-fit:contain}
.step small{font:800 12px "JetBrains Mono",monospace;color:var(--amber-ink)}
.step h3{margin:2px 0 4px;font-size:16px}
.step p{margin:0;font-size:13.5px;color:var(--sub)}

/* 出発案内板（全18ステージ） */
.board{background:var(--board);border-radius:18px;padding:14px clamp(10px,2vw,20px) 18px;color:var(--board-txt);box-shadow:var(--shadow);overflow-x:auto}
.board .bh{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 13px "JetBrains Mono",monospace;color:var(--board-dim);padding:4px 4px 10px;border-bottom:1px solid var(--board-line);flex-wrap:wrap}
.board .bh b{color:#fff;letter-spacing:.12em}
.board table{width:100%;border-collapse:collapse;font-family:"JetBrains Mono",monospace;font-size:13.5px;min-width:560px}
.board th{font-size:11px;letter-spacing:.14em;color:var(--board-dim);text-align:left;padding:10px 8px 6px;font-weight:700}
.board td{color:var(--board-txt);padding:8px;border-bottom:1px dashed var(--board-line);vertical-align:middle;word-break:normal}
.board td.nm{font-family:Inter,"Noto Sans JP","Noto Sans KR",sans-serif;font-weight:700;color:#f3f5ff}
.board tr.play td{background:rgba(240,160,48,.12)}
.st{display:inline-block;font-weight:700;font-size:11.5px;letter-spacing:.06em;padding:2px 8px;border-radius:4px;white-space:nowrap}
.st.go{background:#1f7a4f;color:#eafff3}
.st.calc{background:#3b2f0b;color:#ffd26a;border:1px solid #6b5418}
.st.soon{color:var(--board-dim);border:1px solid var(--board-line)}
.board a{color:inherit}

/* 講座とのつながり */
.lessons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.les{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;min-width:0}
.les:hover{border-color:#9bbbf0}
.les code{font:700 12px "JetBrains Mono",monospace;color:var(--navy);background:var(--bg);border-radius:6px;padding:2px 6px;white-space:nowrap;flex:none}
.les span{font-size:14px;min-width:0}
.les em{display:block;font-style:normal;font-size:12px;color:var(--sub)}

/* 案内役 */
.twins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mas{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 18px}
.mas img{width:110px;height:150px;object-fit:contain}
.mas h3{margin:0 0 4px;font-size:20px}
.mas .role{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.mas.y .role{color:#946c00}.mas.g .role{color:#1f7a5c}
.mas p{margin:0;font-size:14px;color:var(--sub)}
.fine{color:var(--sub);font-size:12.5px;margin:6px 0 0}

@media (max-width:900px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}.how{grid-template-columns:minmax(0,1fr)}.lessons,.twins{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .hero{aspect-ratio:auto;min-height:0;display:flex;flex-direction:column}
  .hero .bg{position:absolute;height:100%}
  .hero .shade{background:linear-gradient(180deg,rgba(16,24,48,.15) 0%,rgba(16,24,48,.55) 38%,rgba(16,24,48,.92) 62%)}
  .hero .castbox{position:relative;height:clamp(220px,40vw,330px)}
  .hero .cast{height:100%}
  .hero .copy{position:relative;width:100%;padding:4px clamp(18px,4vw,36px) 24px}
  .hero h1{font-size:clamp(34px,8vw,56px)}
}
@media (max-width:640px){
  .wrap{padding-inline:16px}
  .days{grid-template-columns:minmax(0,1fr)}
  .day{flex-direction:row;flex-wrap:wrap;align-items:center;column-gap:10px}
  .day .lr{flex-basis:100%}
  .board table{min-width:0}
  .board th:nth-child(3),.board td:nth-child(3){display:none}
  .mas{grid-template-columns:80px minmax(0,1fr);padding:12px 14px}.mas img{width:80px;height:110px}
}
@media (prefers-reduced-motion:reduce){a.day{transition:none}}
</style>
</head>

      try { var old = JSON.parse(localStorage.getItem('acn-saga-v1') || '{}'); ['JP', 'KR'].forEach(function (c) { var b = old.best && old.best['pax.ci.01.' + c]; if (b) st.days['ci.d1.' + c] = { plays: 0, best: 0, bestRank: null, bestSafeRank: null, bestClear: null, safeEver: false, miss: {}, legacyBest: b, legacySafety: 'unknown' }; }); } catch (e) {}
    }
    /* 최고 성적 회차가 없는 예전 집계: 최근 시도(최대 20회) 중 등급·점수가 모두 같은 회차가 있을 때만 그 회차로 복원. 없으면 legacy로 둠 */
    Object.keys(st.days || {}).forEach(function (k) {
      var r = st.days[k], m = /^ci\.d(\d)\.(JP|KR)(\.practice)?$/.exec(k);
      if (!r || r.top || !r.plays || !m) return;
      var a = (st.attempts || []).filter(function (x) { return x.day === +m[1] && x.workplace === m[2] && (x.mode === 'practice') === !!m[3] && x.rank === r.bestRank && x.score === r.best; })[0];
      if (a) { r.top = { rank: a.rank, tot: a.score, safe: !!a.safetyPassed, ops: a.opsPassed !== false, hints: !!a.hintsUsed, complete: a.complete !== false, at: (a.completedAt || '').slice(0, 10) }; r.topFrom = 'attempt'; }
    });
    /* 이전 schemaVersion 2 기록의 오답에 이유·행동·심각도가 없으면 unknown으로 읽음(지우지 않음) */
    (st.attempts || []).forEach(function (a) { (a.mistakes || []).forEach(function (m) { if (!m.reasonKey) m.reasonKey = 'unknown'; if (!m.action) m.action = 'unknown'; if (!m.severity) m.severity = 'unknown'; }); });
    /* 예전 기록에 같은 승객·같은 코드의 critical과 self-corrected가 함께 있으면 critical 우선으로 읽음(원본은 그대로 두고 표시만) */
    (st.attempts || []).forEach(function (a) { var crit = {}; (a.mistakes || []).forEach(function (m) { if (m.severity === 'critical') crit[(m.paxId || '') + '|' + m.caseCode] = true; }); (a.mistakes || []).forEach(function (m) { if (m.severity === 'self-corrected' && crit[(m.paxId || '') + '|' + m.caseCode]) m.readAs = 'superseded-by-critical'; }); });
    return st;
  }
/* src/game.js */
  function legacyText(a) { return tx(L('以前の集計 ', '이전 집계 ', 'Earlier totals ')) + tx(L('最高ランク ', '최고 등급 ', 'best rank ')) + (a.bestRank || '—') + ' / ' + tx(L('最高点 ', '최고 점수 ', 'best score ')) + a.best; }
  function bestText(r) {
    if (!r) return '';
    if (!r.top) return r.plays ? legacyText(r) : '';
    var t = r.top, s = t.rank + ' · ' + t.tot + (t.safe ? ' · ✔' : '') + (t.hints ? ' · ' + tx(L('ヒント', '힌트', 'tips')) : '') + (t.complete === false ? ' · ' + tx(L('未完了', '미완료', 'unfinished')) : '');
    var a = r.legacyAgg;
    if (a && (RANKV0[a.bestRank] || 0) * 1000 + a.best > (RANKV0[t.rank] || 0) * 1000 + t.tot) s += ' (' + legacyText(a) + ')';
    return s;
  }
  var RANKV0 = { S: 4, A: 3, B: 2, C: 1 };

function hist(){try{return loadStore().days||{}}catch(e){return {}}}
/* ゲームと同じ規則（src/days.js の cleared・status）：前の日を同じ勤務地で B 以上・安全合格・全員処理（bestClear）で終えると開く。練習モードは全部開く */
var RV={S:4,A:3,B:2,C:1};
function cleared(H,n,C){var r=H['ci.d'+n+'.'+C];return !!(r&&r.bestClear&&RV[r.bestClear]>=RV.B)}
function status(H,n,C,pr){if(n===1||pr)return 'open';return cleared(H,n-1,C)?'open':'lock'}
/* 最高成績（ゲームの bestText と同じ順）：同じ回の等級・点数、✔＝安全合格。回の分からない以前の記録は「以前の記録」 */
function render(){
  document.documentElement.lang=lang;
  $('tag').textContent=tx(T.tag);$('lead').textContent=tx(T.lead);
  $('pills').innerHTML=T.pills.map(function(p){return '<span>'+E(tx(p))+'</span>'}).join('');
  ['hDays','pDays','nDays','stnNote','hHow','hBoard','pBoard','thName','thCourse','hLes','pLes','hTw','r1','n1','d1','r2','n2','d2','foot'].forEach(function(k){$(k).textContent=tx(T[k])});
  Array.prototype.forEach.call(document.querySelectorAll('#langs button'),function(b){b.classList.toggle('on',b.getAttribute('data-l')===lang)});
  var G=cfg(),H=hist(),C=G.country==='KR'?'KR':'JP',PR=!!G.practice,next=null;
  $('stn').innerHTML=[['JP',T.stn[0]],['KR',T.stn[1]]].map(function(x){return '<button type="button" data-c="'+x[0]+'" class="'+(x[0]===C?'on':'')+'" aria-pressed="'+(x[0]===C)+'">'+E(tx(x[1]))+'</button>'}).join('');
  /* 24차 추가：ゲームのタイトル画面と同じ「本番｜練習」。どちらなのかを常に見せる */
  $('mode').innerHTML=[false,true].map(function(v,i){return '<button type="button" data-p="'+(v?1:0)+'" class="'+(v===PR?'on':'')+'" aria-pressed="'+(v===PR)+'">'+E(tx(T.mode[i]))+'</button>'}).join('');
  $('modeNote').textContent=tx(T.modeNote[PR?1:0]);
  $('days').innerHTML=DAYS.map(function(d){
    var st=status(H,d.n,C,PR),r=H['ci.d'+d.n+'.'+C];
    if(st==='open'&&!cleared(H,d.n,C)&&!next)next=d.n;
    /* ゲームのタイトル画面の DAY ボタンと同じ文字（src/game.js renderTitle）：最高成績・以前の記録・ヒント・未完了 */
    var lab=r?L('最高 ','최고 ','Best '):T.st.open,best=r&&st==='open'?(r.plays?bestText(r):(r.legacyBest?tx(L('以前の記録 ','이전 기록 ','Earlier '))+r.legacyBest:'')):'';
    if(r&&!r.plays&&st==='open')lab=L('勤務できます · ','근무 가능 · ','Open · ');
    if(r&&r.plays&&!r.top&&st==='open')lab=L('','','');
    if(PR&&r&&st==='open'&&(r.plays||r.legacyBest))lab={ja:'本番 '+lab.ja,ko:'실전 '+lab.ko,en:'Shift '+lab.en};   /* 24차b：練習モードでも表示は本番の記録 */
    var txt=tx(lab)+best;
    var chip=st==='lock'?'<span class="chip lock">'+E(tx(T.st.lock))+'</span>':r&&(best||r.plays)?'<span class="chip rank">'+E(txt)+'</span>':'<span class="chip open">'+E(txt)+'</span>';
    var inner='<span class="stripe"></span><span class="n">DAY '+d.n+'</span><b>'+E(tx(d.nm))+'</b><span class="lr">'+E(tx(d.learn))+'</span>'+chip+(st==='open'?'<span class="go">'+E(tx(T.st.go))+'</span>':'');
    return st==='open'?'<a class="day" href="'+GAME+'#day'+d.n+'">'+inner+'</a>':'<div class="day locked" aria-disabled="true">'+inner+'</div>';
  }).join('');
  $('play').textContent=tx(T.play)+' →';$('play').href=GAME+'#day1';
  if(next&&next>1){$('cont').hidden=false;$('cont').textContent=tx(T.cont)+' · DAY '+next;$('cont').href=GAME+'#day'+next}else $('cont').hidden=true;
  $('how').innerHTML=T.how.map(function(h,i){return '<div class="step"><img src="saga/img/'+h[2]+'.webp" alt=""><div><small>STEP 0'+(i+1)+'</small><h3>'+E(tx(h[0]))+'</h3><p>'+E(tx(h[1]))+'</p></div></div>'}).join('');
  $('stages').innerHTML=STAGES.map(function(s){var p=s.st==='play';var stt=p?'<span class="st go">'+T.sGo+'</span>':s.key?'<span class="st calc">'+T.sCalc+'</span>':'<span class="st soon">'+T.sSoon+'</span>';
    return '<tr class="'+(p?'play':'')+'"><td>'+s.n+'</td><td class="nm">'+(p?'<a href="'+GAME+'">'+E(tx(s.nm))+'</a>':E(tx(s.nm)))+'</td><td>'+E(tx(s.course))+'</td><td>'+stt+'</td></tr>'}).join('');
  $('les').innerHTML=Object.keys(LDAYS).map(function(id){var t=LESSONS[id],u=LLINK.links[id];if(!t||!u)return '';var no=id.split('/')[1];
    return '<a class="les" href="'+LLINK.base+u[lang]+'"><code>'+(id.indexOf('ciq/')===0?'CIQ ':'')+no+'</code><span>'+E(tx(t))+'<em>DAY '+LDAYS[id].join(' · ')+'</em></span></a>'}).join('');
  Array.prototype.forEach.call($('mode').querySelectorAll('button'),function(b){b.onclick=function(){var g=cfg();g.practice=b.getAttribute('data-p')==='1';try{localStorage.setItem('acn-saga-v1',JSON.stringify(g))}catch(e){}render()}});
  Array.prototype.forEach.call($('stn').querySelectorAll('button'),function(b){b.onclick=function(){var g=cfg();g.country=b.getAttribute('data-c');try{localStorage.setItem('acn-saga-v1',JSON.stringify(g))}catch(e){}render()}});
}
$('langs').onclick=function(e){var b=e.target.closest('button[data-l]');if(!b)return;lang=b.getAttribute('data-l');try{localStorage.setItem('art-lang',lang)}catch(er){}render()};
function tick(){var t;try{t=new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'})+' NRT'}catch(e){t=''}$('clock').textContent=t}
tick();setInterval(tick,30000);
/* ゲームで遊んでから「戻る」で来たとき、記録を読み直す */
window.addEventListener('pageshow',function(e){if(e.persisted)render()});
render();
})();
</script>
