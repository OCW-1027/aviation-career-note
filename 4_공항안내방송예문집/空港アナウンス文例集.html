<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>空港アナウンス文例集 ― 日本語・韓国語・英語</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Gowun+Dodum&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#2F8FE0;--sky2:#E7F1FC;--ink:#1d2a3a;--sub:#5b6b7d;--line:#e3ebf3;--bg:#fff;--card:#f7fbff;--hl:#FFE08A;--warn:#E5534B}
@media (prefers-color-scheme:dark){:root{--ink:#e8eef5;--sub:#a9b6c4;--line:#2a3a4c;--bg:#0f1720;--card:#16212d;--sky2:#17324d}}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP','Noto Sans KR',sans-serif;line-height:1.75}
body.ko{font-family:'Noto Sans KR','Noto Sans JP',sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:24px 18px 60px}
header{background:linear-gradient(160deg,#6db8f2,#2F8FE0);color:#fff;border-radius:22px;padding:28px 24px;position:relative;overflow:hidden}
header h1{font-family:'Zen Maru Gothic','Gowun Dodum',sans-serif;font-size:clamp(22px,4vw,32px);margin:6px 0}
header p{margin:0;max-width:62ch;opacity:.95}
.wave{position:absolute;right:18px;bottom:14px;display:flex;gap:4px;align-items:flex-end;opacity:.55}
.wave i{display:block;width:5px;border-radius:3px;background:#fff}
.langs{position:absolute;top:16px;right:16px;z-index:2;display:inline-flex;border-radius:999px;overflow:hidden;background:#fff}.langs button{border:0;background:transparent;color:#1d5fa0;font:700 13px inherit;font-family:inherit;padding:6px 12px;min-width:44px;min-height:34px;cursor:pointer}.langs button+button{border-left:1px solid #d6e6f6}.langs button.on{background:#FFE08A;color:#3A2A00}
html[lang="en"] body{font-family:"Noto Sans","Noto Sans JP",system-ui,sans-serif}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:18px -18px 0;padding:10px 18px;display:flex;gap:8px;overflow-x:auto}
nav a{flex:0 0 auto;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px}
nav a:focus-visible,button:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 4px}
.tools input[type=search]{flex:1 1 240px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--card);color:var(--ink)}
.tools label{font-size:14px;color:var(--sub);display:flex;gap:6px;align-items:center;white-space:nowrap}
h2{font-family:'Zen Maru Gothic','Gowun Dodum',sans-serif;font-size:22px;margin:36px 0 4px;padding-bottom:6px;border-bottom:3px solid var(--sky)}
.cdesc{color:var(--sub);margin:6px 0 14px;max-width:70ch}
.guide{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.guide .r{display:grid;grid-template-columns:180px 1fr;border-top:1px solid var(--line)}
.guide .r:first-child{border-top:0}
.guide .r b{background:var(--sky2);padding:10px 12px;text-align:center;display:flex;align-items:center;justify-content:center}
.guide .r span{padding:10px 14px}
.ann{border:1px solid var(--line);border-radius:18px;margin:14px 0;background:var(--bg)}
.ann .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:12px 16px;background:var(--card);border-radius:18px 18px 0 0;border-bottom:1px solid var(--line)}
.ann .top b{font-size:17px}
.ann .when{font-size:13px;color:var(--sub);white-space:nowrap}
.ann .no{color:var(--sky);font-weight:700;margin-right:6px}
.txt{display:grid;grid-template-columns:64px 1fr auto;gap:0 10px;padding:10px 16px;border-top:1px dashed var(--line);align-items:start}
.txt:first-of-type{border-top:0}
.tag{font-size:12px;font-weight:700;text-align:center;border-radius:8px;padding:3px 0;margin-top:3px;background:var(--sky2);color:#1d5fa0}
.txt p{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.txt p.rd{margin-top:4px;font-size:13px;line-height:1.6;color:var(--sub);border-left:3px solid var(--sky2);padding-left:8px}
.ann .top{flex-wrap:wrap}.ann .when{white-space:normal;min-width:0}.tools{flex-wrap:wrap}.tools input[type=search]{min-width:0;flex:1 1 200px}
.ph{background:var(--hl);color:#5a4500;border-radius:4px;padding:0 3px}
.cp{border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:8px;font:inherit;font-size:12px;padding:3px 8px;cursor:pointer}
.cp.done{color:#1f7a45;border-color:#1f7a45}
.note{margin:0;padding:10px 16px 14px;font-size:14px;color:var(--sub);border-top:1px solid var(--line)}
.note b{color:var(--ink)}
.hidden{display:none}
footer{margin-top:40px;color:var(--sub);font-size:13px;text-align:center}
@media (max-width:640px){.guide .r{grid-template-columns:1fr}.txt{grid-template-columns:52px 1fr}.txt .cp{grid-column:2;justify-self:start;margin-top:6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><span class="langs" id="lang" role="group" aria-label="Language"></span><div id="kick"></div><h1 id="ttl"></h1><p id="lead"></p>

<nav id="nav" aria-label="chapters"></nav>
<div class="tools"><input id="q" type="search"><label><input type="checkbox" id="en" checked><span id="enl"></span></label><label><input type="checkbox" id="rd" checked><span id="rdl"></span></label></div>
<main id="main"></main>
<footer id="foot"></footer>
</div>

var DATA=[
{id:"c1",ja:"放送の基本",ko:"방송의 기본",dja:"放送の順番、話す速さ、数字や便名の読み方など、どの場面にも共通する基本です。",dko:"방송 순서, 말하는 속도, 숫자와 편명 읽는 법 등 모든 장면에 공통인 기본입니다.",guide:{
ja:[["放送の順番","日本の空港では、日本語→英語→その他の言語（韓国語など）の順が一般的。航空会社・空港の決まりに従う"],["話す速さ","ふだんの会話よりゆっくり。1分間に日本語で300字程度が目安。文と文の間に一呼吸"],["便名の読み方","航空会社名＋数字を1桁ずつ（例：【航空会社】【1】【2】【3】便）。英語は flight one two three"],["時刻","日本語は「午後3時15分」、英語は「3:15 p.m.」、韓国語は「오후 3시 15분」。24時間表記は使わないのが聞き取りやすい"],["ゲート番号","「【12】番搭乗口」「Gate 【12】」「【12】번 탑승구」。数字ははっきり、2回言う場面もある"],["はじめと終わり","「ご案内いたします」で始め、「〜までお越しください」など行動で終える。最後に同じ内容を短く繰り返すと伝わりやすい"],["イレギュラー時","謝罪を先に、事実（理由・見通し）、お客様にしてほしいこと、次の案内の時刻の順。定型の宣伝文句は入れない"],["声","明るく、落ち着いた一定の調子。マイクから口までの距離を一定に"]],
ko:[["방송 순서","일본 공항에서는 일본어→영어→기타 언어(한국어 등) 순이 일반적. 항공사·공항 규칙을 따름"],["말하는 속도","평소 대화보다 천천히. 문장과 문장 사이에 한 호흡"],["편명 읽는 법","항공사명+숫자 한 자리씩 (예: 【항공사】 【1】【2】【3】편). 영어는 flight one two three"],["시각","일본어 「午後3時15分」, 영어 「3:15 p.m.」, 한국어 「오후 3시 15분」. 24시간 표기는 쓰지 않는 편이 알아듣기 쉬움"],["게이트 번호","「【12】番搭乗口」「Gate 【12】」「【12】번 탑승구」. 숫자는 또렷하게, 두 번 말하는 장면도 있음"],["시작과 끝","“안내 말씀 드리겠습니다”로 시작해 “~로 와 주시기 바랍니다” 등 행동으로 끝냄. 마지막에 같은 내용을 짧게 반복하면 잘 전달됨"],["비정상 시","사과를 먼저, 사실(이유·전망), 승객에게 부탁할 것, 다음 안내 시각 순. 정형화된 홍보 문구는 넣지 않음"],["목소리","밝고 차분한 일정한 톤. 마이크와 입 사이 거리를 일정하게"]]}},
{id:"c2",ja:"チェックインカウンター",ko:"체크인 카운터",dja:"手続きの開始から締め切りまで、カウンター周辺での案内です。",dko:"수속 시작부터 마감까지 카운터 주변 안내입니다.",items:[
{s:["搭乗手続きの開始","탑승수속 개시"],w:["出発の約3時間前","출발 약 3시간 전"],ja:"ご案内いたします。【航空会社】【便名】便、【行き先】行きをご利用のお客様、ただいまより【カウンター】カウンターにて搭乗手続きを開始いたします。パスポートと航空券をご用意のうえ、お越しください。",ko:"안내 말씀 드리겠습니다. 【항공사】 【편명】편 【행선지】행을 이용하시는 손님께서는 지금부터 【카운터】 카운터에서 탑승수속을 시작하겠습니다. 여권과 항공권을 준비하시어 와 주시기 바랍니다.",en:"Ladies and gentlemen, check-in for 【Airline】 flight 【No.】 to 【Destination】 is now open at counter 【Counter】. Please have your passport and ticket ready.",n:["カウンターの場所は2回繰り返すと親切","카운터 위치는 두 번 반복하면 친절"]},
{s:["手続き中の案内","수속 중 안내"],w:["締め切りの約30分前","마감 약 30분 전"],ja:"【航空会社】【便名】便、【行き先】行きの搭乗手続きは、【時刻】に締め切らせていただきます。まだお手続きがお済みでないお客様は、お早めに【カウンター】カウンターへお越しください。",ko:"【항공사】 【편명】편 【행선지】행 탑승수속은 【시각】에 마감하겠습니다. 아직 수속을 마치지 않으신 손님께서는 서둘러 【카운터】 카운터로 와 주시기 바랍니다.",en:"Check-in for 【Airline】 flight 【No.】 to 【Destination】 will close at 【Time】. If you have not yet checked in, please proceed to counter 【Counter】 as soon as possible.",n:null},
{s:["締め切り直前の呼びかけ","마감 직전 안내"],w:["締め切りの約10分前","마감 약 10분 전"],ja:"【航空会社】【便名】便、【行き先】行きの搭乗手続きは、まもなく締め切りとなります。お手続きがお済みでないお客様は、至急【カウンター】カウンターへお越しください。",ko:"【항공사】 【편명】편 【행선지】행 탑승수속이 곧 마감됩니다. 아직 수속을 마치지 않으신 손님께서는 지금 바로 【카운터】 카운터로 와 주시기 바랍니다.",en:"This is the final call for check-in for 【Airline】 flight 【No.】 to 【Destination】. Passengers who have not yet checked in, please come to counter 【Counter】 immediately.",n:["「至急」は締め切り直前だけに使う","“지금 바로”는 마감 직전에만 사용"]},
{s:["手続きの締め切り","수속 마감"],w:["締め切りの時刻","마감 시각"],ja:"【航空会社】【便名】便、【行き先】行きの搭乗手続きは締め切りました。これからお越しのお客様は、【カウンター】カウンターの係員にお申し出ください。",ko:"【항공사】 【편명】편 【행선지】행 탑승수속은 마감되었습니다. 지금 오신 손님께서는 【카운터】 카운터 직원에게 말씀해 주시기 바랍니다.",en:"Check-in for 【Airline】 flight 【No.】 to 【Destination】 is now closed. If you have just arrived, please speak to our staff at counter 【Counter】.",n:["締め切り後の扱いは会社の規定に従う（搭乗できるとは言わない）","마감 후 처리는 회사 규정에 따름 (탑승 가능하다고 말하지 않음)"]},
{s:["モバイルバッテリー・危険物","보조배터리·위험물"],w:["手続き中、列に向けて","수속 중, 대기 줄을 향해"],ja:"お客様にお願いいたします。モバイルバッテリーや予備の電池は、お預けのお荷物に入れることができません。お手荷物としてお持ちください。機内への持ち込みは、【2】個までとなっております。",ko:"손님 여러분께 부탁 말씀 드립니다. 보조배터리와 예비 배터리는 부치는 짐에 넣으실 수 없습니다. 휴대 수하물로 가지고 타 주시기 바랍니다. 기내 반입은 【2】개까지 가능합니다.",en:"Please note that power banks and spare batteries are not allowed in checked baggage. Please carry them with you. You may bring up to 【2】 power banks on board.",n:["個数・容量の規定は時期と会社で違う。★最新の規定に合わせる","개수·용량 규정은 시기와 회사마다 다름. ★최신 규정에 맞춤"]},
{s:["手荷物の重さの確認","수하물 무게 확인"],w:["列が長いとき","대기 줄이 길 때"],ja:"お並びのお客様にご案内いたします。お預けのお荷物は、お一人様【23】キロまでとなっております。重さを超える場合は追加の料金がかかりますので、あらかじめお荷物の整理をお願いいたします。",ko:"줄 서 계신 손님께 안내 말씀 드립니다. 부치는 짐은 1인당 【23】킬로그램까지입니다. 무게를 초과하면 추가 요금이 발생하므로 미리 짐을 정리해 주시기 바랍니다.",en:"For passengers in line: the checked baggage allowance is 【23】 kg per person. Excess baggage fees apply for overweight bags, so please repack your items in advance if necessary.",n:null},
{s:["オンラインチェックイン済みの方","온라인 체크인 완료 승객"],w:["手続き中","수속 중"],ja:"オンラインでチェックインがお済みで、お預けのお荷物があるお客様は、【カウンター】の専用カウンターへお越しください。お荷物のないお客様は、そのまま保安検査場へお進みください。",ko:"온라인으로 체크인을 마치시고 부치실 짐이 있는 손님께서는 【카운터】 전용 카운터로 와 주시기 바랍니다. 짐이 없는 손님께서는 바로 보안검색장으로 가 주시기 바랍니다.",en:"If you have checked in online and have baggage to drop off, please go to the dedicated counter 【Counter】. If you have no baggage, please proceed directly to security.",n:null}]},
{id:"c3",ja:"搭乗口（ゲート）",ko:"탑승구(게이트)",dja:"搭乗の前から最終案内まで、ゲートでの案内です。",dko:"탑승 전부터 최종 안내까지 게이트 안내입니다.",items:[
{s:["搭乗前の案内","탑승 전 안내"],w:["搭乗開始の約10分前","탑승 시작 약 10분 전"],ja:"【航空会社】【便名】便、【行き先】行きをご利用のお客様にご案内いたします。この便はまもなく、【ゲート】番搭乗口よりご搭乗を開始いたします。パスポートと搭乗券をお手元にご用意ください。",ko:"【항공사】 【편명】편 【행선지】행을 이용하시는 손님께 안내 말씀 드립니다. 이 비행기는 잠시 후 【게이트】번 탑승구에서 탑승을 시작하겠습니다. 여권과 탑승권을 준비해 주시기 바랍니다.",en:"Passengers on 【Airline】 flight 【No.】 to 【Destination】, boarding will begin shortly at gate 【Gate】. Please have your passport and boarding pass ready.",n:null},
{s:["優先搭乗","우선 탑승"],w:["搭乗開始","탑승 시작"],ja:"お待たせいたしました。ただいまより、お手伝いが必要なお客様、小さなお子様連れのお客様、【上級クラス】のお客様から優先してご案内いたします。",ko:"오래 기다리셨습니다. 지금부터 도움이 필요하신 손님, 어린 자녀를 동반하신 손님, 【상위 클래스】 손님부터 먼저 탑승하시겠습니다.",en:"Thank you for waiting. We now invite passengers requiring assistance, families with small children, and 【Class】 passengers to board first.",n:["優先の対象と順番は会社の規定に従う","우선 대상과 순서는 회사 규정에 따름"]},
{s:["座席の番号ごとの搭乗","좌석 번호별 탑승"],w:["優先搭乗の後","우선 탑승 후"],ja:"続きまして、座席番号【40】番から【55】番のお客様、ご搭乗ください。そのほかのお客様は、もうしばらくお待ちください。",ko:"이어서 좌석 번호 【40】번부터 【55】번 손님께서는 탑승해 주시기 바랍니다. 그 밖의 손님께서는 잠시만 기다려 주시기 바랍니다.",en:"We now invite passengers seated in rows 【40】 to 【55】 to board. All other passengers, please wait until your row is called.",n:["後方の座席から案内すると通路の渋滞が減る","뒤쪽 좌석부터 안내하면 통로 정체가 줄어듦"]},
{s:["すべてのお客様の搭乗","전체 탑승"],w:["番号ごとの搭乗の後","좌석별 탑승 후"],ja:"【便名】便、【行き先】行きをご利用のすべてのお客様、ご搭乗ください。",ko:"【편명】편 【행선지】행을 이용하시는 모든 손님께서는 탑승해 주시기 바랍니다.",en:"We now invite all remaining passengers on flight 【No.】 to 【Destination】 to board.",n:null},
{s:["最終搭乗案内","최종 탑승 안내"],w:["出発の約15分前","출발 약 15분 전"],ja:"【航空会社】【便名】便、【行き先】行きは、まもなく出発いたします。まだご搭乗でないお客様は、至急【ゲート】番搭乗口へお越しください。",ko:"【항공사】 【편명】편 【행선지】행은 곧 출발합니다. 아직 탑승하지 않으신 손님께서는 지금 바로 【게이트】번 탑승구로 와 주시기 바랍니다.",en:"This is the final boarding call for 【Airline】 flight 【No.】 to 【Destination】. Passengers who have not yet boarded, please proceed to gate 【Gate】 immediately.",n:null},
{s:["搭乗口の変更","탑승구 변경"],w:["変更が決まったとき","변경이 정해졌을 때"],ja:"【航空会社】【便名】便、【行き先】行きをご利用のお客様にご案内いたします。この便の搭乗口は、【旧ゲート】番から【新ゲート】番に変更となりました。【新ゲート】番搭乗口へお越しください。",ko:"【항공사】 【편명】편 【행선지】행을 이용하시는 손님께 안내 말씀 드립니다. 이 비행기의 탑승구가 【기존 게이트】번에서 【새 게이트】번으로 변경되었습니다. 【새 게이트】번 탑승구로 와 주시기 바랍니다.",en:"Attention passengers on 【Airline】 flight 【No.】 to 【Destination】: your departure gate has changed from gate 【Old】 to gate 【New】. Please proceed to gate 【New】.",n:["新しい番号を最後にもう一度言う","새 번호를 마지막에 한 번 더 말함"]},
{s:["機内持ち込み手荷物の制限","기내 수하물 제한"],w:["搭乗前・混雑する便","탑승 전·만석 편"],ja:"本日の便は満席のため、機内の収納棚が大変混み合います。大きなお手荷物をお持ちのお客様は、搭乗口にてお預かりいたしますので、係員にお申し出ください。貴重品とモバイルバッテリーは必ずお手元にお持ちください。",ko:"오늘 이 비행기는 만석이어서 기내 선반이 매우 혼잡합니다. 큰 짐을 가지신 손님께서는 탑승구에서 맡아 드리오니 직원에게 말씀해 주시기 바랍니다. 귀중품과 보조배터리는 반드시 몸에 지니시기 바랍니다.",en:"Today's flight is full and overhead bin space is limited. If you have a large bag, we can check it at the gate; please speak to our staff. Please keep valuables and power banks with you.",n:null},
{s:["搭乗開始の遅れ","탑승 개시 지연"],w:["予定の搭乗時刻を過ぎたとき","예정 탑승 시각이 지났을 때"],ja:"【便名】便、【行き先】行きをご利用のお客様にご案内いたします。機内の準備に時間がかかっているため、ご搭乗の開始が遅れております。準備が整いしだい、あらためてご案内いたします。お急ぎのところ申し訳ございません。",ko:"【편명】편 【행선지】행을 이용하시는 손님께 안내 말씀 드립니다. 기내 준비에 시간이 걸려 탑승 개시가 늦어지고 있습니다. 준비가 되는 대로 다시 안내해 드리겠습니다. 바쁘신 중에 죄송합니다.",en:"Passengers on flight 【No.】 to 【Destination】: boarding is delayed while we complete preparations on board. We will make another announcement as soon as we are ready. We apologize for the inconvenience.",n:null}]},
{id:"c4",ja:"お客様の呼び出し",ko:"승객 호출",dja:"特定のお客様をお呼びする案内です。個人情報に配慮し、必要以上の情報は言いません。",dko:"특정 승객을 부르는 안내입니다. 개인정보를 배려해 필요 이상의 정보는 말하지 않습니다.",items:[
{s:["カウンターへの呼び出し","카운터로 호출"],w:["手続き後に確認が必要なとき","수속 후 확인이 필요할 때"],ja:"【便名】便、【行き先】行きをご利用の【氏名】様。お伝えしたいことがございますので、【カウンター】カウンターまでお越しください。",ko:"【편명】편 【행선지】행을 이용하시는 【성명】님. 전해 드릴 말씀이 있으니 【카운터】 카운터로 와 주시기 바랍니다.",en:"Paging passenger 【Name】 on flight 【No.】 to 【Destination】. Please come to counter 【Counter】.",n:["理由は放送で言わない","이유는 방송으로 말하지 않음"]},
{s:["搭乗口への呼び出し","탑승구로 호출"],w:["最終案内の後","최종 안내 후"],ja:"【便名】便、【行き先】行きにご搭乗予定の【氏名】様。お客様のご搭乗をお待ちしております。至急【ゲート】番搭乗口へお越しください。",ko:"【편명】편 【행선지】행에 탑승 예정이신 【성명】님. 손님의 탑승을 기다리고 있습니다. 지금 바로 【게이트】번 탑승구로 와 주시기 바랍니다.",en:"Final call for passenger 【Name】 on flight 【No.】 to 【Destination】. Your flight is waiting. Please proceed to gate 【Gate】 immediately.",n:["締め切りの時刻を過ぎたら、手荷物を降ろす準備と並行する","마감 시각이 지나면 수하물 하기 준비와 병행"]},
{s:["お預けのお荷物の確認","부친 짐 확인"],w:["開披検査が必要なとき","개방 검사가 필요할 때"],ja:"【便名】便、【行き先】行きをご利用の【氏名】様。お預かりしたお荷物について確認させていただきたいことがございます。【場所】までお越しください。",ko:"【편명】편 【행선지】행을 이용하시는 【성명】님. 맡기신 짐에 대해 확인할 사항이 있습니다. 【장소】로 와 주시기 바랍니다.",en:"Passenger 【Name】 on flight 【No.】 to 【Destination】, we need to check your checked baggage with you. Please come to 【Location】.",n:["中身の品名（電池など）は放送で言わない","내용물 품명(배터리 등)은 방송으로 말하지 않음"]},
{s:["お連れ様のお呼び出し","동행자 호출"],w:["お連れ様とはぐれたとき","동행자와 헤어졌을 때"],ja:"【地名】からお越しの【氏名】様。お連れ様が【場所】でお待ちです。【場所】までお越しください。",ko:"【지명】에서 오신 【성명】님. 일행분께서 【장소】에서 기다리고 계십니다. 【장소】로 와 주시기 바랍니다.",en:"Paging 【Name】 from 【Place】. Your party is waiting for you at 【Location】. Please come to 【Location】.",n:["小さな子どもの迷子の場合は、子どもの名前を放送しない方法を空港の決まりで確認","어린이 미아의 경우 아이 이름을 방송하지 않는 방법을 공항 규칙으로 확인"]},
{s:["お忘れ物","분실물"],w:["落とし物を見つけたとき","분실물을 발견했을 때"],ja:"【便名】便でご到着のお客様にご案内いたします。機内に【品名】のお忘れ物がございました。お心当たりのお客様は、【場所】までお越しください。",ko:"【편명】편으로 도착하신 손님께 안내 말씀 드립니다. 기내에 【품명】 분실물이 있었습니다. 짐작 가시는 손님께서는 【장소】로 와 주시기 바랍니다.",en:"Passengers arriving on flight 【No.】: a 【item】 was left on board. If this belongs to you, please come to 【Location】.",n:["特徴を言いすぎない（本人確認のため）","특징을 너무 자세히 말하지 않음 (본인 확인을 위해)"]}]},
{id:"c5",ja:"遅延",ko:"지연",dja:"遅延のお知らせは、謝罪、理由、見通し、お願い、次の案内の時刻の順に。変化がなくても決まった間隔で案内します。",dko:"지연 안내는 사과, 이유, 전망, 부탁, 다음 안내 시각 순으로. 변화가 없어도 정해진 간격으로 안내합니다.",items:[
{s:["天候による遅延","기상으로 인한 지연"],w:["遅延が決まったとき","지연이 결정됐을 때"],ja:"【航空会社】【便名】便、【行き先】行きをご利用のお客様にお知らせいたします。【行き先】の天候不良のため、この便の出発は【時刻】に変更となりました。ご迷惑をおかけし申し訳ございません。次のご案内は【時刻】にいたします。",ko:"【항공사】 【편명】편 【행선지】행을 이용하시는 손님께 알려 드립니다. 【행선지】 기상 악화로 이 비행기의 출발이 【시각】으로 변경되었습니다. 불편을 드려 죄송합니다. 다음 안내는 【시각】에 드리겠습니다.",en:"Passengers on 【Airline】 flight 【No.】 to 【Destination】: due to poor weather at 【Destination】, the departure time has been changed to 【Time】. We apologize for the inconvenience. Our next update will be at 【Time】.",n:null},
{s:["整備による遅延","정비로 인한 지연"],w:["遅延が決まったとき","지연이 결정됐을 때"],ja:"【便名】便、【行き先】行きをご利用のお客様にお知らせいたします。機体の点検に時間がかかっているため、出発が遅れております。安全を最優先に作業を進めております。新しい出発時刻が決まりしだい、お知らせいたします。",ko:"【편명】편 【행선지】행을 이용하시는 손님께 알려 드립니다. 기체 점검에 시간이 걸려 출발이 늦어지고 있습니다. 안전을 최우선으로 작업하고 있습니다. 새 출발 시각이 정해지는 대로 알려 드리겠습니다.",en:"Passengers on flight 【No.】 to 【Destination】: departure is delayed due to an aircraft inspection. Safety is our first priority. We will announce the new departure time as soon as it is confirmed.",n:["整備の詳しい内容は言わない","정비 세부 내용은 말하지 않음"]},
{s:["到着便の遅れによる遅延","도착편 지연으로 인한 지연"],w:["遅延が決まったとき","지연이 결정됐을 때"],ja:"【便名】便、【行き先】行きをご利用のお客様にお知らせいたします。この便に使用する飛行機の到着が遅れているため、出発は【時刻】ごろになる見込みです。ご迷惑をおかけし申し訳ございません。",ko:"【편명】편 【행선지】행을 이용하시는 손님께 알려 드립니다. 이 비행기에 사용할 항공기의 도착이 늦어져 출발은 【시각】경이 될 전망입니다. 불편을 드려 죄송합니다.",en:"Passengers on flight 【No.】 to 【Destination】: the arrival of the aircraft for this flight has been delayed, and we expect to depart at around 【Time】. We apologize for the inconvenience.",n:null},
{s:["続けての案内（変化がないとき）","계속 안내 (변화가 없을 때)"],w:["決まった間隔ごと","정해진 간격마다"],ja:"【便名】便、【行き先】行きをご利用のお客様に、引き続きご案内いたします。出発時刻は、現在も確認中です。お待たせして申し訳ございません。次のご案内は【時刻】にいたします。",ko:"【편명】편 【행선지】행을 이용하시는 손님께 계속해서 안내 말씀 드립니다. 출발 시각은 현재도 확인 중입니다. 기다리시게 해서 죄송합니다. 다음 안내는 【시각】에 드리겠습니다.",en:"Passengers on flight 【No.】 to 【Destination】, this is an update. We are still confirming the departure time. We apologize for the wait. Our next update will be at 【Time】.",n:["変化がなくても次の案内の時刻を守る（例：20分ごと）","변화가 없어도 다음 안내 시각을 지킴 (예: 20분마다)"]},
{s:["新しい出発時刻の決定","새 출발 시각 확정"],w:["時刻が決まったとき","시각이 정해졌을 때"],ja:"【便名】便、【行き先】行きをご利用のお客様にお知らせいたします。この便の新しい出発時刻は【時刻】、ご搭乗の開始は【時刻】の予定です。搭乗口は【ゲート】番です。",ko:"【편명】편 【행선지】행을 이용하시는 손님께 알려 드립니다. 이 비행기의 새 출발 시각은 【시각】, 탑승 시작은 【시각】 예정입니다. 탑승구는 【게이트】번입니다.",en:"Passengers on flight 【No.】 to 【Destination】: the new departure time is 【Time】, and boarding is expected to begin at 【Time】 at gate 【Gate】.",n:null},
{s:["お食事券のお渡し","식사 쿠폰 배부"],w:["一定以上の遅延","일정 이상 지연"],ja:"【便名】便、【行き先】行きをご利用のお客様にご案内いたします。お待たせしているおわびとして、お食事券をご用意いたしました。【場所】にて、搭乗券をご提示のうえお受け取りください。",ko:"【편명】편 【행선지】행을 이용하시는 손님께 안내 말씀 드립니다. 기다리시게 한 사과의 뜻으로 식사 쿠폰을 준비했습니다. 【장소】에서 탑승권을 보여 주시고 받아 가시기 바랍니다.",en:"Passengers on flight 【No.】 to 【Destination】: as an apology for the delay, we are offering meal vouchers. Please present your boarding pass at 【Location】 to receive one.",n:["使える店・時間・金額の範囲を案内の紙にも書く","쓸 수 있는 매장·시간·금액 범위를 안내지에도 씀"]},
{s:["遅れての搭乗開始","지연 후 탑승 개시"],w:["搭乗開始","탑승 시작"],ja:"大変長らくお待たせいたしました。【便名】便、【行き先】行きは、ただいまより【ゲート】番搭乗口からご搭乗を開始いたします。出発が遅れましたことを、心よりおわび申し上げます。",ko:"오랫동안 기다리시게 해서 대단히 죄송합니다. 【편명】편 【행선지】행은 지금부터 【게이트】번 탑승구에서 탑승을 시작하겠습니다. 출발이 늦어진 점 진심으로 사과드립니다.",en:"Thank you very much for your patience. Flight 【No.】 to 【Destination】 is now boarding at gate 【Gate】. We sincerely apologize for the delay.",n:null}]},
{id:"c6",ja:"欠航・ダイバート",ko:"결항·다이버트",dja:"欠航やダイバートでは、お客様が次に何をすればよいかを具体的に伝えます。",dko:"결항과 다이버트 때는 승객이 다음에 무엇을 하면 되는지를 구체적으로 전달합니다.",items:[
{s:["欠航のお知らせ","결항 안내"],w:["欠航が決まったとき","결항이 결정됐을 때"],ja:"【航空会社】【便名】便、【行き先】行きをご利用のお客様にお知らせいたします。【理由】のため、この便は欠航となりました。ご迷惑をおかけし、誠に申し訳ございません。今後のご案内をいたしますので、【場所】までお越しください。",ko:"【항공사】 【편명】편 【행선지】행을 이용하시는 손님께 알려 드립니다. 【이유】로 이 비행기는 결항되었습니다. 불편을 드려 대단히 죄송합니다. 앞으로의 안내를 해 드리겠으니 【장소】로 와 주시기 바랍니다.",en:"Passengers on 【Airline】 flight 【No.】 to 【Destination】: due to 【reason】, this flight has been cancelled. We sincerely apologize. Please come to 【Location】 for further assistance.",n:null},
{s:["振り替え・宿泊のご案内","대체편·숙박 안내"],w:["欠航の後","결항 후"],ja:"欠航となりました【便名】便をご利用のお客様にご案内いたします。明日【時刻】発の振り替え便をご用意いたしました。今夜のご宿泊と交通については、【場所】にてご案内いたします。払い戻しをご希望のお客様も、係員にお申し出ください。",ko:"결항된 【편명】편을 이용하시는 손님께 안내 말씀 드립니다. 내일 【시각】 출발 대체편을 준비했습니다. 오늘 밤 숙박과 교통은 【장소】에서 안내해 드리겠습니다. 환불을 원하시는 손님께서도 직원에게 말씀해 주시기 바랍니다.",en:"Passengers on cancelled flight 【No.】: we have arranged a replacement flight departing tomorrow at 【Time】. Information on tonight's accommodation and transport is available at 【Location】. If you would like a refund, please speak to our staff.",n:["選択肢（振り替え・他社便・払い戻し）の条件は案内の紙で渡す","선택지(대체편·타사편·환불) 조건은 안내지로 전달"]},
{s:["出国済みのお客様へ","출국한 승객께"],w:["欠航後、出発エリアで","결항 후 출국 구역에서"],ja:"【便名】便をご利用のお客様にお願いいたします。すでに出国手続きがお済みのお客様は、係員がご案内いたしますので、【ゲート】番搭乗口付近でお待ちください。お一人での移動はなさらないようお願いいたします。",ko:"【편명】편을 이용하시는 손님께 부탁 말씀 드립니다. 이미 출국 수속을 마치신 손님께서는 직원이 안내해 드리오니 【게이트】번 탑승구 부근에서 기다려 주시기 바랍니다. 혼자서 이동하지 마시기 바랍니다.",en:"Passengers on flight 【No.】 who have already cleared departure immigration: please wait near gate 【Gate】. Our staff will escort you. Please do not leave the area on your own.",n:["出国取消の手続きへ係員が同行する（シリーズ1の2-6）","출국 취소 절차에 직원이 동행 (시리즈 1의 2-6편)"]},
{s:["ダイバートした便のお出迎えの方へ","다이버트편 마중객께"],w:["到着地のロビーで","도착지 로비에서"],ja:"【航空会社】【便名】便でご到着のお客様をお出迎えの皆様にお知らせいたします。この便は【理由】のため、【代替空港】に着陸いたしました。今後の予定は決まりしだい、お知らせいたします。",ko:"【항공사】 【편명】편으로 도착하시는 손님을 마중 나오신 분들께 알려 드립니다. 이 비행기는 【이유】로 【교체 공항】에 착륙했습니다. 이후 일정은 정해지는 대로 알려 드리겠습니다.",en:"For those meeting passengers on 【Airline】 flight 【No.】: due to 【reason】, this flight has landed at 【Alternate airport】. We will provide further information as soon as it is available.",n:null},
{s:["引き返す可能性がある運航","회항 가능성이 있는 운항"],w:["搭乗前","탑승 전"],ja:"【便名】便、【行き先】行きをご利用のお客様にご案内いたします。【行き先】の天候によっては、着陸できずに当空港へ引き返す、またはほかの空港に着陸する場合がございます。あらかじめご了承のうえ、ご搭乗ください。",ko:"【편명】편 【행선지】행을 이용하시는 손님께 안내 말씀 드립니다. 【행선지】 날씨에 따라 착륙하지 못하고 이 공항으로 돌아오거나 다른 공항에 착륙할 수 있습니다. 미리 양해해 주시고 탑승해 주시기 바랍니다.",en:"Passengers on flight 【No.】 to 【Destination】: depending on the weather at 【Destination】, this flight may return to this airport or land at another airport. Please take this into account before boarding.",n:["条件付き運航の案内は搭乗前に必ず","조건부 운항 안내는 탑승 전에 반드시"]}]},

{s:["手荷物が遅れて出てくるとき","수하물이 늦게 나올 때"],w:["受取所で","수취대에서"],ja:"【便名】便をご利用のお客様にお知らせいたします。お荷物の取り降ろしに時間がかかっており、受取所へのお荷物の到着が遅れております。まもなく出てまいりますので、しばらくお待ちください。",ko:"【편명】편을 이용하신 손님께 알려 드립니다. 짐을 내리는 데 시간이 걸려 수취대 도착이 늦어지고 있습니다. 곧 나오니 잠시만 기다려 주시기 바랍니다.",en:"Passengers on flight 【No.】: baggage delivery is delayed while unloading is completed. Your bags will arrive shortly. Thank you for your patience.",n:null},
{s:["乗り継ぎのお客様","환승 승객"],w:["到着後、機内出口付近","도착 후 기내 출구 부근"],ja:"【行き先】行き【便名】便にお乗り継ぎのお客様は、係員がご案内いたしますので、到着口を出たところでお待ちください。",ko:"【행선지】행 【편명】편으로 환승하시는 손님께서는 직원이 안내해 드리오니 도착구를 나오신 곳에서 기다려 주시기 바랍니다.",en:"Passengers connecting to flight 【No.】 to 【Destination】, please wait just outside the arrival gate. Our staff will assist you.",n:null},
{s:["到着の遅れ（出迎えの方へ）","도착 지연 (마중객께)"],w:["到着ロビーで","도착 로비에서"],ja:"【出発地】発【航空会社】【便名】便の到着は、【時刻】ごろの予定です。お出迎えの皆様にはご迷惑をおかけし申し訳ございません。",ko:"【출발지】발 【항공사】 【편명】편의 도착은 【시각】경 예정입니다. 마중 나오신 분들께 불편을 드려 죄송합니다.",en:"【Airline】 flight 【No.】 from 【Origin】 is now expected to arrive at around 【Time】. We apologize to those meeting passengers.",n:null},
{s:["手荷物が見つからないとき","수하물을 찾지 못했을 때"],w:["受取所の最後","수취대 마지막"],ja:"【便名】便をご利用のお客様で、お荷物がお手元に届いていない方は、受取所の【場所】にある手荷物カウンターまでお越しください。",ko:"【편명】편을 이용하신 손님 중 짐을 받지 못하신 분께서는 수취대 【장소】에 있는 수하물 카운터로 와 주시기 바랍니다.",en:"If your baggage from flight 【No.】 has not arrived, please come to the baggage service counter at 【Location】.",n:["事故の受付の手順（シリーズ1の4-1・4-2）","사고 접수 절차 (시리즈 1의 4-1·4-2편)"]}]},

{s:["保安検査場の混雑","보안검색장 혼잡"],w:["混雑しているとき","혼잡할 때"],ja:"【行き先】行き【便名】便をご利用のお客様にお願いいたします。現在、保安検査場が大変混雑しております。搭乗手続きがお済みのお客様は、お早めに保安検査場へお進みください。",ko:"【행선지】행 【편명】편을 이용하시는 손님께 부탁 말씀 드립니다. 현재 보안검색장이 매우 혼잡합니다. 탑승수속을 마치신 손님께서는 서둘러 보안검색장으로 이동해 주시기 바랍니다.",en:"Passengers on flight 【No.】 to 【Destination】: the security checkpoint is very busy. If you have completed check-in, please proceed to security as soon as possible.",n:null},

{s:["お忘れ物の保管のご案内","분실물 보관 안내"],w:["到着ロビーで","도착 로비에서"],ja:"本日【便名】便でご到着のお客様で、機内にお忘れ物をされた方は、【場所】の【航空会社】カウンター、または空港の遺失物センターにお問い合わせください。",ko:"오늘 【편명】편으로 도착하신 손님 중 기내에 물건을 두고 내리신 분께서는 【장소】 【항공사】 카운터 또는 공항 분실물센터로 문의해 주시기 바랍니다.",en:"If you arrived today on flight 【No.】 and left something on board, please contact the 【Airline】 counter at 【Location】 or the airport lost and found.",n:["保管の期間と引き渡しの手順（シリーズ1の4-4）","보관 기간과 인도 절차 (시리즈 1의 4-4편)"]},

ko:{kick:'항공 커리어 노트',ttl:'공항 안내방송 예문집',lead:'체크인, 탑승, 호출, 지연, 결항, 도착까지 공항에서 쓰는 안내 예문을 일본어·한국어·영어로 나란히 정리했습니다. 【 】 부분을 편명이나 시각으로 바꿔 씁니다. 방송 장소·타이밍·문구·언어 순서는 항공사마다 다르므로 실제로는 반드시 자사 예문집을 쓰세요. 비정상 때는 정확한 정보만 전하고, 정보가 바뀌면 즉시 안내하는 것이 가장 중요합니다.',ph:'예문 검색 (日本語·한국어·English)',en:'영어도 표시',rd:'읽는 법(참고) 표시',cp:'복사',done:'복사됨',when:'시점',note:'포인트',btn:'日本語',foot:'© 항공 커리어 노트 — 예문은 일반적인 예입니다. 실제 방송은 각 항공사·공항 규정을 따르세요.',n:'건'},

var LANGS=['ja','ko','en'],LBL={ja:'日本語',ko:'한국어',en:'English'};function langBar(cb){var g=document.getElementById('lang');g.innerHTML=LANGS.map(function(l){return '<button type="button" data-l="'+l+'" lang="'+l+'" class="'+(l===lang?'on':'')+'" aria-pressed="'+(l===lang)+'">'+LBL[l]+'</button>'}).join('');Array.prototype.forEach.call(g.querySelectorAll('button'),function(b){b.onclick=function(){lang=b.getAttribute('data-l');try{localStorage.setItem('art-lang',lang)}catch(e){}cb()}})}
var lang='ja';try{var _s=localStorage.getItem('art-lang');if(['ja','ko','en'].indexOf(_s)>=0)lang=_s}catch(e){}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ph(s){return esc(s).replace(/【([^】]*)】/g,'<span class="ph">【$1】</span>')}
function $(i){return document.getElementById(i)}
function render(){var t=T[lang],L=lang==='ja'?0:lang==='ko'?1:2,q=$('q').value.trim().toLowerCase(),showEn=$('en').checked;
 document.body.className=lang;document.documentElement.lang=lang;['kick','ttl','lead','foot'].forEach(function(i){$(i).textContent=t[i]});langBar(render);$('q').placeholder=t.ph;$('enl').textContent=t.en;$('rdl').textContent=t.rd;var showRd=$('rd').checked;$('en').parentNode.style.display=lang==='en'?'none':'';
 $('nav').innerHTML=DATA.map(function(c,i){return '<a href="#'+c.id+'">'+(i+1)+'. '+esc(c[lang])+'</a>'}).join('');
 var h='',cnt=0;
 DATA.forEach(function(c,ci){var items=(c.items||[]).filter(function(it){if(!q)return true;return (it.ja+it.ko+it.en+it.s.join('')).toLowerCase().indexOf(q)>=0});
  if(q&&!items.length)return;
  h+='<section id="'+c.id+'"><h2>'+(ci+1)+'. '+esc(c[lang])+'</h2><p class="cdesc">'+esc(lang==='ja'?c.dja:lang==='ko'?c.dko:c.den)+'</p>';
  if(c.guide&&!q){h+='<div class="guide">'+c.guide[lang].map(function(r){return '<div class="r"><b>'+esc(r[0])+'</b><span>'+ph(r[1])+'</span></div>'}).join('')+'</div>'}
  items.forEach(function(it,ii){cnt++;var id=c.id+'-'+ii,RD=((window.ANN_READ||{})[c.id]||[])[ii],first=lang==='ja'?['JP',it.ja]:['KR',it.ko],second=lang==='ja'?['KR',it.ko]:['JP',it.ja];
   function rdOf(tag){if(!showRd||!RD)return '';if(lang==='ja'&&tag==='KR')return RD.kk;if(lang==='ko'&&tag==='JP')return RD.jh;if(lang==='ja'&&tag==='EN')return RD.ek||'';if(lang==='ko'&&tag==='EN')return RD.eh||'';if(lang==='en')return tag==='JP'?RD.jr:tag==='KR'?RD.kr:'';return ''}
   var rows=[first,second];if(showEn)rows.push(['EN',it.en]);if(lang==='en')rows=[['EN',it.en],['JP',it.ja],['KR',it.ko]];
   h+='<article class="ann"><div class="top"><b><span class="no">'+(ci+1)+'-'+(ii+1)+'</span>'+esc(it.s[L])+'</b><span class="when">'+t.when+'：'+esc(it.w[L])+'</span></div>'+
   rows.map(function(r,ri){return '<div class="txt"><span class="tag">'+r[0]+'</span><div><p>'+ph(r[1])+'</p>'+(rdOf(r[0])?'<p class="rd" lang="'+(lang==='ja'?'ja':lang==='ko'?'ko':'en')+'">'+ph(rdOf(r[0]))+'</p>':'')+'</div><button class="cp" data-t="'+esc(r[1])+'" type="button">'+t.cp+'</button></div>'}).join('')+
   (it.n?'<p class="note"><b>'+t.note+'</b>　'+esc(it.n[L])+'</p>':'')+'</article>'});
  h+='</section>'});
 $('main').innerHTML=h;
 Array.prototype.forEach.call(document.querySelectorAll('.cp'),function(b){b.onclick=function(){var s=b.getAttribute('data-t');function ok(){b.textContent=t.done;b.classList.add('done')}
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(ok,function(){});else{var x=document.createElement('textarea');x.value=s;document.body.appendChild(x);x.select();try{document.execCommand('copy');ok()}catch(e){}x.remove()}}});}
$('q').oninput=render;$('en').onchange=render;$('rd').onchange=render;
render();
</script>
