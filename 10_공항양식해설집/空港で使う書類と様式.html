<title>空港で使う書類と様式 ― 解説と見本</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Gowun+Dodum&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#2F8FE0;--sky2:#E7F1FC;--ink:#1d2a3a;--sub:#5b6b7d;--line:#e3ebf3;--bg:#fff;--card:#f7fbff;--hl:#FFE08A;--warn:#E5534B;--ivory:#F7F0DC;--ivory2:#FFFCF3;--iline:#E6DCC3}
@media (prefers-color-scheme:dark){:root{--ink:#e8eef5;--sub:#a9b6c4;--line:#2a3a4c;--bg:#0f1720;--card:#16212d;--sky2:#17324d;--ivory:#2c2819;--ivory2:#1f1c13;--iline:#3e3827}}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP','Noto Sans KR',sans-serif;line-height:1.75}
body.ko{font-family:'Noto Sans KR','Noto Sans JP',sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:24px 18px 60px}
header{background:linear-gradient(160deg,#6db8f2,#2F8FE0);color:#fff;border-radius:22px;padding:28px 24px;position:relative}
header h1{font-family:'Zen Maru Gothic','Gowun Dodum',sans-serif;font-size:clamp(22px,4vw,32px);margin:6px 0}
header p{margin:0;max-width:64ch;opacity:.95}
.langs{position:absolute;top:16px;right:16px;z-index:2;display:inline-flex;border-radius:999px;overflow:hidden;background:#fff}.langs button{border:0;background:transparent;color:#1d5fa0;font:700 13px inherit;font-family:inherit;padding:6px 12px;min-width:44px;min-height:34px;cursor:pointer}.langs button+button{border-left:1px solid #d6e6f6}.langs button.on{background:#FFE08A;color:#3A2A00}
html[lang="en"] body{font-family:"Noto Sans","Noto Sans JP",system-ui,sans-serif}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:18px -18px 0;padding:10px 18px;display:flex;gap:8px;overflow-x:auto}
nav a{flex:0 0 auto;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px}
.tools{margin:16px 0 4px}.tools input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--card);color:var(--ink)}
h2{font-family:'Zen Maru Gothic','Gowun Dodum',sans-serif;font-size:22px;margin:36px 0 4px;padding-bottom:6px;border-bottom:3px solid var(--sky)}
.cdesc{color:var(--sub);margin:6px 0 14px}
.form{border:1px solid var(--iline);border-radius:18px;margin:14px 0;overflow:hidden;background:var(--ivory2)}
.form .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:12px 16px;background:var(--ivory);border-bottom:1px solid var(--iline)}
.form .top b{font-size:17px}.form .top .no{color:var(--sky);font-weight:700;margin-right:6px}
.form .top .alt{font-size:13px;color:var(--sub)}
.grid{display:grid;grid-template-columns:150px 1fr}
.grid b{background:var(--ivory);padding:9px 12px;border-top:1px solid var(--iline);text-align:center;display:flex;align-items:center;justify-content:center;font-size:14px}
.grid span{padding:9px 14px;border-top:1px solid var(--iline);background:var(--ivory2)}
.grid b:first-child,.grid b:first-child+span{border-top:0}
.fields{margin:0;padding-left:1.2em}
.warn{color:#7f1d1d;background:#fde7e6;border-radius:10px;padding:8px 12px;margin:10px 16px;font-size:14px}
.bar{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--iline)}
.bar button{border:1px solid var(--sky);background:var(--bg);color:var(--sky);border-radius:10px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.sheet{display:none;margin:0 16px 16px;border:2px solid #5a4e32;padding:16px;background:#FFFCF3;color:#111}
.sheet.open{display:block}
.sheet h3{text-align:center;margin:0 0 4px;font-size:18px}.sheet .sub{text-align:center;font-size:12px;margin:0 0 12px;color:#444}
.sheet table{width:100%;border-collapse:collapse}.sheet th,.sheet td{border:1px solid #8a7d5c;padding:8px;font-size:13px}
.sheet th{width:38%;background:#F4EBD2;text-align:center}.sheet td{height:30px;background:#FFFDF7}
.sheet .sign{display:flex;justify-content:space-between;margin-top:14px;font-size:13px}
footer{margin-top:40px;color:var(--sub);font-size:13px;text-align:center}
@media (max-width:640px){.grid{grid-template-columns:1fr}.grid b{justify-content:flex-start}}
@media print{body *{visibility:hidden}.sheet.printing,.sheet.printing *{visibility:visible}.sheet.printing{position:absolute;left:0;top:0;width:100%;border:0;margin:0}}
</style>
