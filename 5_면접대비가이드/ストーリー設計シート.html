.saved{font-size:13px;color:var(--sub);margin-left:auto}

.step{border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:14px 0;background:#fff}
.step h2{font-size:18px;margin:0 0 4px;display:flex;align-items:center;gap:10px}

.step .hint{font-size:13.5px;color:var(--sub);margin:0 0 10px}
label{display:block;font-size:13.5px;font-weight:700;margin:10px 0 4px}
label small{font-weight:400;color:var(--sub);margin-left:6px}
textarea,input[type=text]{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;background:var(--card);color:var(--ink);resize:vertical}
textarea{min-height:64px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.exp{border:1px dashed #cfd6f7;border-radius:12px;padding:6px 12px 12px;margin:10px 0;background:#fbfbff}
.exp b.t{display:block;margin-top:6px;color:var(--acc)}
.out{border:2px solid var(--acc);border-radius:16px;padding:16px 18px;margin:18px 0;background:#faf9ff}
.out h2{font-size:18px;margin:0 0 8px}
.draft{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;min-height:48px}
.meta{font-size:13px;color:var(--sub);margin:4px 0 12px}
.meter{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;margin:6px 0;font-size:14px}

ul.chk{list-style:none;padding:0;margin:8px 0}ul.chk li{padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px}
ul.chk li label{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:0;font-size:14.5px}
.miss{color:var(--warn);font-size:14px;margin:6px 0}
.note{font-size:13px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:16px}
a{color:#4b3fc4}
