<title>年次決算の練習</title>
<style>
:root{--ink:#1d2a38;--muted:#5b6b7d;--line:#dbe3ec;--bg:#f7fafd;--paper:#fff;--ok:#1f7a6e;--ng:#c2344f;--pl:#2f8fe0;--bs:#1f7a6e;--cf:#e08a2f;--warn:#b7791f}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans JP","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
header{position:relative}header h1{margin:0 0 8px}
.langs{display:inline-flex;gap:0}.langs button{border:1px solid var(--line);background:#fff;padding:6px 12px;cursor:pointer}.langs button.on{background:var(--pl);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.btn{min-height:44px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 14px;font:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}.btn.del{color:var(--ng)}.btn.on{border-color:var(--ink);background:#eef3f8}
.saved{font-size:12.5px;color:var(--muted)}
.privacy,.note{font-size:12.5px;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:16px 0}
.card h2{margin:0 0 12px;font-size:19px;display:flex;align-items:center;gap:10px}.card h2 .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pl);color:#fff;display:grid;place-items:center;font-size:15px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}@media(max-width:760px){.g3{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
input,select{font:inherit;font-size:14.5px;color:var(--ink);border:1.5px solid #b9c4d0;border-radius:8px;padding:7px 9px;min-height:40px;background:#fff;width:100%}
input[data-n]{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
table.ed{min-width:980px}table.ed th,table.ed td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:middle}table.ed th{font-size:12.5px;color:var(--muted);text-align:center;background:#f3f7fb}
html:not([lang=ja]) table.ed{min-width:1180px}html:not([lang=ja]) table.ed th.ac{min-width:300px}html[lang=en] table.ed{min-width:1260px}html[lang=en] table.ed th.ac{min-width:340px}
table.ed td.x{width:40px;text-align:center}table.ed tr.bad td{background:#fdeef0}table.ed tr.adj td:first-child{box-shadow:inset 4px 0 0 var(--cf)}
.xb{border:0;background:none;color:var(--ng);font-size:20px;cursor:pointer;min-width:36px;min-height:36px}
table.v{font-size:14px}table.v th,table.v td{border-bottom:1px solid var(--line);padding:6px 8px}table.v th{background:#f3f7fb;color:var(--muted);font-size:12.5px}
table.v td.n,table.v th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}table.v tr.sum td{font-weight:800;border-top:2px solid var(--line)}table.v tr.sec td{font-weight:800;background:#f7fafd}
.chk{list-style:none;padding:0;margin:0}.chk li{padding:8px 12px;border-radius:10px;margin:6px 0;font-size:14px;border:1px solid var(--line)}.chk li.ok{border-color:#b9ddd5;background:#f0f8f6}.chk li.ng{border-color:#f0b9c4;background:#fdf1f3}.chk li.wa{border-color:#ead6a8;background:#fdf8ec}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:10px 0}.kpi{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff}.kpi span{display:block;font-size:12.5px;color:var(--muted)}.kpi b{font-size:18px;font-variant-numeric:tabular-nums}
.paper{background:#fff;border:1px solid #b9c4d0;padding:30px 36px;margin-top:12px;font-family:"Noto Serif JP","Yu Mincho","MS Mincho",serif;font-size:14px;line-height:1.8;color:#000}
.paper h3{text-align:center;font-size:18px;margin:18px 0 6px}.paper .c{text-align:center}.paper .r{text-align:right}.paper p{margin:4px 0}
.paper table{font-size:13.5px;margin:8px 0}.paper th,.paper td{border:1px solid #000;padding:3px 8px}.paper td.n,.paper th.n{text-align:right;white-space:nowrap}.paper tr.sec td{font-weight:700;background:#f4f4f4}.paper tr.sum td{font-weight:700}.paper td.i1{padding-left:22px}.paper td.i2{padding-left:40px}
.paper hr{border:0;border-top:1px dashed #999;margin:24px 0}
.paper td,.paper th,table.v td,table.v th{text-align:left}.paper td.n,.paper th.n,table.v td.n,table.v th.n{text-align:right}.paper th{text-align:center}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
.rgsw{display:inline-flex;align-items:center;gap:0;margin-right:6px}.rgsw .rgq{font-size:13px;font-weight:700;color:var(--muted);margin-right:8px}.rgsw button{min-height:44px;border:1.5px solid var(--line);background:#fff;padding:6px 16px;font:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}.rgsw button:first-of-type{border-radius:10px 0 0 10px}.rgsw button:last-of-type{border-radius:0 10px 10px 0;border-left:0}.rgsw button.on{background:var(--pl);border-color:var(--pl);color:#fff}
.paper:lang(ko){font-family:"Noto Serif KR","Batang","Nanum Myeongjo",serif}
@media(max-width:700px){.paper{padding:16px 12px}.card{padding:14px 12px}}
@media print{body{background:#fff}.shbar,header,.bar,.privacy,#note,.shfoot,.nv-fab,#nv-copy,#app>.card:not(#outsec),#outsec>*:not(.paper){display:none!important}.paper hr{border:0;margin:0;break-after:page;page-break-after:always}.wrap{padding:0;max-width:none}#outsec{border:0;padding:0;margin:0}.paper{border:0;padding:0;margin:0}}

<script>
/* 年次決算の練習（2026.10）。決算書（#paper）は、科目を左・金額を右にそろえる日本の様式に合わせるため、shell.js の中央ぞろえから外す（data-noalign）
   小さな会社の1年分の仕訳から、総勘定元帳・試算表・決算書（貸借対照表・損益計算書）・法人税等の見積もりまでを作り、決算書を日本語で出力する。
   勘定科目は accounts.js（window.ACCTS）、法人の税率は rates_jp.js（window.RATES.corp）から読む。入っている会社と数字はすべて架空。
   入力はこのブラウザに保存し、ログイン中は会員の記録（user_docs: close）にも保存する。
   2026.11：制度の基準（日本／韓国）の切り替えを追加。韓国は12月決算の架空の会社・ウォン・法人税＋地方所得税（rates_jp.js の RATES.corp.kr）・中間予納（先納税金）で計算し、
   決算書は韓国の非上場中小企業の様式（特別損益なし）の韓国語で出力する。基準はレッスンと同じ art-region を使い、入力は基準ごとに別に保存する（acn-close-kr-v1 / user_docs: close_kr）。 */
var LS=['ja','ko','en'];
var L=(function(){var m=location.search.match(/lang=(ja|ko|en)/);if(m)return m[1];try{var s=localStorage.getItem('art-lang');if(LS.indexOf(s)>=0)return s}catch(e){}return 'ja'})();
var LI=LS.indexOf(L),SEL=null;
var RG=(function(){var m=location.search.match(/[?&]rg=(jp|kr)/);if(m)return m[1];try{var r=localStorage.getItem('art-region');if(r==='jp'||r==='kr')return r}catch(e){}return 'jp'})();
function KR(){return RG==='kr'}function key(){return KR()?'acn-close-kr-v1':'acn-close-v1'}function kind(){return KR()?'close_kr':'close'}
var X={
ttl:['年次決算の練習','연간 결산 연습','Year-End Closing Practice'],
lead:['小さな会社の1年分の仕訳から、総勘定元帳・試算表・決算書を作り、法人税等を見積もって、決算書を日本語で出力します。入っているのは架空の会社「さくらグランドサービス」（東京23区、資本金1,000万円、3月決算）の例です。仕訳を直したり足したりすると、すべての表がその場で変わります。','작은 회사의 1년 치 분개를 바탕으로 총계정원장·시산표·결산서를 만들고, 법인세 등을 추정해 결산서를 일본어로 출력합니다. 예시로 넣은 것은 가상의 회사 「사쿠라 그라운드 서비스」(도쿄 23구, 자본금 1,000만 엔, 3월 결산)의 자료입니다. 분개를 수정하거나 추가하면 모든 표가 바로 바뀝니다.','Build the general ledger, trial balance and financial statements from a small company’s year of journal entries, estimate its income taxes, and output the statements in Japanese. The example is a fictional company, Sakura Ground Services (Tokyo 23 wards, capital 10 million yen, March year-end). Edit or add entries and every table updates at once.'],
scope:['このツールの範囲：消費税の計算（仮払消費税・仮受消費税の精算）と申告書の作成は扱いません。勘定科目の一覧に消費税の科目はありますが、税額は計算しません。出力する決算書は貸借対照表・損益計算書と決算整理後残高試算表で、株主資本等変動計算書・個別注記表は含みません。','이 도구의 범위: 소비세 계산(부가세대급금·부가세예수금 정산)과 신고서 작성은 다루지 않습니다. 계정과목 목록에 소비세 계정은 있지만 세액은 계산하지 않습니다. 출력하는 결산서는 재무상태표·손익계산서와 결산 정리 후 잔액 시산표이며, 주주자본등변동계산서·개별주기표는 포함하지 않습니다.','Scope: consumption tax (settling input and output tax) and preparing tax returns are not covered. Consumption tax accounts appear in the account list, but no tax is calculated. The statements produced are the balance sheet, the income statement and the adjusted trial balance; the statement of changes in equity and the notes are not included.'],
privacy:['入力した内容は、このブラウザ（この端末）に自動で保存されます。ログインしているときは会員の記録にも保存されます。共用のパソコンでは、使い終わったら「すべて消す」を押してください。','입력한 내용은 이 브라우저(이 기기)에 자동으로 저장됩니다. 로그인한 상태에서는 회원 기록에도 저장됩니다. 공용 컴퓨터에서는 사용을 마친 뒤 「모두 지우기」를 눌러 주세요.','What you enter is saved automatically in this browser. When you are logged in it is also saved to your member record. On a shared computer, press “Clear all” when you finish.'],
ex:['例に戻す','예시로 되돌리기','Reset to example'],exC:['今の内容を例で置き換えます。よろしいですか？','현재 내용을 예시로 바꿉니다. 계속하시겠습니까?','Replace everything with the example?'],
clr:['すべて消す','모두 지우기','Clear all'],clrC:['入力した内容をすべて消します。元に戻せません。よろしいですか？','입력한 내용을 모두 지웁니다. 되돌릴 수 없습니다. 계속하시겠습니까?','Clear everything? This cannot be undone.'],
exp:['ファイルに書き出す','파일로 내보내기','Export to file'],imp:['ファイルから読み込む','파일에서 불러오기','Import from file'],impE:['読み込めませんでした。このツールで書き出したファイルを選んでください。','불러오지 못했습니다. 이 도구에서 내보낸 파일을 선택해 주세요.','Could not read the file. Choose a file exported from this tool.'],saved:['保存しました','저장했습니다','Saved'],
s1:['会社と会計期間','회사와 회계기간','Company and accounting period'],name:['会社名','회사명','Company name'],start:['期首（始まる日）','기초(시작일)','Start of year'],end:['期末（終わる日）','기말(종료일)','End of year'],
s2:['期首の残高','기초 잔액','Opening balances'],s2n:['前の期の貸借対照表の残高です。資産は借方、負債と純資産は貸方に入ります。','전기 재무상태표의 잔액입니다. 자산은 차변, 부채와 자본은 대변에 들어갑니다.','Balances from last year’s balance sheet. Assets go on the debit side, liabilities and equity on the credit side.'],
acc:['勘定科目','계정과목','Account'],amt:['金額（円）','금액(엔)','Amount (yen)'],side:['借方／貸方','차변/대변','Side'],dr:['借方','차변','Debit'],cr:['貸方','대변','Credit'],tot:['合計','합계','Total'],del:['消す','삭제','Remove'],addO:['科目を追加','계정 추가','Add account'],
s3:['仕訳','분개','Journal entries'],s3n:['1行に1つの仕訳です（借方1科目・貸方1科目）。複数の科目にまたがる取引は、行を分けて入れます。左端に色の線がある行は、日付が期末の日の行です。この例では1年分の合計も期末の日付でまとめて入れているので、色のある行がすべて決算整理とは限りません。この例の決算整理は、摘要に「決算整理」とある最後の3行です。','한 줄이 분개 하나입니다(차변 1계정·대변 1계정). 여러 계정에 걸친 거래는 여러 줄로 나눠 입력합니다. 왼쪽 끝에 색 선이 있는 줄은 날짜가 기말일인 줄입니다. 이 예시에서는 1년 치 합계도 기말 날짜로 한꺼번에 입력했으므로, 색이 있는 줄이 모두 결산 정리 분개인 것은 아닙니다. 이 예시의 결산 정리 분개는 적요에 「결산 정리」가 있는 마지막 3줄입니다.','One entry per line (one debit account, one credit account). Enter transactions that involve several accounts on separate lines. Lines with a coloured bar on the left are dated on the last day of the year. In this example the year’s totals are also entered on that date, so not every coloured line is a closing entry; the closing entries here are the last three lines marked “closing entry” in the description.'],
lgd:['期末の日付の行','기말 날짜의 줄','Dated at year-end'],
date:['日付','날짜','Date'],memo:['摘要','적요','Description'],addJ:['仕訳を追加','분개 추가','Add entry'],pick:['選ぶ','선택','Choose'],
s4:['総勘定元帳','총계정원장','General ledger'],s4n:['科目を選ぶと、その科目に記録された仕訳と残高の動きが見られます。','계정을 고르면 그 계정에 기록된 분개와 잔액의 움직임을 볼 수 있습니다.','Choose an account to see the entries posted to it and how its balance moved.'],
other:['相手科目','상대 계정','Contra account'],bal:['残高','잔액','Balance'],ob:['期首残高','기초 잔액','Opening balance'],taxl:['法人税等の計上（自動）','법인세 등 계상(자동)','Income taxes (automatic)'],
s5:['試算表と決算前のチェック','시산표와 결산 전 점검','Trial balance and pre-closing checks'],s5n:['決算整理と法人税等を入れたあとの、残高の試算表です。借方の合計と貸方の合計は必ず一致します。','결산 정리와 법인세 등을 넣은 뒤의 잔액 시산표입니다. 차변 합계와 대변 합계는 반드시 일치합니다.','The trial balance after closing entries and income taxes. Total debits always equal total credits.'],
s6:['法人税等の見積もり','법인세 등 추정','Income tax estimate'],s6n:['この例は、資本金等の額1,000万円以下・従業者50人以下・東京23区に事務所が1つ・事業年度12か月の会社として計算します。法人税の軽減税率（年800万円まで）は資本金1億円以下の中小法人の率（適用除外の会社を除く）を、法人住民税の均等割は上の条件の場合の7万円を使います。資本金等の額・従業者数・事務所の数・期間が違うと、均等割や税率が変わります。税率はレッスン「外国法人の支店にかかる税金」の計算と同じものを使います。','이 예시는 자본금 등의 금액 1,000만 엔 이하·종업원 50명 이하·도쿄 23구에 사무소 1곳·사업연도 12개월인 회사로 계산합니다. 법인세 경감세율(연 800만 엔까지)은 자본금 1억 엔 이하 중소법인의 세율(적용 제외 법인은 제외)을, 법인주민세 균등할은 위 조건일 때의 7만 엔을 사용합니다. 자본금 등의 금액·종업원 수·사무소 수·기간이 다르면 균등할이나 세율이 달라집니다. 세율은 레슨 「외국 법인 지점 세금」의 계산에서 사용한 것과 같습니다.','This example assumes a capital amount for local tax purposes (shihonkin-tō no gaku) of 10 million yen or less, 50 or fewer employees, one office in Tokyo’s 23 wards and a 12-month financial year. It uses the reduced corporation tax rate (on the first 8 million yen a year) for SMEs with capital of 100 million yen or less (excluding companies outside the relief), and the 70,000-yen per-capita inhabitant tax that applies under those conditions. A different capital amount, headcount, number of offices or period changes the per-capita levy and the rates. The rates are the same as in the corporate tax calculation in the lessons.'],
tw:{cap1:['資本金が1,000万円を超えています。均等割7万円は資本金等の額1,000万円以下・従業者50人以下の場合の額なので、実際の均等割はこの計算と変わります','자본금이 1,000만 엔을 초과합니다. 균등할 7만 엔은 자본금 등의 금액 1,000만 엔 이하·종업원 50명 이하인 경우의 금액이므로, 실제 균등할은 이 계산과 달라집니다','Share capital exceeds 10 million yen. The 70,000-yen per-capita levy applies to a capital amount of 10 million yen or less and 50 or fewer employees, so the actual levy will differ from this calculation'],
 cap2:['資本金が1億円を超えています。この計算で使っている中小法人の軽減税率などは使えません','자본금이 1억 엔을 초과합니다. 이 계산에서 사용하는 중소법인 경감세율 등은 적용되지 않습니다','Share capital exceeds 100 million yen. The SME reduced rate and other assumptions used here do not apply'],
 per:['事業年度が12か月ではありません。この計算は12か月の事業年度として計算しているので、均等割などが変わります','사업연도가 12개월이 아닙니다. 이 계산은 12개월 사업연도로 계산하므로 균등할 등이 달라집니다','The financial year is not 12 months. This calculation assumes a 12-month year, so the per-capita levy and other amounts will differ']},
pre:['税引前当期純利益','법인세 차감 전 순이익','Profit before tax'],adj:['申告調整（加算 − 減算、円）','세무 조정(가산 − 감산, 엔)','Tax adjustments (add − deduct, yen)'],adjn:['交際費の損金にならない分などを足し、受取配当の益金不算入などを引きます。ここでは合計だけを入れます。','접대비 중 손금이 되지 않는 금액 등을 더하고, 수입배당금 익금불산입 등을 뺍니다. 여기서는 합계만 넣습니다.','Add items that are not deductible (such as part of entertainment costs) and subtract income that is exempt (such as some dividends). Enter the net figure only.'],

 tbOk:['試算表の借方合計と貸方合計が一致しています','시산표의 차변 합계와 대변 합계가 일치합니다','Trial balance debits equal credits'],tbNg:['試算表の借方合計と貸方合計が {d} 円合いません','시산표의 차변 합계와 대변 합계에 {d}엔의 차이가 있습니다','Trial balance debits and credits differ by {d} yen'],bsOk:['貸借対照表の資産合計と、負債・純資産合計が一致しています','재무상태표의 자산 합계와 부채·자본 합계가 일치합니다','Total assets equal total liabilities and net assets'],bsNg:['貸借対照表が {d} 円合いません','재무상태표에 {d}엔의 차이가 있습니다','The balance sheet is out by {d} yen'],

rgq:['制度の基準','제도 기준','Rules'],rgjp:['日本','일본','Japan'],rgkr:['韓国','한국','Korea'],
rgn:['基準を「日本」にすると3月決算の日本の会社・円・日本の法人税等で、「韓国」にすると12月決算の韓国の会社・ウォン・韓国の法人税と地方所得税で計算し、決算書をその国の言葉と様式で出力します。入力は基準ごとに別々に保存されます。','기준을 「일본」으로 하면 3월 결산 일본 회사·엔화·일본 법인세 등으로, 「한국」으로 하면 12월 결산 한국 회사·원화·한국 법인세와 지방소득세로 계산하고, 결산서를 그 나라 말과 양식으로 출력합니다. 입력은 기준별로 따로 저장됩니다.','Choose “Japan” for a Japanese company with a March year-end, yen and Japanese corporate taxes, or “Korea” for a Korean company with a December year-end, won, and Korean corporate tax plus local income tax. The statements come out in that country’s language and format. Entries are saved separately for each.'],
lead_k:['小さな会社の1年分の仕訳から、総勘定元帳・試算表・決算書を作り、韓国の法人税と地方所得税を見積もって、決算書を韓国語で出力します。入っているのは架空の会社「株式会社ヌリグラウンドサービス」（仁川、資本金1億ウォン、12月決算）の例です。仕訳を直したり足したりすると、すべての表がその場で変わります。','작은 회사의 1년 치 분개를 바탕으로 총계정원장·시산표·결산서를 만들고, 한국의 법인세와 지방소득세를 추정해 결산서를 한국어로 출력합니다. 예시로 넣은 것은 가상의 회사 「(주)누리그라운드서비스」(인천, 자본금 1억 원, 12월 결산)의 자료입니다. 분개를 수정하거나 추가하면 모든 표가 바로 바뀝니다.','Build the general ledger, trial balance and financial statements from a small company’s year of journal entries, estimate its Korean corporate tax and local income tax, and output the statements in Korean. The example is a fictional company, Nuri Ground Services (Incheon, capital 100 million won, December year-end). Edit or add entries and every table updates at once.'],
scope_k:['このツールの範囲（韓国の基準）：付加価値税の計算と申告、税務調整の細かい項目（合計だけを入れます）、繰越欠損金・税額控除・減免・最低限税は扱いません。地方所得税（法人税分）は、法人税と同じ課税標準の区分に法人税率の10分の1をかけて計算します。出力する決算書は財務状態表・損益計算書と決算整理後の残高試算表で、資本変動表・利益剰余金処分計算書・注記は含みません。会社の規模や会計基準（一般企業会計基準・中小企業会計基準など）によって表示が変わることがあります。','이 도구의 범위(한국 기준): 부가가치세 계산과 신고, 세무조정의 세부 항목(합계만 입력), 이월결손금·세액공제·감면·최저한세는 다루지 않습니다. 지방소득세(법인세분)는 법인세와 같은 과세표준 구간에 법인세율의 10분의 1을 적용해 계산합니다. 출력하는 결산서는 재무상태표·손익계산서와 결산 정리 후 잔액시산표이며, 자본변동표·이익잉여금처분계산서·주석은 포함하지 않습니다. 회사 규모와 회계기준(일반기업회계기준·중소기업회계기준 등)에 따라 표시가 달라질 수 있습니다.','Scope (Korea): VAT calculation and returns, the individual tax adjustments (enter the net figure only), loss carry-forwards, tax credits and reliefs, and the minimum tax are not covered. Local income tax is calculated on the same tax base and brackets at one tenth of the corporate tax rates. The statements produced are the statement of financial position, the income statement and the adjusted trial balance; the statement of changes in equity, the appropriation of retained earnings and the notes are not included. Presentation can differ with company size and the accounting standard used.'],
s6n_k:['韓国では、国の法人税と、法人税と同じ課税標準にかかる地方所得税（法人税分）を納めます。2026年1月1日以後に始まる事業年度の法人税率は、課税標準2億ウォン以下10%、200億ウォン以下20%、3,000億ウォン以下22%、それを超える部分25%で、地方所得税は各区分でその10分の1（1〜2.5%）です。事業年度が1年より短いときは、課税標準を1年分に換算して税率をかけ、月数で割り戻します。税率はレッスン「外国法人の支店にかかる税金」の韓国の法人税の計算と同じものを使います。中間予納（上半期分、12月決算なら8月末まで）は「先納税金」として仕訳に入れます。★','한국은 국세인 법인세와, 법인세와 같은 과세표준에 매기는 지방소득세(법인세분)를 냅니다. 2026년 1월 1일 이후 시작하는 사업연도의 법인세율은 과세표준 2억 원 이하 10%, 200억 원 이하 20%, 3,000억 원 이하 22%, 그 초과분 25%이고, 지방소득세는 각 구간에서 그 10분의 1(1~2.5%)입니다. 사업연도가 1년보다 짧으면 과세표준을 1년분으로 환산해 세율을 적용한 뒤 월수로 되돌립니다. 세율은 레슨 「외국 법인 지점의 세금 개요」의 한국 법인세 계산과 같은 것을 씁니다. 중간예납(상반기분, 12월 결산이면 8월 말까지)은 「선납세금」으로 분개에 넣습니다. ★','Korea levies national corporate income tax and a local income tax on the same tax base. For financial years beginning on or after 1 January 2026 the corporate tax rates are 10% up to 200 million won, 20% up to 20 billion won, 22% up to 300 billion won and 25% above that; local income tax is one tenth of each rate (1–2.5%). If the financial year is shorter than 12 months, the tax base is annualised, taxed, and scaled back by the number of months. The rates are the same as in the Korean corporate tax calculation in the lessons. Enter the interim prepayment (first half, due by the end of August for a December year-end) as “prepaid tax”. ★'],
adjn_k:['企業業務推進費（旧・接待費）の限度を超えた分などを足し、受取配当金の益金不算入などを引きます。ここでは合計だけを入れます。','기업업무추진비(옛 접대비) 한도초과액 등을 더하고, 수입배당금 익금불산입 등을 뺍니다. 여기서는 합계만 넣습니다.','Add items that are not deductible (such as business promotion expenses above the limit) and subtract exempt income (such as some dividends). Enter the net figure only.'],
taxn_k:['※ 繰越欠損金、税額控除・減免、最低限税、農漁村特別税などを反映していない概算です。法人税の申告は事業年度が終わる日の属する月の末日から3か月以内（12月決算なら3月31日、誠実申告確認の対象は4か月以内）、地方所得税は4か月以内（4月30日）です。実際の申告は税理士に確認してください。★','※ 이월결손금, 세액공제·감면, 최저한세, 농어촌특별세 등을 반영하지 않은 개략 계산입니다. 법인세 신고는 사업연도 종료일이 속하는 달의 말일부터 3개월 이내(12월 결산이면 3월 31일, 성실신고확인 대상은 4개월 이내), 지방소득세는 4개월 이내(4월 30일)입니다. 실제 신고는 세무사에게 확인하세요. ★','* An estimate that ignores loss carry-forwards, tax credits and reliefs, the minimum tax and special rural development tax. Corporate tax is filed within three months of the end of the month in which the year ends (31 March for a December year-end; four months for companies under the faithful-filing review), and local income tax within four months (30 April). Confirm actual filings with a tax accountant. ★'],
manualTax_k:['仕訳に「法人税費用」が入っているので、自動の計上はしていません。','분개에 「법인세비용」이 들어 있으므로 자동 계상은 하지 않았습니다.','An income-tax entry already exists in the journal, so nothing is booked automatically.'],

s7_k:['決算書（韓国語で出力）','결산서(한국어로 출력)','Financial statements (output in Korean)'],s7n_k:['下の決算書は、韓国の非上場の中小企業がよく使う様式（中断事業がない場合）に合わせて韓国語で作ります。韓国の基準には特別損益がないので、特別利益・特別損失の科目は営業外収益・営業外費用として表示します。印刷・PDF、Word、試算表のCSV（エクセルで開ける）で保存できます。','아래 결산서는 한국 비상장 중소기업이 흔히 쓰는 양식(중단사업이 없는 경우)에 맞춰 한국어로 만듭니다. 한국 기준에는 특별손익이 없으므로, 특별이익·특별손실 계정은 영업외수익·영업외비용으로 표시합니다. 인쇄·PDF, Word, 시산표 CSV(엑셀에서 열 수 있음)로 저장할 수 있습니다.','The statements below follow the format commonly used by non-listed Korean SMEs (with no discontinued operations) and are produced in Korean. Korean GAAP has no extraordinary items, so extraordinary gains and losses are shown as non-operating income and expenses. You can print or save them as PDF or Word, and save the trial balance as CSV (opens in Excel).'],
