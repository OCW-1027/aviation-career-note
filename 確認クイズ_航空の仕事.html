@media (prefers-color-scheme:dark){:root{--ink:#e8eef5;--sub:#a9b6c4;--line:#2a3a4c;--bg:#0f1720;--card:#16212d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP','Noto Sans KR',sans-serif;line-height:1.7}
body.ko{font-family:'Noto Sans KR','Noto Sans JP',sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:24px 18px 60px}
header{background:linear-gradient(160deg,#6db8f2,#2F8FE0);color:#fff;border-radius:22px;padding:26px 24px;position:relative}
header h1{font-family:'Zen Maru Gothic','Gowun Dodum',sans-serif;font-size:clamp(22px,4vw,30px);margin:4px 0}
header p{margin:0;opacity:.95}
.lang{position:absolute;top:16px;right:16px;border:0;background:#fff;color:var(--sky);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}
.panel{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:18px;margin-top:18px}
label{display:block;font-size:14px;color:var(--sub);margin:8px 0 4px;text-align:center}
select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--bg);color:var(--ink)}
.btn{display:block;width:100%;margin-top:14px;border:0;background:var(--sky);color:#fff;border-radius:14px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
.btn.sub{background:transparent;color:var(--sky);border:1px solid var(--sky)}
.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:13px}
.qt{font-family:'Zen Maru Gothic','Gowun Dodum',sans-serif;font-size:20px;margin:10px 0 14px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:#e3f4e9;color:#14532d}.opt.ng{border-color:var(--ng);background:#fde7e6;color:#7f1d1d}
.exp{margin-top:12px;padding:12px 14px;border-radius:12px;background:#fff7d6;color:#5a4500}
.exp a{color:#1d5fa0}
.score{text-align:center;font-size:40px;font-weight:900;color:var(--sky);margin:10px 0}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--sky)}
.review div{border-top:1px solid var(--line);padding:10px 0;font-size:14px}
</style>
<style>.langs{position:absolute;top:16px;right:16px;display:inline-flex;border-radius:999px;overflow:hidden;background:#fff}.langs button{border:0;background:transparent;color:#1d5fa0;font:700 13px inherit;font-family:inherit;padding:6px 12px;min-width:44px;min-height:34px;cursor:pointer}.langs button+button{border-left:1px solid #d6e6f6}.langs button.on{background:#FFE08A;color:#3A2A00}
html[lang="en"] body{font-family:"Noto Sans","Noto Sans JP",system-ui,sans-serif}</style>

function head(){var t=T[lang];document.body.className=lang;document.documentElement.lang=lang;['kick','ttl','lead'].forEach(function(i){$(i).textContent=t[i]});langBar(relang)}
function setup(){var t=T[lang];head();
 var po='<option value="-1">'+t.all+'</option>';if(st.s!=='0')SER[st.s].parts[lang].forEach(function(p,i){if(p)po+='<option value="'+i+'">Part '+i+' '+esc(p)+'</option>'});
 $('app').innerHTML='<div class="panel"><label>'+t.ser+'</label><select id="s"><option value="0">'+t.all+'</option>'+Object.keys(SER).map(function(k){return '<option value="'+k+'">'+SER[k][lang]+'</option>'}).join('')+'</select>'+
 '<label>'+t.part+'</label><select id="p">'+po+'</select><label>'+t.num+'</label><select id="n"><option>5</option><option>10</option><option>20</option><option value="999">'+t.all+'</option></select>'+
 '<p class="meta" style="justify-content:center;margin-top:10px">'+pool().length+(lang==='ja'?'問':lang==='ko'?'문항':' questions')+'</p><button class="btn" id="go">'+t.start+'</button></div>';
 $('s').value=st.s;$('p').value=st.p;$('n').value=st.n;
 $('s').onchange=function(){st.s=this.value;st.p='-1';setup()};$('p').onchange=function(){st.p=this.value;setup()};$('n').onchange=function(){st.n=this.value};
 $('go').onclick=function(){var P=shuffle(pool().slice()).slice(0,+st.n);if(!P.length)return;run={P:P,i:0,ok:0,wrong:[]};ask()};}
function ask(){var t=T[lang],r=run,q=r.P[r.i],L=q[lang]||q.ja,tt=lang==='ja'?q.tja:lang==='ko'?q.tko:(q.ten||q.tja);head();
 $('app').innerHTML='<div class="panel"><div class="meta"><span>'+(r.i+1)+' / '+r.P.length+'</span><span>'+SER[q.s].pre+q.no+' '+esc(tt)+'</span></div><div class="bar"><i style="width:'+Math.round(r.i/r.P.length*100)+'%"></i></div>'+(q[lang]?'':'<p class="meta">'+esc(t.jp)+'</p>')+'<div class="qt">'+esc(L.q)+'</div>'+
 L.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'">'+esc(o)+'</button>'}).join('')+'<div id="after"></div></div>';
 Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b){b.onclick=function(){if(r.done)return;r.done=1;var c=+b.getAttribute('data-i'),good=c===L.a;
  document.querySelectorAll('.opt')[L.a].classList.add('ok');if(!good){b.classList.add('ng');r.wrong.push(q)}else r.ok++;
  $('after').innerHTML='<div class="exp"><b>'+(good?t.ok:t.ng)+'</b> '+esc(L.exp)+' <a href="'+SER[q.s].dir+'/view.html?no='+q.no+'" target="_blank">'+t.read+' →</a></div><button class="btn" id="nx">'+(r.i+1<r.P.length?t.next:t.fin)+'</button>';
  $('nx').onclick=function(){r.done=0;r.i++;if(r.i<r.P.length)ask();else result()};}});}
function result(){var t=T[lang],r=run;head();
 $('app').innerHTML='<div class="panel"><p class="meta" style="justify-content:center">'+t.res+'</p><div class="score">'+r.ok+' / '+r.P.length+'</div><div class="review"><b>'+t.review+'</b>'+(r.wrong.length?r.wrong.map(function(q){var L=q[lang]||q.ja;return '<div>'+SER[q.s].pre+q.no+'｜'+esc(L.q)+'<br>→ '+esc(L.opts[L.a])+' <a href="'+SER[q.s].dir+'/view.html?no='+q.no+'" target="_blank">'+t.read+'</a></div>'}).join(''):'<div>'+t.none+'</div>')+'</div><button class="btn" id="ag">'+t.again+'</button><button class="btn sub" id="bk">'+t.ser+' / '+t.part+'</button></div>';
 $('ag').onclick=function(){run={P:shuffle(r.P.slice()),i:0,ok:0,wrong:[]};ask()};$('bk').onclick=setup;}
function relang(){if(run&&run.i<run.P.length&&!run.done)ask();else setup()}
setup();
})();
</script>
<script src="1_지상직여객운송입문/assets/nav.js"></script>
</body>
</html>
