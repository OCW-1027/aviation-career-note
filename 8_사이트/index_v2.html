 var mc=window.MEMBER_CONFIG||{},live=!!(mc.url&&mc.anonKey),hrefs=['../community/index.html','',  'account.html'];
 $('cx').innerHTML=t.cx.map(function(c,i){var wait=i===1||(i===0&&!live);return '<div><h3>'+E(c[0])+(wait?'<span class="tag w">'+t.wait+'</span>':'')+'</h3><p>'+E(c[1])+'</p>'+(c[2]?'<a class="btn line" href="'+hrefs[i]+'">'+E(c[2])+'</a>':'')+'</div>'}).join('');
 $('trust').innerHTML=E(t.trust)+' <a href="sources.html">'+E(t.src)+'</a><a href="about.html">'+E(t.about)+'</a>';
 SR.reset(lang);
};
function pass(s,lang,t){var d=s[lang]||s.ja;return '<a class="pass2" href="'+s.p+'"><div class="m"><div class="who">'+E(d[0])+'</div><b>'+E(d[1])+'</b><div class="d">'+E(d[2])+'</div></div><div class="s">'+(window.__updNew?window.__updNew(s.p,lang):'')+'<span class="c">'+s.code+'</span><small>'+s.n+' '+E(t.arts)+'</small></div></a>'}
function tool(x,lang){var d=x[lang]||x.ja;return '<a href="'+x.p+'"><b>'+E(String(d[0]).replace(/\n/g,' '))+'</b><span>'+E(d[1])+'</span></a>'}

/* 検索：講座・ツール・（あれば）レッスンの題名を、入力した言葉がすべて含まれるものから探す */
var SR=(function(){var lang='ja',loaded=false,items=null;
 function N(s){return String(s||'').normalize('NFKC').toLowerCase()}
 function load(){if(loaded)return;loaded=true;var s=document.createElement('script');s.src='../search_index.js';s.onload=function(){items=null;run()};document.head.appendChild(s)}
 function build(){var L=li(lang),out=[],names={};
  SERIES.forEach(function(s){var d=s[lang]||s.ja;names[String(s.code).toLowerCase()]=d[1];out.push({k:'c',t:d[1],s:d[2],u:s.p,q:N([s.code,d[0],d[1],d[2],s.ja[1],s.ko[1],s.en[1]].join(' '))})});
  TOOLS.forEach(function(x){var d=x[lang]||x.ja;out.push({k:'t',t:String(d[0]).replace(/\n/g,' '),s:d[1],u:x.p,q:N([x.ja[0],x.ko[0],x.en[0],d[1]].join(' '))})});
  var X=window.SEARCH_INDEX;if(X&&X.l)X.l.forEach(function(r){var tt=r[2+L]||r[2]||r[3];out.push({k:'l',t:tt,s:(names[r[0]]||r[0].toUpperCase())+' '+r[1],u:'../'+lang+'/'+r[0]+'/'+r[1]+'/',q:N([r[0],r[1],r[2],r[3],r[4]].join(' '))})});
  return out}
 function run(){var q=N($('sq').value).trim(),box=$('sres'),t=T[lang]||T.ja;if(!q){box.classList.remove('on');box.innerHTML='';return}
  if(!items)items=build();var w=q.split(/\s+/),hit=items.filter(function(x){return w.every(function(k){return x.q.indexOf(k)>=0})});
  hit.sort(function(a,b){var ra=N(a.t).indexOf(w[0])>=0?0:1,rb=N(b.t).indexOf(w[0])>=0?0:1;return ra-rb||({c:0,t:1,l:2}[a.k]-{c:0,t:1,l:2}[b.k])});
  var top=hit.slice(0,12);
  box.innerHTML=top.length?top.map(function(x){return '<a role="option" href="'+E(x.u)+'"><span class="k '+x.k+'">'+E(t.kinds[x.k])+'</span><span class="t">'+E(x.t)+'<span class="s">'+E(x.s)+'</span></span></a>'}).join('')+(hit.length>12?'<div class="hint">12'+E(t.more)+'</div>':''):'<div class="none">'+E(t.none)+'</div>';
  box.classList.add('on')}
 function init(){var q=$('sq'),box=$('sres');
  q.addEventListener('focus',load);q.addEventListener('input',run);
  q.addEventListener('keydown',function(e){if(e.key==='ArrowDown'){var a=box.querySelector('a');if(a){e.preventDefault();a.focus()}}else if(e.key==='Escape'){box.classList.remove('on')}});
  box.addEventListener('keydown',function(e){var as=[].slice.call(box.querySelectorAll('a')),i=as.indexOf(document.activeElement);if(e.key==='ArrowDown'&&i<as.length-1){e.preventDefault();as[i+1].focus()}else if(e.key==='ArrowUp'){e.preventDefault();(i>0?as[i-1]:q).focus()}else if(e.key==='Escape'){box.classList.remove('on');q.focus()}});
  $('sf').addEventListener('submit',function(e){e.preventDefault();run();var a=box.querySelector('a');if(a)location.href=a.getAttribute('href')});
  document.addEventListener('click',function(e){if(!$('srch').contains(e.target))box.classList.remove('on')})}
 document.addEventListener('DOMContentLoaded',init);
 return {reset:function(l){lang=l;items=null;if($('sq').value)run()}}})();
</script>
