var T={ja:{h1:'プライバシーポリシー',hp:'個人情報の取り扱いについて。',dr:'【案】個人情報保護法にもとづき、公開前に専門家の確認を受けてください。アクセス解析・広告を導入する場合は追記が必要です。★',
body:[['1. 取得する情報','本サイトは、閲覧だけであれば氏名などの個人情報を取得しません。求人掲載のお申し込み・お問い合わせの際に、会社名・ご担当者名・メールアドレス・電話番号などをメールでお送りいただく場合があります。言語の設定などを、お使いの端末のブラウザに保存することがあります（当社のサーバーには送信されません）。'],
['2. 利用の目的','いただいた情報は、求人掲載のご案内・原稿の作成・請求・お問い合わせへの回答のためにのみ利用します。'],
['3. 第三者への提供','法令にもとづく場合を除き、ご本人の同意なく第三者に提供しません。'],
['4. 求人への応募の情報','求人への応募は掲載企業に直接行っていただくため、本サイトは応募者の個人情報を取得しません。応募の情報の取り扱いは各掲載企業の方針に従います。'],
['5. 安全管理','取得した情報は、漏えい・紛失を防ぐために必要な措置を講じて管理し、不要になった情報は適切に削除します。'],
['6. 開示・訂正・削除','ご本人から個人情報の開示・訂正・利用の停止・削除の請求があった場合は、法令に従って対応します。下記までご連絡ください。'],
['7. お問い合わせ','［運営会社名］　（お問い合わせ先を記載）'],
['8. 改定','このポリシーは必要に応じて改定します。改定後の内容は本サイトに掲載した時点から効力を持ちます。（制定日を記載）']]},
ko:{h1:'개인정보 처리방침',hp:'개인정보 취급에 대해.',dr:'【안】일본 개인정보보호법에 따라 공개 전에 전문가 확인을 받으세요. 접속 분석·광고를 도입하면 추가 기재가 필요합니다. 한국어는 참고 번역이며 일본어가 우선합니다. ★',
body:[['1. 수집하는 정보','본 사이트는 열람만으로는 성명 등 개인정보를 수집하지 않습니다. 구인 게재 신청·문의 때 회사명·담당자명·메일 주소·전화번호 등을 메일로 보내 주시는 경우가 있습니다. 언어 설정 등을 사용 중인 단말 브라우저에 저장하기도 합니다 (당사 서버로 송신되지 않음).'],
['2. 이용 목적','받은 정보는 구인 게재 안내·원고 작성·청구·문의 회신을 위해서만 이용합니다.'],
['3. 제3자 제공','법령에 따른 경우를 제외하고 본인 동의 없이 제3자에게 제공하지 않습니다.'],
['4. 구인 지원 정보','구인 지원은 게재 기업에 직접 하므로 본 사이트는 지원자 개인정보를 수집하지 않습니다. 지원 정보 취급은 각 게재 기업의 방침을 따릅니다.'],
['5. 안전 관리','수집한 정보는 유출·분실을 막기 위해 필요한 조치를 해 관리하고 불필요해진 정보는 적절히 삭제합니다.'],
['6. 공개·정정·삭제','본인이 개인정보 공개·정정·이용 정지·삭제를 청구하면 법령에 따라 대응합니다. 아래로 연락해 주세요.'],
['7. 문의','[운영 회사명] (문의처 기재)'],
['8. 개정','이 방침은 필요에 따라 개정합니다. 개정 후 내용은 본 사이트에 게재한 시점부터 효력을 가집니다. (제정일 기재)']]},
en:{h1:'Privacy policy',hp:'How we handle personal information.',dr:'[DRAFT] Have a professional review this against Japan’s Act on the Protection of Personal Information before launch. If you add analytics or advertising, this policy must be extended. The Japanese text prevails. ★',
body:[['1. Information we collect','If you only read the site, we do not collect personal information such as your name. When you apply to post a job or contact us, you may send us your company name, contact person, email address and telephone number by email. Settings such as your chosen language may be stored in your own browser (they are not sent to our servers).'],
['2. How we use it','We use the information only to explain how job posting works, to prepare listings, to invoice, and to answer enquiries.'],
['3. Disclosure to third parties','We do not disclose information to third parties without your consent, except where required by law.'],
['4. Job applications','Applications are made directly to the employer, so this site does not collect applicants’ personal information. Each employer handles application data under its own policy.'],
['5. Security','We take the measures needed to prevent leakage or loss of the information we hold, and delete it appropriately when it is no longer needed.'],
['6. Disclosure, correction and deletion','If you ask us to disclose, correct, stop using or delete your personal information, we will respond in accordance with the law. Please contact us at the address below.'],
['7. Contact','[Operating company name] (contact details to be added)'],
['8. Changes','We may revise this policy as needed. The revised policy takes effect when published on the site. (date of enactment to be added)']]}};
window.render=function(l){var t=T[l],E=window.SITE_ESC;document.getElementById('h1').textContent=t.h1;document.getElementById('hp').textContent=t.hp;document.getElementById('dr').textContent=t.dr;
 document.getElementById('body').innerHTML=t.body.map(function(a){return '<h3>'+E(a[0])+'</h3><p>'+E(a[1])+'</p>'}).join('');document.title=t.h1+' | '+window.SITE_NAME()};
