  return '<section class="path" id="'+p[0]+'"><h3>'+E(n[0])+'</h3><p class="who">'+E(n[1])+'</p>'+(F5[p[0]]?'<div class="first5"><b>'+E(t.p5)+'</b><ol>'+F5[p[0]].map(function(x){return '<li><a href="../'+l+'/'+x[0]+'/'+x[1]+'/">'+E(x[2][l]||x[2].ja)+'</a></li>'}).join('')+'</ol><a class="go1" href="../'+l+'/'+F5[p[0]][0][0]+'/'+F5[p[0]][0][1]+'/">'+E(t.pgo)+' →</a></div>':'')+(G5[p[0]]?'<div class="goals"><b>'+E(t.goalL)+'</b><ul>'+G5[p[0]].g[l].map(function(x){return '<li>'+E(x)+'</li>'}).join('')+'</ul></div>':'')+'<ol>'+p[1].map(function(s){var c=C[s[0]],hr=s[2]?s[2].replace('{l}',l):c[0]+'?lang='+l,lb=s[3]?s[3][idx]:c[li];return '<li><a href="'+E(hr)+'">'+E(lb)+'</a><small>'+E(s[1][idx])+'</small></li>'}).join('')+'</ol>'+
  '<div class="meta"><span>'+E(t.tools)+(l==='ja'?'：':': ')+'</span>'+p[2].map(function(k){var x=TL[k];return '<a href="'+E(x[0])+'?lang='+l+'">'+E(x[ti])+'</a>'}).join('')+'</div>'+
  (CK5[p[0]]?'<div class="checks"><b>'+E(t.ckL)+'</b><ol>'+CK5[p[0]].map(function(x){var href,lab;if(x[0]==='tool'){var tl=TL[x[1]];href=tl[0]+'?lang='+l;lab=tl[ti]}else{href='../'+l+'/'+x[1]+'/';lab=x[1].split('/')[1]+' '+(x[3][l]||x[3].ja)}return '<li>'+E(x[2][l]||x[2].ja)+' → <a href="'+E(href)+'">'+E(lab)+'</a></li>'}).join('')+'</ol></div>':'')+(G5[p[0]]&&G5[p[0]].c.length?'<div class="meta"><span>'+E(t.caseL)+(l==='ja'?'：':': ')+'</span>'+G5[p[0]].c.map(function(x){return '<a href="../'+l+'/'+x[0]+'/'+x[1]+'/">'+E(x[1]+' '+(x[2][l]||x[2].ja))+'</a>'}).join('')+'</div>':'')+'<div class="meta" style="border-top:0;padding-top:4px">'+E(t.time.replace('{n}',p[3]).replace('{w}',Math.ceil(p[3]/5)))+'</div></section>'}).join('');
 h+='<h3>'+E(t.h_tips)+'</h3><ul class="tips">'+t.tips.map(function(x){return '<li>'+E(x)+'</li>'}).join('')+'</ul><p class="note" style="margin-top:14px;color:#5d6b79;font-size:13.5px">'+E(t.note)+'</p>';
 document.getElementById('body').innerHTML=h;document.title=t.h1+' | '+window.SITE_NAME()};
