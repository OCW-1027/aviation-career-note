<script>
/* 出典と利用条件（2026.09 新規）
   各資料の利用条件は 2026年9月に確認：韓国AIP＝公共データポータル「利用許諾範囲 制限なし」、
   日本AIP・AIC＝SWIM の「航空情報センター（AISC）が提供するコンテンツの二次利用について」（2026年2月20日）、
   法令・告示・通達＝韓国著作権法第7条・日本著作権法第13条。 */
var AIM='https://aim.koca.go.kr/',DGK='https://www.data.go.kr/data/15141563/fileData.do',SWIM='https://top.swim.mlit.go.jp/swim/',NE='https://www.naturalearthdata.com/';
var T={ja:{h1:'出典と利用条件',hp:'このサイトの記事・図・練習ページで使っている資料と、その利用条件です。',dr:'【案】公開前に専門家（弁護士など）の確認を受けてください。',
body:[['1 基本の考え方','このサイトの図・地図・練習用の飛行計画は、公開資料をもとに当サイトが独自に作った教育用の略図と例です。航法や実際の運航には使えません。運航には、必ずその時点で有効なAIP（航空路誌）・NOTAMなど公式の情報を使ってください。'],
['2 法令・告示・通達','韓国の法律・施行規則・告示（運航技術基準など）と、日本の航空法・施行規則・告示・通達（運航規程審査要領細則など）は、韓国著作権法第7条・日本著作権法第13条により著作権の対象になりません。当サイトでは要点をまとめ、条文の番号と版（改正日）を示しています。'],
['3 韓国のAIP（航空路誌）','国土交通部 航空交通本部の「航空情報統合管理（AIM）」が公開しているもので、公共データポータルでは「利用許諾範囲 制限なし」とされています。地点の座標・航空路・距離・最低高度、仁川FIRの境界、NOTAMのシリーズなどに使っています（2026年9月版）。',[['AIM（航空情報統合管理）',AIM],['公共データポータル（航空情報刊行物）',DGK]]],
['4 日本のAIP・AIC','国土交通省 航空局 航空情報センターが提供するもので、現在はSWIMポータルで配信されています。同センターの「コンテンツの二次利用について」により、次の条件を守れば目的を問わず自由に使えます：①国が作成したかのように見せないこと、②運航に使われるおそれがある場合は最新の情報を保つか、最新でない可能性・運航に使えないことを示すこと。当サイトは、ENR 3.3（2026年10月1日版）と AIC 017/26「Change of Flight Planned Routes」（2026年10月1日発効）の地点・距離・標準経路を使い、各ページに「教育用・最新でない可能性・航法には使えない」ことを示しています。',[['SWIM ポータル',SWIM]]],
['5 航空図について','当サイトの図は、公式の航空図（エンルートチャートなど）を複製したものではなく、座標から独自に描いた略図です。航空図に似た刊行物を発行する場合は、日本では水路業務法の手続きが必要になることがあるため、当サイトの図は教育用の図解にとどめています。'],
['6 地図の背景','海岸線・国境線は Natural Earth（パブリックドメイン）を使っています。北側の軍事境界線付近のFIR境界は、公示の座標がないため Natural Earth の国境線で近似しています。',[['Natural Earth',NE]]],
['7 そのほかの公開情報','ICAOの基準、各国の当局・空港・航空会社の公開資料、報道資料などは、事実を要約して出典を示しています。文章・図をそのまま転載することはしていません。'],
['8 練習用のデータ','練習用の便名・機体の登録記号・重量・燃料・NOTAMなどは架空のものです。実在の便・会社の実績ではありません。'],
['9 お問い合わせ','出典や内容の誤りに気づかれた場合は、「このサイトについて」のページからお知らせください。確認のうえ直します。']]},
ko:{h1:'출처와 이용 조건',hp:'이 사이트의 기사·그림·연습 페이지에서 쓰는 자료와 그 이용 조건입니다.',dr:'【안】공개 전에 전문가(변호사 등)의 확인을 받으세요. 한국어는 참고 번역이며 일본어가 우선합니다.',
body:[['1 기본 방침','이 사이트의 그림·지도·연습용 비행계획은 공개 자료를 바탕으로 당 사이트가 직접 만든 교육용 약도와 예입니다. 항법이나 실제 운항에는 쓸 수 없습니다. 운항에는 반드시 그 시점에 유효한 AIP(항공정보간행물)·NOTAM 등 공식 정보를 쓰세요.'],
['2 법령·고시·통달','한국의 법률·시행규칙·고시(운항기술기준 등)와 일본의 항공법·시행규칙·고시·통달(운항규정 심사요령 세칙 등)은 한국 저작권법 제7조·일본 저작권법 제13조에 따라 저작권 보호 대상이 아닙니다. 당 사이트는 요점을 정리하고 조문 번호와 판(개정일)을 밝힙니다.'],
['3 한국 AIP(항공정보간행물)','국토교통부 항공교통본부 「항공정보통합관리(AIM)」가 공개하는 자료로, 공공데이터포털에서 「이용허락범위 제한 없음」으로 되어 있습니다. 지점 좌표·항공로·거리·최저 고도, 인천 FIR 경계, NOTAM 시리즈 등에 씁니다(2026년 9월판).',[['AIM(항공정보통합관리)',AIM],['공공데이터포털(항공정보간행물)',DGK]]],
['4 일본 AIP·AIC','국토교통성 항공국 항공정보센터가 제공하며 현재 SWIM 포털로 배포됩니다. 같은 센터의 「콘텐츠 2차 이용에 대하여」에 따라 다음 조건을 지키면 목적과 관계없이 자유롭게 쓸 수 있습니다: ① 국가가 만든 것처럼 보이게 하지 않을 것, ② 운항에 쓰일 우려가 있으면 최신 정보를 유지하거나, 최신이 아닐 수 있다는 점·운항에 쓸 수 없다는 점을 밝힐 것. 당 사이트는 ENR 3.3(2026년 10월 1일판)과 AIC 017/26 「Change of Flight Planned Routes」(2026년 10월 1일 발효)의 지점·거리·표준 경로를 쓰고, 각 페이지에 「교육용·최신이 아닐 수 있음·항법에 사용 불가」를 밝힙니다.',[['SWIM 포털',SWIM]]],
['5 항공도에 대하여','당 사이트의 그림은 공식 항공도(항로 차트 등)를 복제한 것이 아니라 좌표로 직접 그린 약도입니다. 항공도와 비슷한 간행물을 발행할 때는 일본에서 수로업무법 절차가 필요할 수 있으므로, 당 사이트의 그림은 교육용 도해에 그칩니다.'],
['6 지도 배경','해안선·국경선은 Natural Earth(퍼블릭 도메인)를 씁니다. 북쪽 군사분계선 부근의 FIR 경계는 공시 좌표가 없어 Natural Earth 국경선으로 근사했습니다.',[['Natural Earth',NE]]],
['7 그 밖의 공개 정보','ICAO 기준, 각국 당국·공항·항공사의 공개 자료, 보도자료 등은 사실을 요약하고 출처를 밝힙니다. 문장·그림을 그대로 옮겨 싣지 않습니다.'],
['8 연습용 데이터','연습용 편명·기체 등록부호·중량·연료·NOTAM 등은 가상의 것입니다. 실재하는 편·회사의 실적이 아닙니다.'],
['9 문의','출처나 내용의 오류를 발견하시면 「사이트 소개」 페이지에서 알려 주세요. 확인한 뒤 고치겠습니다.']]},
en:{h1:'Sources and terms of use',hp:'The materials used in this site’s articles, diagrams and practice pages, and the conditions under which we use them.',dr:'[DRAFT] Have a lawyer review this before launch. The Japanese text prevails; the English is a reference translation.',
body:[['1 Our approach','The diagrams, maps and practice flight plans on this site are educational sketches and examples that we drew ourselves from public sources. They are not for navigation or real operations. For operations, always use the official information in force at the time, such as the current AIP and NOTAMs.'],
['2 Laws, notices and circulars','Korean laws, enforcement rules and notices (such as the Flight Safety Regulations) and Japanese laws, enforcement regulations, notices and circulars (such as the detailed Operations Manual review rules) are not protected by copyright under Article 7 of Korea’s Copyright Act and Article 13 of Japan’s. We summarise the key points and give the article numbers and edition (amendment date).'],
['3 Korean AIP','Published by the Aeronautical Information Management (AIM) service of the Office of Civil Aviation, Ministry of Land, Infrastructure and Transport. Korea’s public data portal lists it with no restriction on use. We use it for point coordinates, airways, distances, minimum altitudes, the Incheon FIR boundary and NOTAM series (September 2026 edition).',[['AIM (Korea)',AIM],['Korea public data portal (AIP)',DGK]]],
['4 Japanese AIP and AIC','Provided by the Aeronautical Information Service Center of the Japan Civil Aviation Bureau, now distributed through the SWIM portal. Under the Center’s notice on secondary use of its content, they may be used freely for any purpose on two conditions: (1) not presenting the material as if the government had produced it, and (2) where it could be used for flight operations, keeping it current or stating that it may not be current and must not be used for operations. We use points, distances and standard routes from ENR 3.3 (1 October 2026 edition) and AIC 017/26 “Change of Flight Planned Routes” (effective 1 October 2026), and each page states that the material is educational, may not be current and is not for navigation.',[['SWIM portal',SWIM]]],
['5 About aeronautical charts','Our diagrams are not copies of official aeronautical charts; we drew them ourselves from coordinates. In Japan, publishing material resembling aeronautical charts can require procedures under the Hydrographic Services Act, so our diagrams remain educational illustrations.'],
['6 Map backgrounds','Coastlines and borders come from Natural Earth (public domain). Near the Military Demarcation Line, where no coordinates are published, the Incheon FIR boundary follows the Natural Earth border as an approximation.',[['Natural Earth',NE]]],
['7 Other public information','ICAO standards and public material from authorities, airports and airlines, as well as press releases, are summarised with their sources. We do not reproduce text or figures verbatim.'],
['8 Practice data','Flight numbers, registrations, weights, fuel figures and NOTAMs used in practice material are fictitious and do not describe real flights or companies.'],
['9 Contact','If you find an error in a source or in our content, please tell us through the About page and we will correct it.']]}};
window.render=function(l){var t=T[l],E=window.SITE_ESC;document.getElementById('h1').textContent=t.h1;document.getElementById('hp').textContent=t.hp;document.getElementById('dr').textContent=t.dr;
 document.getElementById('body').innerHTML=t.body.map(function(a){return '<h3>'+E(a[0])+'</h3><p>'+E(a[1])+'</p>'+(a[2]?'<p>'+a[2].map(function(k){return '<a href="'+E(k[1])+'" target="_blank" rel="noopener">'+E(k[0])+'</a>'}).join('　')+'</p>':'')}).join('');document.title=t.h1+' | '+window.SITE_NAME()};
</script>
