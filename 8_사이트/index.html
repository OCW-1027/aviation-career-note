<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>航空キャリアノート（仮称）― 航空の仕事を、もっと身近に</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Gowun+Dodum&family=Noto+Sans:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
.hero{position:relative;overflow:hidden;background:linear-gradient(170deg,#8cc8f5 0%,#2F8FE0 70%);color:#fff;border-radius:26px;padding:44px 30px 36px}
.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.25;margin:0 0 12px}
.hero p{max-width:56ch;margin:0 0 22px;font-size:17px;opacity:.96}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.cta a{text-decoration:none;border-radius:14px;padding:12px 20px;font-weight:700}
.cta .pri{background:#fff;color:#1d5fa0}
.cta .sec{border:2px solid #fff;color:#fff}
.hero .sun{position:absolute;right:34px;top:30px;width:70px;height:70px;border-radius:50%;background:#FFE08A;opacity:.9}
.hero .cloud{position:absolute;right:70px;top:78px;width:150px;height:38px;border-radius:30px;background:#fff;opacity:.85}
.hero .cloud::before{content:"";position:absolute;left:30px;top:-22px;width:70px;height:50px;border-radius:50%;background:#fff}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:26px;font-size:14px}
.stats b{display:block;font-size:26px;font-family:'Zen Maru Gothic',sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.pass{display:grid;grid-template-columns:1fr 92px;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--bg)}
.pass .main{padding:14px 16px}
.pass .who{font-size:12px;color:var(--sub)}
.pass b{display:block;font-size:17px;margin:2px 0 4px;font-family:'Zen Maru Gothic','Gowun Dodum',sans-serif}
.pass .d{font-size:13px;color:var(--sub)}
.pass .stub{border-left:2px dashed var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px}
.pass .stub .code{font-weight:900;font-size:18px;letter-spacing:.04em;color:#1d5fa0}
.pass .stub small{font-size:11px;color:var(--sub)}
.pass:hover{border-color:var(--sky)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tool{text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--card)}
.tool b{display:block;margin-bottom:4px}
.tool span{font-size:13px;color:var(--sub)}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.job{border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.job .co{font-size:12px;color:var(--sub)}
.job b{display:block;margin:2px 0 6px}
.chip{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 10px;margin:2px 4px 0 0}
.sample{font-size:11px;color:#fff;background:var(--warn);border-radius:6px;padding:0 6px;margin-left:6px}
.biz{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border:2px solid var(--sky);border-radius:20px;padding:20px 22px;background:var(--sky2)}
.biz a{text-decoration:none;background:#2477BD;color:#fff;border-radius:12px;padding:10px 18px;font-weight:700}
.more{display:inline-block;margin-top:10px}
@media (max-width:640px){.hero .sun,.hero .cloud{display:none}}
/* 注目の求人（ローリングバナー） */
.jobroll{margin:0 0 18px}
.jr-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 8px}
.jr-head b{font-family:'Zen Maru Gothic','Gowun Dodum',sans-serif;font-size:19px}
.jr-head a{font-size:14px}
.jr-view{position:relative;overflow:hidden;border-radius:20px;border:2px solid var(--sky);background:var(--bg)}
.jr-track{display:flex;transition:transform .5s ease}
@media (prefers-reduced-motion:reduce){.jr-track{transition:none}}
.jr-slide{flex:0 0 100%;min-width:0;display:grid;grid-template-columns:1fr auto;gap:10px 22px;align-items:center;padding:18px 24px 46px;text-decoration:none;color:inherit;border-left:8px solid var(--acc,#2F8FE0);box-sizing:border-box}
.jr-slide .co{font-size:13px;color:var(--sub)}
.jr-slide h3{margin:4px 0 8px;font-size:clamp(18px,2.6vw,24px);line-height:1.35;border:0;padding:0}
.jr-slide .wage{margin-top:6px;font-weight:700;color:#1d5fa0}
.jr-slide .go{background:#2477BD;color:#fff;border-radius:12px;padding:10px 18px;font-weight:700;white-space:nowrap}
.jr-ctl{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;align-items:center;gap:8px;pointer-events:none}
.jr-ctl button{pointer-events:auto;cursor:pointer;border:0;background:transparent;padding:6px;line-height:0}
.jr-ctl .dot{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.jr-ctl button.on .dot{background:var(--sky);width:22px;border-radius:6px}
.jr-ctl .arw{font-size:18px;line-height:1;color:var(--sub);padding:2px 8px}
@media (max-width:640px){.jr-slide{grid-template-columns:1fr;padding:16px 18px 46px}.jr-slide .go{justify-self:start}}
/* ヒーローを小さく、注目の求人を大きく */
.hero{padding:24px 28px 22px;border-radius:22px}
.hero h1{font-size:clamp(22px,3.4vw,32px);margin:0 0 6px}
.hero p{font-size:15px;margin:0 0 14px;max-width:70ch}
.hero .cloud{display:none}.hero .sun{width:46px;height:46px;top:22px;right:28px}
.hero .bottom{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:center}
.hero .cta a{padding:9px 16px}
.stats{margin-top:0;gap:18px;font-size:13px}.stats b{display:inline;font-size:20px;margin-right:4px}
.jobroll{margin:20px 0 8px}
.jr-slide{grid-template-columns:minmax(0,40%) 1fr;gap:0;padding:0;min-height:290px;align-items:stretch;border-left:0}
/* 矢印と点は、左の絵に重ならないよう右の文字の側に置く（狭い画面では下の中央） */
.jr-ctl{left:40%;justify-content:flex-start;padding-left:28px}
.jr-pic{background:var(--sky2) center/cover no-repeat;min-height:290px}
.jr-body{padding:28px 34px 62px;min-width:0;box-shadow:inset 6px 0 0 var(--acc,#2F8FE0)}
.jr-body .go{display:inline-block;margin-top:16px}
.jr-logo{height:26px;width:auto;vertical-align:middle;margin-right:8px}
.jr-slide h3{font-size:clamp(22px,3.2vw,32px);margin:6px 0 12px}
.jr-slide .desc{margin:12px 0 0;color:var(--sub);font-size:15px;max-width:62ch}
.jr-slide .go{padding:14px 26px;font-size:17px}
@media (max-width:640px){.hero{padding:20px 20px 18px}.jr-ctl{left:0;padding-left:0;justify-content:center}.jr-slide{grid-template-columns:1fr;min-height:0}.jr-pic{min-height:170px}.jr-body{padding:18px 20px 54px;box-shadow:inset 0 6px 0 var(--acc,#2F8FE0)}.jr-slide .desc{font-size:14px}}
/* 滑走路の絵（右側）。文字はその上に重ねる */
.hero-art{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.hero>*:not(.hero-art){position:relative;z-index:1}
@media (max-width:640px){.hero-art{opacity:.32}.hero-art .ra-sun,.hero-art .ra-cloud{display:none}}
</style>
</head>

  Array.prototype.forEach.call($('jrTrack').children,function(a,k){var on=k===cur;a.setAttribute('aria-hidden',on?'false':'true');a.tabIndex=on?0:-1;if(on)a.removeAttribute('inert');else a.setAttribute('inert','')})}
 function play(){clearInterval(timer);timer=null;if(n>1&&!reduce&&!stopped)timer=setInterval(function(){if(!hold&&!document.hidden)show(cur+1)},6000);lbl()}
 window.JR={init:function(len){n=len;if(cur>=n)cur=0;show(cur);play();
  Array.prototype.forEach.call($('jrCtl').querySelectorAll('button'),function(b){b.onclick=function(){if(b.hasAttribute('data-p')){stopped=!stopped;play();return}if(b.hasAttribute('data-i'))show(+b.getAttribute('data-i'));else show(cur+(+b.getAttribute('data-d')));play()}})}};
 document.addEventListener('DOMContentLoaded',function(){var v=$('jrView'),x0=null;if(!v)return;
  v.addEventListener('mouseenter',function(){hold=true});v.addEventListener('mouseleave',function(){hold=false});

  v.addEventListener('focusin',function(e){if(e.target&&e.target.id==='jrPP')return;if(!stopped){stopped=true;play()}});
  v.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;hold=true},{passive:true});
  v.addEventListener('touchend',function(e){if(x0!==null){var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40){show(cur+(dx<0?1:-1));play()}}x0=null;hold=false},{passive:true});});
