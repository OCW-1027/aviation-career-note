var T={ja:{h1:'このサイトについて',hp:'このサイトをつくった理由、方針、運営者について。',
body:'<h2>このサイトをつくった理由</h2><p class="why-lead">空の知識は、人から人へ受け継がれる</p><p>航空の現場には、教科書に載らない知識があります。夜明け前のカウンター、大雪で運用が止まった滑走路のそば、最後のお客様を乗せるために駆けたゲート――そうした現場で身につけた判断と経験です。航空の現場は専門性が高く、限られた人しか触れることのできない世界です。そのため、こうした貴重な知識は、なかなか外へ伝わってきませんでした。</p><p>そして今、知識が人から人へ受け継がれる流れは、少しずつ細くなりつつあります。自分の持つ情報や技術を人に渡すことをためらう空気の中で、後輩を育てることは年々難しくなっています。大手の航空会社では一つの分野に長くとどまるため、ほかの分野に触れる機会が少なく、LCCでは限られた人数で多くの業務をこなすため、じっくり教える時間が足りません。幅広い業務を、限られた知識と時間で支えざるを得ない現場が増えています。</p><p>航空の需要はこれからも伸びていきます。航空会社、空港、ハンドリング会社の働き方も大きく変わるでしょう。より速く、より便利な方向へ変わっていくはずですが、過去を知らない人に未来を設計することはできません。今日の手順がなぜこの形になったのかを知る人だけが、明日の手順をよりよいものに変えられます。</p><p>だから、このサイトをつくりました。</p><p>空を目指す小学生・中学生・高校生、そして大学生にとっては、航空の過去を知り、未来に備える最初の教科書に。航空会社やハンドリング会社に入ったばかりの新入社員にとっては、基礎を固め、自分の分野で一歩先へ進むための足場に。そして、さまざまな事情で専門の教育機関の門をたたくことが難しい方にとっては、独学でこの業界を目指す方が、誰にも引けを取らない知識を身につけ、自信を持って活躍できるよう、いつでも手元で参照できる案内書に。そうなることを願っています。</p><p>このサイトには、航空とは直接関係のないように見える内容も多くあります。人事・総務・財務、会社の数字の読み方、外国での暮らし。どれも、私が社会に出て働く中で、どの分野で働くとしても、そして人生を生きていくうえでも必要だと感じてきたことです。</p><p>特に、財務と会計です。私が見てきた限り、米国や欧州では、大学を卒業するころには、こうした知識を自然に身につけている人が多くいます。けれど日本や韓国では、関連する分野を専攻するか、自分から関心を持たない限り、触れる機会がほとんどありません。お金がどう流れるかを知っていることは、会社で働くときにも、自分の暮らしを組み立てるときにも、大きな力になります。</p><p>このサイトを訪れる方の多くは、航空業界を夢見てやって来るでしょう。その夢がかなうことを、心から願っています。けれど、もし何かの理由で夢がかなわなかったとしても、ここで学んだ人事・総務・財務の知識が、それぞれの人生の種となり、いつかどこかで芽を出してくれることを願っています。</p><p>一人が学んだことが次の人へとつながるとき、航空業界の未来も、一人ひとりの人生も、少しずつ明るくなると信じています。</p><h2>このサイトの方針</h2><ul class="values"><li><b>手順より「なぜ」を伝える</b>マニュアルの手順だけでなく、その手順がなぜ生まれ、現場でどう判断するのかまで書きます。</li><li><b>過去を記録する</b>制度ややり方が変わっても、なぜそうしてきたのかを残し、次の世代がよりよい方法をつくれるようにします。</li><li><b>根拠を示し、誤りはすぐ直す</b>法令と当局の公式の資料で確かめ、出典と確認時期を明示します。誤りに気づいたら隠さずに直します。</li><li><b>日本と韓国の現場をつなぐ</b>二つの国の制度と実務を並べて示し、日本語・韓国語・英語で同じ内容を届けます。</li></ul><h2>運営者</h2><div class="tbl"><b>運営会社</b><span>（会社名を記載）</span><b>所在地</b><span>（所在地を記載）</span><b>代表者</b><span>（氏名を記載）</span><b>事業の内容</b><span>教育コンテンツの制作・求人情報の掲載 ほか</span><b>お問い合わせ</b><span>（メールアドレスを記載）</span></div><div class="draft">※ 運営者の情報は公開前に記入してください。</div>'},
ko:{h1:'이 사이트에 대해',hp:'이 사이트를 만든 이유와 원칙, 그리고 운영자에 대해.',
body:'<h2>이 사이트를 만든 이유</h2><p class="why-lead">하늘의 지식은, 사람을 따라 흐른다</p><p>항공 현장에는 교과서에 실리지 않는 지식이 있습니다. 새벽의 카운터에서, 폭설로 멈춘 활주로 옆에서, 마지막 한 명의 승객을 태우기 위해 뛰던 게이트에서 몸으로 익힌 판단과 경험입니다. 항공사는 특수한 환경에서 한정된 사람들만 일하는 곳이기에, 이 귀한 지식은 좀처럼 바깥으로 전해지지 않았습니다.</p><p>그리고 지금, 그 흐름이 점점 가늘어지고 있습니다. 자신이 가진 정보와 기술을 나누기를 꺼리는 분위기 속에서 후배를 길러 내기는 갈수록 어려워졌습니다. 대형 항공사에서는 한 분야에 오래 머물러 다른 분야를 볼 기회가 적고, LCC에서는 적은 인원으로 많은 일을 해내느라 제대로 가르칠 시간이 부족합니다. 넓은 일을 얕은 지식으로 버텨 내는 현장이 늘고 있습니다.</p><p>항공 수요는 앞으로도 커질 것입니다. 항공사와 공항, 조업사의 일하는 방식도 크게 달라질 것입니다. 더 빠르고 편리한 쪽으로 바뀌겠지만, 과거를 모르는 사람은 미래를 설계할 수 없습니다. 오늘의 절차가 왜 이렇게 만들어졌는지 아는 사람만이 내일의 절차를 더 낫게 바꿀 수 있습니다.</p><p>그래서 이 사이트를 만들었습니다.</p><p>하늘을 꿈꾸는 초·중·고등학생과 대학생에게는, 항공의 과거를 알고 미래를 준비하는 첫 교과서가 되기를 바랍니다. 이제 막 항공사와 조업사에 들어선 신입 사원에게는, 기초를 단단히 다지고 자신의 분야에서 한 걸음 더 나아가는 발판이 되기를 바랍니다. 그리고 여러 사정으로 전문 교육기관의 문을 두드리기 어려운 분들께는, 혼자 공부해 이 업계에 발을 들인 당신이 누구보다 깊은 지식을 갖추고 당당히 활약할 수 있도록 곁에 두는 안내서가 되기를 바랍니다.</p><p>이 사이트에는 항공과 직접 관계가 없어 보이는 내용도 많습니다. 인사·총무·재무, 회사의 숫자를 읽는 법, 다른 나라에서의 생활. 모두 제가 사회생활을 하며, 어느 분야에서 일하든 그리고 인생을 살아가는 데에도 꼭 필요하다고 느낀 것들입니다.</p><p>특히 재무와 회계가 그렇습니다. 제가 지켜본 바로는 미국이나 유럽에서는 대학을 졸업할 때쯤이면 이런 지식을 자연스럽게 익히는 사람이 많습니다. 하지만 한국과 일본에서는 관련 전공을 하거나 스스로 관심을 갖지 않으면 접할 기회가 거의 없습니다. 돈이 어떻게 흐르는지 아는 것은 회사에서 일할 때도, 자신의 생활을 꾸려 갈 때도 큰 힘이 됩니다.</p><p>이 사이트를 찾는 분들 대부분은 항공업계를 꿈꾸며 오실 것입니다. 그 꿈이 이루어지기를 진심으로 바랍니다. 하지만 혹시 어떤 이유로 꿈을 이루지 못하더라도, 여기서 배운 인사·총무·재무의 지식이 각자의 인생에 씨앗이 되어 언젠가 어디선가 싹을 틔우기를 바랍니다.</p><p>한 사람이 배운 것이 다음 사람에게 이어질 때, 항공업계의 미래도, 한 사람 한 사람의 인생도 조금씩 밝아진다고 믿습니다.</p><h2>이 사이트의 원칙</h2><ul class="values"><li><b>절차보다 「왜」를 전합니다</b>매뉴얼의 순서만이 아니라, 그 절차가 왜 생겼고 현장에서 어떻게 판단하는지까지 씁니다.</li><li><b>과거를 기록합니다</b>제도와 방식이 바뀌어도 왜 그렇게 해 왔는지를 남겨, 다음 세대가 더 나은 방식을 만들 수 있게 합니다.</li><li><b>근거를 밝히고, 틀리면 바로 고칩니다</b>법령과 당국의 공식 자료로 확인하고, 출처와 확인한 시기를 적습니다. 잘못을 발견하면 숨기지 않고 고칩니다.</li><li><b>한국과 일본의 현장을 잇습니다</b>두 나라의 제도와 실무를 나란히 보여 주고, 일본어·한국어·영어로 같은 내용을 전합니다.</li></ul><h2>운영자</h2><div class="tbl"><b>운영 회사</b><span>(회사명 기재)</span><b>소재지</b><span>(소재지 기재)</span><b>대표자</b><span>(성명 기재)</span><b>사업 내용</b><span>교육 콘텐츠 제작·구인 정보 게재 외</span><b>문의</b><span>(메일 주소 기재)</span></div><div class="draft">※ 운영자 정보는 공개 전에 기입하세요.</div>'},
en:{h1:'About this site',hp:'Why this site exists, our principles, and who runs it.',
body:'<h2>Why this site exists</h2><p class="why-lead">Knowledge of the skies travels from person to person</p><p>There is knowledge in aviation that no textbook contains: the judgment and experience learned at a check-in counter before dawn, beside a runway closed by heavy snow, at a gate where someone ran to get the last passenger on board. Airlines are a special world in which a limited number of people work, so this valuable knowledge has rarely travelled beyond it.</p><p>And today that flow is growing thinner. Where people hesitate to hand on what they know, bringing up the next generation grows harder every year. At major airlines, people stay in one field for years and seldom see the others; at low-cost carriers, a small team handles a great deal of work and there is little time to teach properly. More and more, wide-ranging work rests on shallow knowledge.</p><p>Demand for air travel will keep growing, and the way airlines, airports and ground handlers work will change a great deal. It will become faster and more convenient, but no one who does not know the past can design the future. Only those who know why today’s procedures took the shape they did can make tomorrow’s better.</p><p>That is why I built this site.</p><p>For school and university students who dream of the skies, I hope it will be a first textbook for learning aviation’s past and preparing for its future. For new employees who have just joined an airline or a ground handler, a foothold for building solid foundations and going a step further in their own field. And for those who, for whatever reason, cannot knock on the door of a specialist training school, a guide to keep close at hand, so that you, having found your way into this industry through your own study, can gain knowledge as deep as anyone’s and take your place with confidence.</p><p>You will also find a good deal here that seems to have little to do with aviation: HR, administration and finance, how to read a company’s numbers, how to live in another country. These are all things I came to see, through my working life, as necessary in any field, and in life itself.</p><p>Finance and accounting above all. From what I have seen, in the United States and Europe many people pick up this kind of knowledge naturally by the time they graduate from university. In Japan and Korea, unless you study a related subject or take an interest on your own, you have almost no chance to come across it. Knowing how money flows is a real strength, both at work and in running your own life.</p><p>Most people who come to this site will come with a dream of working in aviation, and I sincerely hope that dream comes true. But if, for whatever reason, it does not, I hope that what you learn here about HR, administration and finance will become a seed in your own life, and one day put out shoots somewhere.</p><p>I believe that when what one person has learned passes on to the next, the future of aviation, and each person’s own life, grows a little brighter.</p><h2>Our principles</h2><ul class="values"><li><b>The “why”, not just the procedure</b>We explain not only the steps in the manual but why each procedure came to exist and how people make judgments on the front line.</li><li><b>Keeping a record of the past</b>Even as rules and methods change, we record why things were done the way they were, so the next generation can build something better.</li><li><b>Showing our sources, and correcting mistakes at once</b>We check against the law and official sources, and state where information comes from and when it was checked. When we find an error, we fix it openly.</li><li><b>Connecting Japan and Korea</b>We set the rules and practice of both countries side by side, in Japanese, Korean and English.</li></ul><h2>Who runs it</h2><div class="tbl"><b>Company</b><span>(to be added)</span><b>Address</b><span>(to be added)</span><b>Representative</b><span>(to be added)</span><b>Business</b><span>Producing educational content and publishing job listings</span><b>Contact</b><span>(email address to be added)</span></div><div class="draft">* Operator details are to be filled in before launch.</div>'}};

</script>
