<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>誤りを知らせる</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Gowun+Dodum&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
.rp{border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:14px 0;background:#fff}
.rp label{display:block;font-weight:700;margin:14px 0 6px}
.rp label small{font-weight:400;color:#6B7785;margin-left:6px}
.rp input,.rp textarea{width:100%;box-sizing:border-box;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.rp textarea{min-height:96px;resize:vertical}
.rp .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.rp .b{font:700 14px inherit;font-family:inherit;border-radius:12px;padding:11px 18px;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:inherit}
.rp .b.pri{background:#1d5fa0;border-color:#1d5fa0;color:#fff}
.rp .msg{font-size:13.5px;color:#2E7D4F}
.rp .muted{color:#6B7785;font-size:13.5px;line-height:1.7}
</style>
</head>
<body data-page="report">
<header class="topbar" id="siteTop"></header>
<div class="wrap doc">
<section class="page-hero"><h1 id="h1"></h1><p id="hp"></p></section>
<div id="body"></div>
</div>
<footer class="site-foot" id="siteFoot"></footer>
<script>
/* 誤りを知らせる（2026.10 新規）— 各レッスンの下の「誤りを知らせる」から開く。
   ★ 送り先のメールアドレスは、下の1行に入れるだけで使えるようになります。空のときは「文面をコピー」だけが出ます。 */
var REPORT_MAIL='';

var T={
ja:{h1:'誤りを知らせる',hp:'内容の誤りや古い情報に気づいたら、お知らせください。確かめたうえで直します。',les:'どのレッスン',where:'どこ',whered:'見出しや文の一部',what:'何が違うか',fix:'正しい情報・出典',fixd:'任意',send:'メールで送る',copy:'文面をコピー',copied:'コピーしました',prep:'送り先の準備中です。文面をコピーして保存しておいてください。',need:'「何が違うか」を書いてください。',sub:'【誤りの連絡】',note:'お名前やメールアドレスは書かなくてもかまいません。返信が必要なときだけ、メールの本文に書いてください。'},
ko:{h1:'오류 신고',hp:'내용의 오류나 오래된 정보를 발견하면 알려 주세요. 확인한 뒤 고치겠습니다.',les:'어느 레슨',where:'어디',whered:'제목이나 문장 일부',what:'무엇이 틀렸는지',fix:'맞는 정보·출처',fixd:'선택',send:'메일로 보내기',copy:'내용 복사',copied:'복사했습니다',prep:'받는 곳을 준비 중입니다. 내용을 복사해 저장해 두세요.',need:'‘무엇이 틀렸는지’를 적어 주세요.',sub:'[오류 신고]',note:'이름이나 메일 주소는 적지 않아도 됩니다. 답장이 필요할 때만 메일 본문에 적어 주세요.'},
en:{h1:'Report an error',hp:'If you find an error or out-of-date information, please let us know. We will check it and correct it.',les:'Which lesson',where:'Where',whered:'heading or part of the sentence',what:'What is wrong',fix:'Correct information or source',fixd:'optional',send:'Send by email',copy:'Copy the text',copied:'Copied',prep:'The address is being set up. Please copy the text and keep it for now.',need:'Please fill in “What is wrong”.',sub:'[Error report] ',note:'You do not need to give your name or email address. Add them in the email only if you would like a reply.'}};
var L='ja',Q=new URLSearchParams(location.search),LES=Q.get('l')||'';
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function text(t){return t.les+': '+$('rl').value+'\n'+t.where+': '+$('rw').value+'\n'+t.what+': '+$('rt').value+'\n'+t.fix+': '+$('rf').value+'\n'}
window.render=function(l){L=l;var t=T[l]||T.ja,keep={};['rl','rw','rt','rf'].forEach(function(k){if($(k))keep[k]=$(k).value});
 $('h1').textContent=t.h1;$('hp').textContent=t.hp;document.title=t.h1+' | '+window.SITE_NAME();
 $('body').innerHTML='<div class="rp"><label for="rl">'+esc(t.les)+'</label><input id="rl" value="'+esc(keep.rl!=null?keep.rl:LES)+'">'+
  '<label for="rw">'+esc(t.where)+'<small>'+esc(t.whered)+'</small></label><input id="rw">'+
  '<label for="rt">'+esc(t.what)+'</label><textarea id="rt"></textarea>'+
  '<label for="rf">'+esc(t.fix)+'<small>'+esc(t.fixd)+'</small></label><textarea id="rf"></textarea>'+
  '<div class="row">'+(REPORT_MAIL?'<button class="b pri" id="rs" type="button">'+esc(t.send)+'</button>':'')+'<button class="b'+(REPORT_MAIL?'':' pri')+'" id="rc" type="button">'+esc(t.copy)+'</button><span class="msg" id="rm"></span></div>'+
  '<p class="muted">'+esc(REPORT_MAIL?t.note:t.prep)+'</p></div>';
 ['rw','rt','rf'].forEach(function(k){if(keep[k])$(k).value=keep[k]});
 if($('rs'))$('rs').onclick=function(){if(!$('rt').value.trim()){$('rm').textContent=t.need;return}location.href='mailto:'+REPORT_MAIL+'?subject='+encodeURIComponent(t.sub+$('rl').value)+'&body='+encodeURIComponent(text(t))};
 $('rc').onclick=function(){if(!$('rt').value.trim()){$('rm').textContent=t.need;return}var v=text(t);var ok=function(){$('rm').textContent=t.copied};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(ok,function(){fallback(v);ok()});else{fallback(v);ok()}};
};
function fallback(v){var a=document.createElement('textarea');a.value=v;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}
</script>
<script src="assets/site.js"></script>
</body>
</html>
