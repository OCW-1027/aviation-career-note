<style>
/* 内 学習プラン（2026.10）：学び方の図解・目的の選択・ペース・講座の組み立て・進み具合 */
.pl-hero{max-width:var(--max);margin:auto;padding:40px 24px 0}
.pl-hero .in{background:linear-gradient(145deg,#0a1b2e,#12314f);color:#fff;border-radius:24px;padding:42px;box-shadow:0 25px 60px rgba(9,28,47,.15)}
.pl-hero h1{font-size:clamp(34px,5vw,56px);margin:10px 0 14px}
.pl-hero p{color:#c3d0dc;max-width:760px;margin:0}
.pl-hero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn.ghost{border-color:rgba(255,255,255,.4);color:#fff;background:transparent}.btn.ghost:hover{border-color:#fff}
.btn.line{border-color:var(--line);background:#fff;color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:13px}
.pl-sec{max-width:var(--max);margin:auto;padding:56px 24px 8px}
.pl-sec>h2{font-size:clamp(26px,3.4vw,38px);margin:6px 0 8px}
.pl-sec>.lead{color:var(--muted);max-width:760px;margin:0 0 24px}
/* 学び方：6つの手順の輪 */
.cyc{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;counter-reset:c}
.cyc .st{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 16px 16px;animation:cy 12s infinite}
.cyc .st:nth-child(1){animation-delay:0s}.cyc .st:nth-child(2){animation-delay:2s}.cyc .st:nth-child(3){animation-delay:4s}
.cyc .st:nth-child(4){animation-delay:6s}.cyc .st:nth-child(5){animation-delay:8s}.cyc .st:nth-child(6){animation-delay:10s}
@keyframes cy{0%,14%{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,105,224,.15)}17%,100%{border-color:var(--line);box-shadow:none}}
.cyc .st:not(:last-child):after{content:'→';position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:#9fb0c2;font-weight:900}
.cyc .no{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-weight:900;font-size:13px;align-items:center;justify-content:center}
.cyc b{display:block;margin:10px 0 4px;font-size:15px}
.cyc span{display:block;color:var(--muted);font-size:13px;line-height:1.5}
.cyc em{display:block;margin-top:10px;font-style:normal;font-size:12px;color:#0f3558;background:var(--soft);border-radius:8px;padding:7px 8px;line-height:1.45}
.loop{margin-top:10px;font-size:13px;color:var(--muted);text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
.box h3{margin:0 0 4px;font-size:18px}
.box .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
/* 1回20分の流れ */
.tbar{display:flex;border-radius:10px;overflow:hidden;height:38px}
.tbar div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden}
.tlist{margin:12px 0 0;padding:0;list-style:none;font-size:13px}
.tlist li{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.tlist li i{font-style:normal;font-weight:900;color:#0f3558;min-width:64px}
/* 1週間 */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{border-radius:10px;padding:10px 4px;text-align:center;font-size:12px;border:1px solid var(--line);background:#fff;min-height:84px}
.week b{display:block;font-size:13px;margin-bottom:6px}
.week .les{background:#eaf2fd;border-color:#bcd5f7}.week .prc{background:#fff4d6;border-color:#f0d58a}.week .rev{background:#eaf7f0;border-color:#a9dcc0}.week .off{color:#9aa6b2}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.tips{margin:18px 0 0;padding-left:20px;color:#34404c;font-size:14px}.tips li{margin:6px 0}
/* 作る */
.stp{display:flex;align-items:center;gap:10px;margin:28px 0 12px}
.stp .no{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-weight:900;align-items:center;justify-content:center}
.stp h3{margin:0;font-size:19px}
.goals{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.goal{background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px;text-align:left;cursor:pointer;transition:.15s}
.goal:hover{border-color:#9cc0f3}
.goal.on{border-color:var(--blue);background:#f2f7ff}
.goal b{display:block;font-size:15px;margin-bottom:4px}
.goal span{display:block;font-size:12.5px;color:var(--muted);line-height:1.5}
.goal small{display:block;margin-top:8px;font-weight:800;color:var(--blue);font-size:12px}
.pace{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.pace label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:9px 14px;font-weight:800;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}
.pace input[type=date]{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.est{margin-left:auto;text-align:right}
.est b{display:block;font-size:22px;color:var(--navy)}
.est span{font-size:12px;color:var(--muted)}
.crs{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.crs .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crs .hd b{font-size:15px;flex:1;min-width:180px}
.crs .cnt{font-size:12px;color:var(--muted)}
.crs .tools button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;cursor:pointer;font-weight:800}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;cursor:pointer;color:#5b6b7d}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.addrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.addrow select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:260px;background:#fff}
/* 進み具合 */
.prog{background:var(--navy);color:#fff;border-radius:22px;padding:28px;display:grid;grid-template-columns:1.1fr 1fr;gap:28px}
.prog .big{font-size:44px;font-weight:900;line-height:1}
.bar{height:12px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1ea7b8,#5fd0a8);border-radius:99px;transition:width .4s}
.prog .meta{color:#b8c5d1;font-size:13px}
.next{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:16px}
.next small{color:#9fd8e0;font-weight:800;font-size:12px;letter-spacing:.06em}
.next b{display:block;margin:6px 0 12px;font-size:16px;line-height:1.4}
.wk{margin-top:16px;font-size:13px}.wk ol{margin:6px 0 0;padding-left:18px;color:#dce7f1}.wk li{margin:3px 0}
.wk a{color:#fff;text-decoration:underline}
.acc{margin-top:18px}
.acc details{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.acc summary{cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:12px;list-style:none}
.acc summary::-webkit-details-marker{display:none}
.acc summary b{flex:1}
.mini{width:120px;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.mini i{display:block;height:100%;background:var(--green)}
.acc .pc{font-size:12px;color:var(--muted);min-width:64px;text-align:right}
.lsn{list-style:none;margin:0;padding:0 16px 12px}
.lsn li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--soft);font-size:14px}
.lsn input{margin-top:4px;width:17px;height:17px;accent-color:var(--green)}
.lsn a{flex:1;color:var(--ink)}.lsn a:hover{color:var(--blue)}
.lsn .no{font-weight:800;color:#5b6b7d;min-width:38px}
.lsn li.dn a{color:#7b8792;text-decoration:line-through}
.empty{background:#fff;border:1px dashed #b8c5d1;border-radius:14px;padding:22px;color:var(--muted);text-align:center}
.foot-note{color:var(--muted);font-size:13px;margin-top:14px}
.danger{color:#b42318}
@media (max-width:980px){.cyc{grid-template-columns:repeat(3,1fr)}.cyc .st:nth-child(3):after{display:none}.goals{grid-template-columns:repeat(2,1fr)}.two,.prog{grid-template-columns:1fr}}
@media (max-width:560px){.cyc{grid-template-columns:1fr 1fr}.cyc .st:after{display:none}.goals{grid-template-columns:1fr}.pl-hero .in{padding:28px}.est{margin-left:0;text-align:left}.week{gap:3px}.week div{font-size:10.5px;padding:8px 2px}.addrow select{min-width:0;width:100%}}
@media (prefers-reduced-motion:reduce){.cyc .st{animation:none}}
</style>
</head>

var IDX=[];try{IDX=(window.SEARCH_INDEX&&SEARCH_INDEX.l)||[]}catch(e){}
var SER={};(window.SERIES||[]).forEach(function(s){SER[s.code]=s});
function lessonsOf(code){var lc=code.toLowerCase();return IDX.filter(function(x){return x[0]===lc})}
function partsOf(code){var p=[];lessonsOf(code).forEach(function(x){var k=x[1].split('-')[0];if(p.indexOf(k)<0)p.push(k)});return p}
function sel(step){var L=lessonsOf(step.c);if(!step.p&&!step.n)return L;return L.filter(function(x){var k=x[1].split('-')[0];return (step.p&&step.p.indexOf(k)>=0)||(step.n&&step.n.indexOf(x[1])>=0)})}
function countOf(step){if(IDX.length)return sel(step).length;var s=SER[step.c];return s?(s.n||0):0}
function load(k,d){try{var v=JSON.parse(localStorage.getItem(k)||'null');return v||d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var plan=load(KP,null),done=load(KD,{});
function today(){var d=new Date();return d.toISOString().slice(0,10)}
function newPlan(id){var r=ROUTES.filter(function(x){return x.id===id})[0];return {v:1,goal:id,days:(plan&&plan.days)||5,per:(plan&&plan.per)||1,start:(plan&&plan.start)||today(),steps:r.st.map(function(s){return {c:s[0],p:s[1]&&s[1].p?s[1].p.slice():null,n:s[1]&&s[1].n?s[1].n.slice():null}})}}
function all(){var a=[];if(!plan)return a;plan.steps.forEach(function(s){sel(s).forEach(function(x){a.push(x)})});return a}
function key(x){return x[0]+'/'+x[1]}
function finishDate(n){if(!plan)return '';var days=plan.days,per=plan.per,need=Math.ceil(n/per),d=new Date(plan.start+'T00:00:00'),c=0,guard=0;
 var wk=pattern(days);while(c<need&&guard<3000){var w=(d.getDay()+6)%7;if(wk[w]==='les')c++;if(c<need)d.setDate(d.getDate()+1);guard++}return d.toISOString().slice(0,10)}
/* 1週間：学習日はレッスン、7日のうち空いた日に練習と復習（5日なら土=練習・日=復習） */
function pattern(days){var p=['off','off','off','off','off','off','off'],map={2:[1,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,3,4],6:[0,1,2,3,4,5],7:[0,1,2,3,4,5,6]};(map[days]||map[5]).forEach(function(i){p[i]='les'});
 var free=[];for(var i=6;i>=0;i--)if(p[i]==='off')free.push(i);if(free.length){p[free[0]]='rev'}if(free.length>1){p[free[1]]='prc'}if(days===7){p[6]='les'}return p}
function fmt(s,o){return s.replace(/\{(\w+)\}/g,function(m,k){return o[k]})}

/* ── 描画 ── */
var L='ja';
function $(i){return document.getElementById(i)}
function E(s){return window.ACN?ACN.E(s):String(s)}
function title(code){var s=SER[code];return s?s[L][1]:code}
function lurl(x){return '../'+L+'/'+x[0]+'/'+x[1]+'/'}
window.PAGE_RENDER=function(l){L=l;var t=T[l];
 ['h1','hp','go1','go2','hh','hl','loop','h20','s20','hwk','swk','hm','lm','s1','s2','s3','fn'].forEach(function(k){if($(k))$(k).textContent=t[k]});
 $('cyc').innerHTML=t.cyc.map(function(c,i){return '<div class="st"><span class="no">'+(i+1)+'</span><b>'+E(c[0])+'</b><span>'+E(c[1])+'</span><em>'+E(c[2])+'</em></div>'}).join('');
 var tc=['#5B6B7D','#1769e0','#E08A2E','#2C8C8C','#2E9B5F'],tw=[2,10,3,2,3];
 $('tbar').innerHTML=t.tl.map(function(x,i){return '<div style="flex:'+tw[i]+';background:'+tc[i]+'">'+E(x[1])+'</div>'}).join('');
 $('tlist').innerHTML=t.tl.map(function(x){return '<li><i>'+E(x[0])+'</i><span>'+E(x[2])+'</span></li>'}).join('');
 $('tips').innerHTML=t.tips.map(function(x){return '<li>'+E(x)+'</li>'}).join('');
 drawWeek();drawGoals();drawPace();drawCourses();drawProgress()};
function drawWeek(){var t=T[L],p=pattern(plan?plan.days:5);
 $('week').innerHTML=p.map(function(k,i){return '<div class="'+k+'"><b>'+E(t.wd[i])+'</b>'+E(t.cl[k])+(k==='les'&&plan?'<br>×'+plan.per:'')+'</div>'}).join('');
 $('leg').innerHTML=[['#eaf2fd',0],['#fff4d6',1],['#eaf7f0',2],['#fff',3]].map(function(x){return '<span><i style="background:'+x[0]+';border:1px solid #c8d3de"></i>'+E(t.leg[x[1]])+'</span>'}).join('')}
function drawGoals(){var t=T[L];$('goals').innerHTML=ROUTES.map(function(r){var g=t.goals[r.id],n=0;r.st.forEach(function(s){n+=countOf({c:s[0],p:s[1]&&s[1].p,n:s[1]&&s[1].n})});
 return '<button type="button" class="goal'+(plan&&plan.goal===r.id?' on':'')+'" data-g="'+r.id+'"><b>'+E(g[0])+'</b><span>'+E(g[1])+'</span>'+(r.id!=='free'?'<small>'+E(fmt(t.nles,{n:n}))+'</small>':'')+'</button>'}).join('');
 Array.prototype.forEach.call($('goals').querySelectorAll('.goal'),function(b){b.onclick=function(){plan=newPlan(b.getAttribute('data-g'));save(KP,plan);PAGE_RENDER(L);var m=$('s2');if(m)m.scrollIntoView({behavior:'smooth',block:'center'})}})}
function drawPace(){var t=T[L],p=plan||{days:5,per:1,start:today()},n=all().length,left=all().filter(function(x){return !done[key(x)]}).length;
 var w=n?Math.ceil(Math.ceil(n/p.per)/p.days):0;
 $('pace').innerHTML='<div><label>'+E(t.days)+'</label><span class="seg" data-k="days">'+[2,3,5,7].map(function(v){return '<button type="button" data-v="'+v+'" class="'+(p.days===v?'on':'')+'">'+v+'</button>'}).join('')+'</span></div>'+
 '<div><label>'+E(t.per)+'</label><span class="seg" data-k="per">'+[1,2,3].map(function(v){return '<button type="button" data-v="'+v+'" class="'+(p.per===v?'on':'')+'">'+v+'</button>'}).join('')+'</span></div>'+
 '<div><label for="sd">'+E(t.start)+'</label><input type="date" id="sd" value="'+E(p.start)+'"></div>'+
 '<div class="est">'+(plan&&n?'<span>'+E(t.total)+' '+E(fmt(t.nles,{n:n}))+' · '+E(fmt(t.wks,{w:w}))+'</span><b>'+E(t.fin)+' '+E(finishDate(left||1))+'</b>':'')+'</div>';
 Array.prototype.forEach.call($('pace').querySelectorAll('.seg button'),function(b){b.onclick=function(){if(!plan)plan=newPlan('free');plan[b.parentNode.getAttribute('data-k')]=+b.getAttribute('data-v');save(KP,plan);PAGE_RENDER(L)}});
 $('sd').onchange=function(){if(!plan)plan=newPlan('free');plan.start=this.value||today();save(KP,plan);PAGE_RENDER(L)}}
function drawCourses(){var t=T[L];
 if(!plan||!plan.steps.length){$('crs').innerHTML='<div class="empty">'+E(t.empty)+'</div>'}
 else $('crs').innerHTML=plan.steps.map(function(s,i){var parts=partsOf(s.c),n=countOf(s);
  var chips=parts.length?'<div class="chips"><button type="button" class="chip'+(!s.p&&!s.n?' on':'')+'" data-a="all" data-i="'+i+'">'+E(t.all)+'</button>'+parts.map(function(k){var on=!s.p&&!s.n||(s.p&&s.p.indexOf(k)>=0);return '<button type="button" class="chip'+(on?' on':'')+'" data-a="p" data-k="'+k+'" data-i="'+i+'">Part '+E(k)+'</button>'}).join('')+'</div>'+(s.n?'<div class="hint">+ '+E(s.n.join(', '))+'</div>':''):'';
  return '<div class="crs"><div class="hd"><b>'+(i+1)+'. '+E(title(s.c))+'</b><span class="cnt">'+E(fmt(t.nles,{n:n}))+'</span><span class="tools"><button type="button" data-a="up" data-i="'+i+'" title="'+E(t.up)+'">↑</button> <button type="button" data-a="dn" data-i="'+i+'" title="'+E(t.down)+'">↓</button> <button type="button" data-a="rm" data-i="'+i+'">'+E(t.del)+'</button></span></div>'+chips+'</div>'}).join('')+(IDX.length?'<p class="hint">'+E(t.hint)+'</p>':'<p class="hint">'+E(t.noIdx)+'</p>');
 Array.prototype.forEach.call($('crs').querySelectorAll('button[data-a]'),function(b){b.onclick=function(){var i=+b.getAttribute('data-i'),a=b.getAttribute('data-a'),s=plan.steps[i];
  if(a==='up'&&i>0){plan.steps.splice(i-1,0,plan.steps.splice(i,1)[0])}
  else if(a==='dn'&&i<plan.steps.length-1){plan.steps.splice(i+1,0,plan.steps.splice(i,1)[0])}
  else if(a==='rm'){plan.steps.splice(i,1)}
  else if(a==='all'){s.p=null;s.n=null}
  else if(a==='p'){var k=b.getAttribute('data-k'),cur=(!s.p&&!s.n)?partsOf(s.c).slice():(s.p||[]).slice();var j=cur.indexOf(k);if(j>=0)cur.splice(j,1);else cur.push(k);s.p=cur;s.n=null;if(!cur.length){plan.steps.splice(i,1)}}
  save(KP,plan);PAGE_RENDER(L)}});
 var have=plan?plan.steps.map(function(s){return s.c}):[];
 $('addrow').innerHTML='<select id="addsel" aria-label="'+E(t.add)+'"><option value="">'+E(t.addph)+'</option>'+(window.SERIES||[]).filter(function(s){return have.indexOf(s.code)<0&&(IDX.length?lessonsOf(s.code).length:1)}).map(function(s){return '<option value="'+s.code+'">'+E(s[L][1])+'</option>'}).join('')+'</select><button type="button" class="btn primary sm" id="addbtn">'+E(t.add)+'</button>'+(plan?'<button type="button" class="btn line sm danger" id="rst">'+E(t.reset)+'</button>':'');
 $('addbtn').onclick=function(){var v=$('addsel').value;if(!v)return;if(!plan)plan=newPlan('free');plan.steps.push({c:v,p:null,n:null});save(KP,plan);PAGE_RENDER(L)};
 if($('rst'))$('rst').onclick=function(){if(!confirm(T[L].rq))return;plan=null;done={};try{localStorage.removeItem(KP);localStorage.removeItem(KD)}catch(e){}PAGE_RENDER(L)}}
function drawProgress(){var t=T[L],sec=$('progress'),A=all();
 if(!plan||!A.length||!IDX.length){sec.hidden=true;sec.innerHTML='';return}
 sec.hidden=false;var dn=A.filter(function(x){return done[key(x)]}).length,pct=Math.round(dn/A.length*100),rest=A.filter(function(x){return !done[key(x)]}),nx=rest[0];
 var wkN=plan.days*plan.per,wk=rest.slice(0,wkN);

  (wk.length?'<div class="wk"><b>'+E(fmt(t.thisWeek,{n:wk.length}))+'</b><ol>'+wk.map(function(x){return '<li><a href="'+lurl(x)+'">'+E(x[1]+' '+x[L==='ja'?2:L==='ko'?3:4])+'</a> <span style="color:#9fb0c2">· '+E(title(x[0].toUpperCase()))+'</span></li>'}).join('')+'</ol></div>':'')+'</div>'+
  '<div class="next">'+(nx?'<small>'+E(t.next)+'</small><b>'+E(title(nx[0].toUpperCase()))+'<br>'+E(nx[1]+' '+nx[L==='ja'?2:L==='ko'?3:4])+'</b><a class="btn primary" href="'+lurl(nx)+'">'+E(t.open)+'</a>':'<b>'+E(t.allDone)+'</b>')+' <a class="btn ghost" href="#make">'+E(t.edit)+'</a></div></div>';
 h+='<div class="acc">'+plan.steps.map(function(s,i){var ls=sel(s),d=ls.filter(function(x){return done[key(x)]}).length,p=ls.length?Math.round(d/ls.length*100):0;
  return '<details'+(nx&&ls.indexOf(nx)>=0?' open':'')+'><summary><b>'+(i+1)+'. '+E(title(s.c))+'</b><span class="mini"><i style="width:'+p+'%"></i></span><span class="pc">'+d+' / '+ls.length+'</span></summary><ul class="lsn">'+ls.map(function(x){var k=key(x);return '<li class="'+(done[k]?'dn':'')+'"><input type="checkbox" data-k="'+k+'"'+(done[k]?' checked':'')+' aria-label="'+E(t.done)+'"><span class="no">'+E(x[1])+'</span><a href="'+lurl(x)+'">'+E(x[L==='ja'?2:L==='ko'?3:4])+'</a></li>'}).join('')+'</ul></details>'}).join('')+'</div>';
